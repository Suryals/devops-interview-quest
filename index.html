group 0 (root group), and your image runs under any assigned UID.","SCC admission matches by users/groups (usually via the pod's service account), then picks by priority, then most-restrictive, then name — grant extra SCCs to service accounts, never to all users."],"methods":["oc get scc && oc describe scc restricted-v2","oc get ns <project> -o yaml | grep sa.scc  (view UID/GID range annotations)","oc adm policy add-scc-to-user anyuid -z <serviceaccount> -n <project>","oc adm policy who-can use scc/privileged","oc get pod <pod> -o yaml | grep openshift.io/scc  (which SCC admitted it)","oc adm policy scc-subject-review -u <user> -f pod.yaml","oc rsh <pod> id  (see the arbitrary UID + groups at runtime)"],"intro":["In vanilla Kubernetes, if your manifest doesn't set a securityContext, containers run as whatever user the image says — very often root. OpenShift refuses that by default. Security Context Constraints (SCCs) are OpenShift's admission-time policy objects (predating and still coexisting with Pod Security Admission) that decide what security settings a pod is ALLOWED to request: which UIDs, which Linux capabilities, whether it can be privileged, which volume types and seccomp/SELinux options it may use. If a pod's requested (or defaulted) security context can't be satisfied by any SCC its service account has access to, the pod is rejected or mutated at admission.","The default for ordinary workloads is restricted-v2. It forbids running as root, forces allowPrivilegeEscalation=false, drops ALL Linux capabilities (a container may re-add only NET_BIND_SERVICE), requires the runtime/default seccomp profile, and — the famous part — assigns the container an arbitrary UID from a per-project range. Each project's namespace carries an annotation like openshift.io/sa.scc.uid-range: 1000680000/10000; the admission plugin picks the first UID of that range and injects it as runAsUser. Your container might run as UID 1000680000 today and a different range in another project. This is a defense-in-depth stance: even if a container escapes, it's a random unprivileged UID on the host.","This is why 'works on Docker/kind, CrashLoops on OpenShift' is the classic interview scenario. Images that assume UID 1000 (or root) own their files — /var/lib/app, /var/cache/nginx, $HOME — suddenly run as UID 1000680000, which owns nothing and appears in no /etc/passwd. Writes fail with EACCES, servers can't bind port 80 (<1024 needs NET_BIND_SERVICE), and startup scripts that call useradd or chown die. The right answer is almost never 'grant anyuid'; it's to build OpenShift-friendly images."],"facts":["restricted-v2 concretely enforces: runAsUser MustRunAsRange (UID injected from the namespace's openshift.io/sa.scc.uid-range annotation), MustRunAs SELinux labels from openshift.io/sa.scc.mcs, requiredDropCapabilities: ALL with only NET_BIND_SERVICE allowed back, allowPrivilegeEscalation=false, no privileged mode, no host network/PID/IPC, and seccompProfile runtime/default. It exists (vs legacy 'restricted') to align with Pod Security 'restricted' — v2 is what fresh 4.11+ clusters hand to authenticated users.","An image that assumes UID 1000 breaks because the arbitrary UID (e.g. 1000680000) doesn't match any file ownership baked into the image: directories chowned to 1000 are unwritable, and the UID has no /etc/passwd entry so software that calls getpwuid() (ssh, some Java/Python libs) errors out. The fix pattern in the Dockerfile: don't set a numeric USER you depend on for ownership; instead 'RUN chgrp -R 0 /app /var/run/app && chmod -R g=u /app /var/run/app'. OpenShift always adds the arbitrary UID to group 0 (root GROUP, not root user — GID 0 confers no privilege by itself), so group-writable-by-0 means any assigned UID can write.","SCC selection is a two-step: first, admission gathers every SCC the requesting identity can 'use' — matched via the SCC's users/groups fields or RBAC 'use' verb on the scc resource, evaluated for the deployment controller + pod's service account, not just the human who ran oc apply. Then it sorts candidates by priority (highest wins), then by most restrictive, then alphabetically by name, and applies the first one that can validate/mutate the pod. This is why a pod's actual SCC shows up in the openshift.io/scc annotation and why an unexpectedly-high-priority SCC (like anyuid, priority 10) can 'steal' pods once a service account is granted it.","Granting is per-service-account by design: 'oc adm policy add-scc-to-user anyuid -z myapp-sa -n myproject' (modern style: create a ClusterRole with verbs [use] on that SCC and RoleBind it to the SA). Granting anyuid to system:authenticated or to the 'default' SA of a project is a classic audit finding — every pod in that project silently gains root-capable admission, and because anyuid has priority 10 it outranks restricted-v2 even for pods that didn't ask for root.","privileged is the nuclear SCC: privileged mode, host namespaces, host paths, all capabilities, any UID, unconfined seccomp. It exists for infrastructure daemonsets (CNI, storage drivers, node exporters) that genuinely manage the host. Granting it to an app team because 'the container needs to write a file' is the canonical wrong answer — a privileged container is effectively root on the node, so the interview-grade response is: diagnose WHAT fails (usually file ownership or a single capability) and grant the narrowest thing, often nothing but an image fix or an emptyDir/fsGroup tweak.","SCCs coexist with Kubernetes Pod Security Admission on OpenShift: PSA runs too, and OpenShift syncs a namespace's PSA warn/audit labels from the SCCs available to its service accounts. Practical effect: you may see PSA warnings ('would violate PodSecurity restricted:latest') even when the SCC admits the pod. SCC remains the enforcing mechanism for workloads; PSA labels are the K8s-standard signal layered on top — knowing both exist and which one actually rejected your pod is a strong senior signal."],"more":["Debug flow when a pod won't admit: the ReplicaSet events say 'unable to validate against any security context constraint' with per-SCC reasons (e.g. 'runAsUser: Invalid value: 0'). Check 'oc get events', then which SCCs the SA can use with 'oc adm policy scc-subject-review -z <sa> -f pod.yaml' — it prints the SCC that would admit the pod, or none.","Volume permissions are the other half of arbitrary-UID pain: for PVCs, set pod.spec.securityContext.fsGroup so the kubelet chowns/chmods the mounted volume to that group on attach; on OpenShift, fsGroup must fall within the namespace's openshift.io/sa.scc.supplemental-groups range under restricted-v2. CSI drivers with fsGroupChangePolicy support make this fast even on large volumes.","nonroot-v2 is the middle ground people forget: it allows any explicit non-zero UID (RunAsNonRoot) without the namespace-range restriction — right for vendor images that hardcode USER 1001 with matching file ownership. Grant nonroot-v2 to that workload's SA instead of anyuid.","Never edit the built-in SCCs (adding users to restricted-v2's users list, loosening its caps) — the CVO/operators reconcile them back, and mutating shared defaults changes admission for the whole cluster. The supported pattern is creating a custom SCC (e.g. clone restricted-v2 plus one capability) and granting it narrowly.","Priority subtlety worth quoting: among SCCs with equal priority, admission prefers the MOST restrictive that still validates the pod — so granting an extra permissive SCC doesn't loosen pods that don't need it, except anyuid's priority 10 which deliberately outranks, so that images with a baked-in USER keep their UID rather than being mutated into the project range.","Builds are why builder/deployer SAs exist per project: S2I/docker builds run with the builder SA under a privileged-ish pipeline path managed by the platform, which is one reason arbitrary user-supplied Dockerfile builds on-cluster are governance-sensitive and often disabled in hardened clusters."],"trap":"Reaching for 'oc adm policy add-scc-to-user anyuid' (or worse, privileged) as the fix for permission-denied errors. That converts an image bug into a cluster-wide security regression — anyuid's priority 10 means it captures every pod of that SA thereafter. The expected senior answer: read the actual error, fix the image (group-0 ownership, chmod g=u, no low ports, no fixed UID), use fsGroup for volumes, and reserve SCC grants — scoped to one SA, narrowest SCC (nonroot-v2 before anyuid) — for third-party images you can't rebuild.","wire":"# Namespace annotations that drive arbitrary UID assignment\\n$ oc get ns team-a -o jsonpath='{.metadata.annotations}' | jq\\n{\\n  \\"openshift.io/sa.scc.mcs\\": \\"s0:c26,c15\\",\\n  \\"openshift.io/sa.scc.supplemental-groups\\": \\"1000680000/10000\\",\\n  \\"openshift.io/sa.scc.uid-range\\": \\"1000680000/10000\\"\\n}\\n\\n$ oc rsh deploy/web id\\nuid=1000680000(1000680000) gid=0(root) groups=0(root),1000680000\\n\\n# Dockerfile fix for arbitrary-UID compatibility\\nFROM registry.access.redhat.com/ubi9/nginx-124\\nCOPY app/ /opt/app-root/src/\\nRUN chgrp -R 0 /opt/app-root && chmod -R g=u /opt/app-root\\nEXPOSE 8080          # not 80: no NET_BIND_SERVICE by default\\nUSER 1001            # placeholder; runtime UID is assigned, GID 0 does the work"},{"key":"routes","cat":"server","icon":"globe","t":"Routes & TLS Termination","s":"OpenShift's HAProxy-backed ingress — edge vs passthrough vs re-encrypt, sharding, and cert pitfalls","quick":["A Route maps a hostname to a Service; the IngressController's HAProxy router pods watch Routes and reload their config — no cloud LB controller or Ingress class wrangling needed.","Three TLS modes: edge (router terminates, plain HTTP to pod), passthrough (TLS flows through via SNI, pod terminates), re-encrypt (router terminates, then re-TLS to the pod).","Default hostname is <route>-<namespace>.apps.<cluster-domain>; custom hosts need DNS pointing at the router AND a cert the router can serve."],"methods":["oc expose service web  (plain HTTP route)","oc create route edge web --service=web --hostname=web.example.com --cert=tls.crt --key=tls.key","oc create route passthrough secure --service=secure-svc","oc create route reencrypt api --service=api --dest-ca-cert=svc-ca.crt","oc get route web -o yaml && oc describe route web  (check 'exposed on router' status)","oc annotate route web haproxy.router.openshift.io/timeout=120s","oc -n openshift-ingress get pods -o wide  (router pods) / oc get ingresscontroller -n openshift-ingress-operator"],"intro":["Kubernetes gives you the Ingress API but not an implementation — you pick and operate nginx-ingress, Traefik, an ALB controller, etc. OpenShift ships the implementation: the Ingress Operator deploys an IngressController, which runs HAProxy 'router' pods (in openshift-ingress) typically exposed via a cloud LoadBalancer or on bare-metal via VIPs. The user-facing API is the Route — an OpenShift resource older than Ingress and still its daily-driver equivalent. A Route says 'hostname X (and optional path) goes to Service Y on port Z', and the router pods watch Routes cluster-wide and rewrite their HAProxy config live.","Routes handle TLS as a first-class field instead of a Secret reference. spec.tls.termination picks one of three modes. Edge: the router holds the cert/key, terminates TLS, and forwards plain HTTP to the pod — simplest, fine when you trust the cluster network, and lets the router serve the wildcard *.apps default cert so you don't even need to provide one. Passthrough: the router never decrypts; it uses the TLS SNI header to pick the backend and streams encrypted bytes to the pod, which must terminate TLS itself — required for mTLS to the app or non-HTTP TLS protocols, but you lose L7 features (no path routing, no header-based sticky sessions). Re-encrypt: the router terminates client TLS, then opens a NEW TLS connection to the pod, verified against destinationCACertificate — end-to-end encryption while keeping L7 routing.","Every cluster has a default apps domain (*.apps.<cluster>.<base-domain>) with DNS wildcarding to the router's load balancer, and the router carries a wildcard certificate for it. Any Route without an explicit host gets <name>-<namespace>.apps... and TLS 'just works' under edge termination. The moment you want www.mycompany.com, you own two new problems: DNS (a CNAME to the router LB) and certificates (either paste cert/key into the Route or automate with cert-manager) — which is where most real-world Route incidents live."],"facts":["The router is plain HAProxy under operator management: router pods hold the config for ALL routes in shards they serve, and the openshift.io/host.generated logic plus route status tell you whether a route was admitted. Route admission also enforces hostname uniqueness — the oldest route claims a host; a second route with the same host in another namespace is rejected (status shows HostAlreadyClaimed) unless the IngressController's routeAdmission policy (InterNamespaceAllowed) permits cross-namespace sharing. This is a real multi-tenant gotcha: a squatter route in a scratch namespace can block a production hostname.","Edge termination fields live inline in spec.tls: certificate, key, and optional caCertificate (intermediate chain). insecureEdgeTerminationPolicy controls port-80 behavior — None/empty (refuse), Allow (serve plain HTTP too), Redirect (301 to HTTPS, the near-universal production choice). Because the cert is in the Route object itself (readable by anyone with route read access), teams increasingly prefer cert-manager writing a Secret plus the newer route support/Ingress-with-secret pattern; quoting that tradeoff shows security awareness.","Passthrough works purely on SNI: HAProxy inspects the ClientHello, matches server name to a route host, and TCP-proxies the still-encrypted stream. Consequences worth reciting: no path-based routing, no HTTP header injection (no X-Forwarded-For unless the app gets it via PROXY protocol), no router-served redirect from HTTP, and clients that don't send SNI (ancient libraries, some health checkers, raw IP requests) can't be routed at all — they hit the default backend or get dropped.","Re-encrypt needs the backend to serve TLS and the router to trust it: destinationCACertificate must validate the pod's serving cert, including its SAN matching the internal service name. The idiomatic OpenShift trick is the service-ca operator — annotate the Service with service.beta.openshift.io/serving-cert-secret-name=my-tls and the platform mints and rotates a serving cert for <svc>.<ns>.svc signed by the cluster's service CA; routes can then omit destinationCACertificate because the router trusts the service CA by default. That combination (service-ca + reencrypt) is the go-to for 'encrypted in transit end-to-end, zero cert toil'.","Route sharding scales and isolates ingress: you run multiple IngressControllers, each with routeSelector/namespaceSelector label matchers and its own domain and LB. Classic uses — an 'internal' shard on a private LB for admin tools, a PCI shard on dedicated nodes, or per-BU shards so one team's traffic surge or bad config can't reload-storm the shared router. A route lands on a shard when its labels match; a route matching no shard sits unadmitted with no router status, which looks exactly like 'route created but 503/NXDOMAIN' until you check route status.","Common cert failures map cleanly to modes: browser shows the *.apps wildcard cert for your custom domain = you created an edge route without cert/key (or DNS points at the wrong shard); 'intermediate not trusted' on some clients = missing caCertificate chain in the route; 503 on a re-encrypt route with healthy pods = router can't validate the backend cert (expired serving cert, SAN mismatch after a service rename, or wrong destinationCACertificate); passthrough suddenly failing after an app image change = the app stopped terminating TLS on that port. Being able to run this mapping from symptom to mode is exactly what the interviewer is probing."],"more":["Routes vs Ingress on OpenShift: Ingress objects work — the router translates an admitted Ingress into Route objects behind the scenes (visible with ownerReferences), so portable Helm charts deploy fine. Routes still expose OpenShift-only levers via fields and annotations: per-route HAProxy timeouts (haproxy.router.openshift.io/timeout), IP allowlists (ip_whitelist), rate limits, sticky-session cookie control, and weighted alternateBackends for simple blue/green (route-level traffic split across two services).","Wildcard routes (spec.wildcardPolicy: Subdomain, serving *.foo.apps...) are disabled by default; the IngressController must allow them (routeAdmission.wildcardPolicy: WildcardsAllowed). They're powerful for per-tenant subdomains but interact with host-claim ordering, so most shops keep them off outside a dedicated shard.","The default ingress cert is replaceable cluster-wide: put your CA-signed wildcard cert in a Secret in openshift-ingress and set it as defaultCertificate on the IngressController — the standard day-2 task so users stop seeing the self-signed cluster CA. The API server cert (api.<cluster>:6443) is configured separately; conflating the two is a common junior mistake.","Router debugging toolbox: 'oc describe route' shows admission status per router; 'oc -n openshift-ingress rsh <router-pod>' then inspect haproxy.config to see the actual generated backend; 'oc logs' on router pods shows reload events and template errors; curl with --resolve lets you test a hostname against a specific router IP before DNS changes.","Timeout mismatches are a classic incident: HAProxy's default server timeout (30s) kills long polls/websocket-ish requests with 504s that the app never sees — fix per-route with haproxy.router.openshift.io/timeout, and remember there may be a cloud LB idle timeout in front of the router with its own, different limit.","For non-HTTP TCP (databases, MQTT, gRPC-over-raw-TCP without TLS/SNI) Routes don't apply — the answer is a LoadBalancer/NodePort Service, MetalLB on bare metal, or (for TLS-wrapped protocols with SNI) a passthrough route; knowing when a Route is the WRONG tool rounds out the mental model."],"trap":"Treating 503 'Application is not available' as an app problem. That page is served BY the router, so it means the router has the route but no ready endpoints — check Service selector, targetPort vs containerPort, and pod readiness first. And on re-encrypt, remember the ROUTER is the TLS client to your pod: an expired or SAN-mismatched backend serving cert 503s the route while 'curl localhost' inside the pod works perfectly, which misleads people into debugging the app for hours.","wire":"apiVersion: route.openshift.io/v1\\nkind: Route\\nmetadata:\\n  name: api\\n  namespace: team-a\\n  annotations:\\n    haproxy.router.openshift.io/timeout: 120s\\nspec:\\n  host: api.example.com\\n  to:\\n    kind: Service\\n    name: api\\n    weight: 100\\n  port:\\n    targetPort: 8443\\n  tls:\\n    termination: reencrypt\\n    insecureEdgeTerminationPolicy: Redirect\\n    # destinationCACertificate omitted: backend uses\\n    # service-ca serving cert, trusted by router\\nstatus:\\n  ingress:\\n  - host: api.example.com\\n    routerName: default\\n    conditions:\\n    - type: Admitted\\n      status: \\"True\\""},{"key":"ocbuilds","cat":"server","icon":"box","t":"ImageStreams, Builds & Deploy Flow","s":"OpenShift's image supply chain — ImageStream tag tracking, S2I builds, triggers, and the DC-to-Deployment shift","quick":["An ImageStream is a named pointer table: tags map to immutable image SHAs, can track external registries on a schedule, and fire triggers into builds and deployments when they move.","S2I (source-to-image) builds an image from source with NO Dockerfile: a builder image's assemble script injects your code — 'oc new-app <git-url>' wires the whole chain in one command.","DeploymentConfigs are the deprecated OpenShift-native predecessor of Deployments; new work uses Deployments, with image trigger annotations replacing DC ImageChange triggers."],"methods":["oc new-app https://github.com/org/app --name=web  (detects language, creates BC+IS+Deployment+Svc)","oc new-app --image=quay.io/org/app:v2 --name=web","oc start-build web --follow  (manual build; add --from-dir=. for local source)","oc get is,istag && oc describe is web","oc tag quay.io/org/app:v2 web:prod --scheduled  (track external tag, poll ~15min)","oc import-image web:latest --from=quay.io/org/app:latest --confirm","oc set triggers deploy/web --from-image=web:prod -c web","oc logs -f bc/web  (build logs)"],"intro":["Vanilla Kubernetes treats images as opaque strings — 'myrepo/app:v2' — and nothing in the cluster knows or cares when the image behind a tag changes. OpenShift adds an indirection layer: the ImageStream. Think of it as a DNS zone for images inside your project: each ImageStreamTag (e.g. web:prod) records the exact SHA it currently points at, keeps tag history, and can either receive pushes (from builds pushing to the internal registry) or TRACK a tag in an external registry, re-importing on a schedule. Because the cluster now observes tag movement as API events, it can react: image change triggers kick off new builds or roll out deployments the moment a tag moves.","BuildConfigs make the cluster itself a CI executor. A BuildConfig declares a source (git repo, binary upload), a strategy, and an output (usually an ImageStreamTag). The signature strategy is S2I, source-to-image: instead of writing a Dockerfile, you pick a builder image (python:3.12-ubi9, nodejs, java) that contains the toolchain plus an 'assemble' script; the build pod runs assemble to compile/install your source INTO a copy of the builder image, sets the 'run' script as entrypoint, and pushes the result. Docker-strategy builds (from a real Dockerfile) and Pipeline (now externalized to Tekton/OpenShift Pipelines) also exist. Developers get git-push-to-running-app without owning Dockerfiles; platform teams get centralized, patchable builder images.","'oc new-app' is the front door that assembles all of this: given a git URL it detects the language, creates an ImageStream + BuildConfig (S2I from the matching builder) + Deployment + Service, and wires triggers so a completed build rolls the deployment. Given an existing image it skips the build pieces. Historically the deploy object was a DeploymentConfig (DC) — OpenShift's pre-Deployment API with triggers and lifecycle hooks built in. DCs are deprecated (officially since 4.14); modern clusters use standard Deployments, with the image-trigger behavior recreated via the image.openshift.io/triggers annotation. Expect interviewers to probe whether you know both the legacy and the current shape."],"facts":["ImageStreamTags resolve to SHAs at consumption time, which kills the mutable-tag reproducibility problem: when a Deployment's trigger fires on web:prod moving, OpenShift stamps the container image with the full sha256 digest, so rollbacks and audits reference immutable content even though humans deal in friendly tags. Tag history is kept on the ImageStream, so 'oc describe is web' shows exactly when prod moved and from what to what — a mini supply-chain audit log for free.","External tracking: 'oc tag quay.io/org/app:v2 web:v2 --scheduled' makes the cluster poll the external registry (default roughly every 15 minutes) and re-import when the digest changes; 'oc import-image' does it once on demand. referencePolicy matters here: 'source' means pods pull straight from quay.io, while 'local' rewrites pulls through the internal registry, which caches the image and lets you keep pulling if the external registry is down or rate-limiting — 'local' plus a pull-through cache is the standard answer to Docker Hub rate-limit incidents.","S2I mechanics concretely: the build pod pulls the builder image, injects source at /tmp/src, runs the builder's assemble script as the build user (installing deps, compiling), commits the result with the run script as CMD, and pushes to the output ImageStreamTag in the internal registry. Incremental builds can reuse artifacts (e.g. node_modules, .m2) from the previous image to cut build time. The big operational win: when a CVE lands in the base, you patch ONE builder image and mass-rebuild every dependent app via the ImageChange trigger chain, instead of chasing hundreds of team-owned Dockerfiles.","Triggers form a pipeline without a pipeline engine: a BuildConfig with an ImageChange trigger on the builder image rebuilds when the builder updates; the build pushes to web:latest; a Deployment annotated with image.openshift.io/triggers (or a legacy DC ImageChange trigger) rolls out when web:latest moves. GitHub/GitLab/generic webhook triggers on the BuildConfig complete the loop from git push. Knowing this chain lets you answer 'how did a deployment happen with no CI run?' — something moved an imagestream tag.","DeploymentConfig vs Deployment differences that still bite during migrations: DCs use ReplicationControllers (not ReplicaSets), support lifecycle hooks (pre/mid/post exec pods) and the Custom/Recreate/Rolling strategies with hooks, and have 'oc rollout latest dc/...' semantics; Deployments get richer rollout controls (maxSurge/maxUnavailable via RollingUpdate), are watched by standard K8s tooling (HPA behaviors, kubectl rollout), and need the trigger annotation for imagestream integration. DCs also had the 'automatic: false' trap where a tag update silently does NOT deploy until manually rolled.","The internal registry is the hub: builds push to image-registry.openshift-image-registry.svc:5000/<project>/<imagestream>, and pull auth inside the cluster is projected automatically via the SA's dockercfg — that's why 'oc new-app' output runs without any imagePullSecret work. Cross-project pulls need explicit RBAC: grant system:image-puller in the source project to the consuming project's SA ('oc policy add-role-to-user system:image-puller system:serviceaccount:app-prod:default -n shared-images'), the canonical fix for cross-namespace ImagePullBackOff on internal images."],"more":["Binary builds ('oc start-build web --from-dir=. ' or --from-file=app.jar) upload local content instead of pulling git — the standard trick for building from CI artifacts (Jenkins builds the jar, OpenShift builds the image) or for iterating without pushing commits.","Build resource governance: builds run as pods, so they consume project quota; BuildConfig supports resources, completionDeadlineSeconds, and successfulBuildsHistoryLimit/failedBuildsHistoryLimit. Clusters can cap concurrent builds and admins can disable Docker-strategy builds entirely (arbitrary Dockerfiles on-cluster are a governance concern).","Chained builds pattern: a first build compiles (S2I with the full JDK), a second Docker-strategy build copies just the artifact into a slim runtime image via source images — OpenShift's native answer to multi-stage builds when the S2I builder alone would ship a fat toolchain.","ImageStream consumption from plain K8s objects requires resolution: the image.openshift.io/triggers annotation on Deployments/StatefulSets/CronJobs both updates the field on tag movement and is how you reference an istag from resources that only accept plain image strings; 'oc set triggers' writes it for you.","Pruning is a real day-2 duty: every build and tag movement accumulates layers in the internal registry; 'oc adm prune images' / 'oc adm prune builds' (or the imagepruner CR for scheduled pruning) prevent the registry PVC from filling — registry-full presents as failed pushes at the END of otherwise-green builds.","Modern positioning to volunteer in interviews: net-new platforms increasingly build in external CI (Tekton/GitHub Actions with buildah/ko) and push to an external registry, using ImageStreams only as tracking mirrors — or skip them. Knowing S2I/BC deeply AND knowing when the ecosystem has moved past them reads as senior; also note Shipwright/Builds for OpenShift as the successor build API."],"trap":"Assuming a moved tag equals a deployment. Each hop is separately wired: an external image update does nothing until the scheduled import runs (or you oc import-image); a moved ImageStreamTag does nothing to a Deployment without the trigger annotation (or with a DC trigger set automatic: false); and 'latest' in ImageStream-land is just a tag name, not automatically the newest build. When someone says 'we pushed v2 but prod still runs v1', walk the chain: registry digest → istag import → trigger → rollout — the break is at exactly one of those joints.","wire":"$ oc new-app https://github.com/org/flask-api --name=flask-api\\n--> Found image 6f1b2a3 (python:3.12-ubi9) in image stream \\"openshift/python\\"\\n    Python 3.12 builder detected\\n--> Creating resources ...\\n    imagestream.image.openshift.io \\"flask-api\\" created\\n    buildconfig.build.openshift.io \\"flask-api\\" created\\n    deployment.apps \\"flask-api\\" created\\n    service \\"flask-api\\" created\\n--> Build scheduled, use 'oc logs -f bc/flask-api' to track\\n\\n$ oc get istag flask-api:latest\\nNAME               IMAGE REFERENCE                                                        UPDATED\\nflask-api:latest   image-registry.openshift-image-registry.svc:5000/team-a/flask-api@sha256:9c4e...   2m ago\\n\\n$ oc get deploy flask-api -o jsonpath='{.metadata.annotations.image\\\\.openshift\\\\.io/triggers}'\\n[{\\"from\\":{\\"kind\\":\\"ImageStreamTag\\",\\"name\\":\\"flask-api:latest\\"},\\"fieldPath\\":\\"spec.template.spec.containers[?(@.name==\\\\\\"flask-api\\\\\\")].image\\"}]"},{"key":"slo","cat":"concept","icon":"gauge","t":"SLIs, SLOs & Error Budgets","s":"Measuring reliability as good/total events and spending the gap deliberately","quick":["SLI = good events / total events; SLO = target for that ratio over a window; error budget = 100% minus the SLO, a spendable allowance for failure.","Monthly budget shrinks 10x per nine: 99.9% allows ~43.2 minutes of full downtime in 30 days, 99.95% allows 21.6, and 99.99% only 4.32.","The error budget policy is a pre-agreed contract: when the budget is spent, feature releases pause and engineering shifts to reliability work."],"methods":[],"intro":["Think of reliability like a prepaid phone plan. A 100% reliable service is like demanding unlimited talk time for free — impossible and wasteful to pursue, because your users already tolerate small failures (their WiFi drops more often than your service does). Instead, SRE says: pick a target below 100%, and treat the gap between that target and perfection as a budget you are allowed — even encouraged — to spend on risky things like deploys, migrations, and experiments.","The measurement starts with a Service Level Indicator (SLI): a carefully defined quantitative measure, almost always expressed as good events divided by total events. 'Fraction of HTTP requests that returned non-5xx in under 300 ms' is an SLI; 'CPU is below 80%' is not, because no user ever complained about your CPU. The Service Level Objective (SLO) is the target you set for that SLI over a window, like '99.9% over a rolling 30 days'. An SLA is the contractual, lawyer-visible version with penalties attached — SLOs are internal and should be tighter than any SLA.","Where you measure matters as much as what. Google's SRE book warns that server-side metrics alone can miss real user pain — a broken JavaScript bundle makes the page unusable while your backend reports 100% success. Measure as close to the user as practical: at the load balancer for coverage of requests that never reach a healthy backend, supplemented by client-side or black-box probing for the full picture."],"facts":["The canonical SLI shape is good events / total events, which forces you to define both terms precisely. For 'availability' that might be (requests with status != 5xx) / (all requests); for latency it is (requests served under 300 ms) / (all requests) — note that a latency SLI is itself a ratio, not a percentile, which makes it composable with the same error-budget math as availability.","Error budget arithmetic: budget = (1 - SLO) x window. A 30-day month has 43,200 minutes, so 99.9% leaves 0.1% x 43,200 = 43.2 minutes of full outage (or equivalently 0.1% of all requests failing); 99.95% leaves 21.6 minutes; 99.99% leaves just 4.32 minutes — less than one incident's detection time for most teams, which is why 'four nines' implies automated mitigation, not human response.","Measurement location changes the number you get. Measuring at the application server misses requests dropped by an overloaded load balancer or a dead instance; measuring at the load balancer misses client-side failures like DNS, TLS, or broken frontend code. The SRE book recommends server-side collection close to the edge plus client-side/black-box probes, because each layer you move toward the user captures failure modes the layer behind it cannot see.","SLO targets should come from user needs, not current performance. If you set the SLO to whatever the dashboard shows today, you enshrine accidents as promises — Google's Chubby lock service famously performed so far above its SLO that dependent teams built assumptions on it, so SRE began deliberately taking Chubby down to burn budget and flush out those hidden dependencies.","The error budget policy is a contract signed before the incident, not negotiated during it. A typical policy: while budget remains, dev teams ship at will; when the 30-day budget is exhausted, feature releases freeze and engineering effort moves to reliability until the rolling window recovers. This converts the eternal dev-vs-ops fight over 'is it safe to ship?' into arithmetic both sides agreed to in advance.","Window choice shapes behavior: rolling windows (last 30 days) give a continuously updating signal and avoid the 'budget resets at midnight on the 1st' gaming problem of calendar windows, but calendar windows align better with business reporting. Shorter windows (7 days) make the budget recover faster after an incident but make a single bad hour dominate the number."],"more":["Keep it simple and few: the SRE book advises maintaining only as many SLOs as you can actually defend and avoiding complex aggregations — every SLO should be able to trigger a real decision, otherwise delete it.","Different system types need different SLI menus: user-facing serving systems care about availability, latency, and throughput; storage systems add durability (is the data still there years later?); big-data pipelines care about throughput and end-to-end freshness/latency; and correctness matters for everyone.","Standardize SLI templates across the org — default aggregation intervals, measurement frequency, which requests count (e.g., exclude health checks and bots?) — so every team is not re-litigating definitions and numbers are comparable across services.","SLOs are a control loop: monitor the SLI, compare to the SLO, decide whether action is needed, take the action. Publishing the SLO sets user expectations, which cuts both ways — over-delivering for months creates implicit dependencies on the better number.","Percentile targets beat averages: a mean latency of 100 ms can hide a 10-second p99 that your heaviest users hit constantly. Setting objectives on p95/p99 (or better, on the good-under-threshold ratio) keeps the tail visible.","Leave a safety margin: run an internal SLO tighter than the externally promised SLA, so an internal SLO breach is a warning light, not a contractual penalty."],"trap":"Quoting 'we have 99.9% availability' without a window or an SLI definition. Interviewers probe: 99.9% of what (requests? minutes? probes?), measured where (LB? client?), over what window (calendar month? rolling 30 days?) — each choice changes both the number and how much budget 43 minutes of downtime actually consumes.","wire":"Error budget math — 99.9% SLO, rolling 30 days\\n----------------------------------------------\\nWindow           = 30 d x 24 h x 60 m = 43,200 min\\nBudget           = (1 - 0.999) x 43,200 = 43.2 min\\n\\nIncident: full outage, 14:02 -> 14:20 = 18 min\\nBudget consumed  = 18 / 43.2  = 41.7% of monthly budget\\nBudget remaining = 25.2 min\\n\\nSame incident vs other SLOs:\\n  99.95% -> 21.6 min budget -> 18 min = 83% consumed\\n  99.99% ->  4.32 min budget -> BLOWN 4x over\\n\\nPolicy trigger: >33% burned by one incident\\n  -> postmortem required, release freeze reviewed"},{"key":"alerting","cat":"concept","icon":"alert","t":"SLO Alerting & Burn Rates","s":"Multi-window multi-burn-rate paging instead of noisy raw thresholds","quick":["Burn rate = how many times faster than 'exactly exhaust the budget at window end' you are burning; burn rate 1 on a 30-day SLO exhausts the budget in exactly 30 days.","SRE Workbook starting point for a 99.9% SLO: page at 14.4x over 1h (2% of budget) and 6x over 6h (5%); ticket at 1x over 3 days (10%) — each paired with a short window (5m/30m/6h) to confirm the burn is still active.","Page on symptoms (users hurting), ticket on causes; every page must be urgent, actionable, and require human intelligence — otherwise it is training your on-call to ignore pages."],"methods":[],"intro":["Imagine your error budget as a bathtub draining. A raw threshold alert ('error rate > 0.1% for 10 minutes') is like an alarm that screams every time a single drop leaves the tub — technically correct, practically useless. The SRE Workbook walks through six alerting approaches and shows why the naive ones fail: a 10-minute window at the SLO threshold has excellent detection time but terrible precision, paging you for blips that would consume a fraction of a percent of the monthly budget. Adding a 'for: 1h' duration clause fixes noise but destroys recall — a 100% outage waits a full hour before paging.","The fix is to alert on how fast the tub is draining: the burn rate. Burn rate 1 means you are consuming budget at exactly the rate that empties it at the end of the SLO window; burn rate 10 empties it in a tenth of the window. On a 99.9% SLO, burn rate 1 corresponds to a 0.1% error rate, burn rate 10 to 1%, and a total outage (100% errors) is a 1000x burn that torches the whole 30-day budget in about 43 minutes.","The recommended final form (approach 6 in the Workbook) is multi-window, multi-burn-rate: several severity tiers, each firing only when both a long window and a short window exceed the same burn-rate threshold. The long window gives statistical confidence the burn is real; the short window (roughly 1/12 the long window) confirms it is still happening right now, so the alert resets quickly after recovery instead of paging you for an hour about a problem that already ended."],"facts":["The burn-rate formula: to page when X% of the budget is consumed in W hours of a P-hour SLO period, the threshold is (X% / W) x P. The classic example: paging when 2% of a 30-day (720-hour) budget burns in 1 hour gives (0.02 / 1) x 720 = 14.4x — on a 99.9% SLO that is a sustained 1.44% error rate, unambiguously an incident.","The Workbook's recommended starting tiers for a 99.9% SLO: PAGE at burn rate 14.4 over a 1h long / 5m short window (2% budget consumed), PAGE at burn rate 6 over 6h/30m (5% consumed), and TICKET at burn rate 1 over 3d/6h (10% consumed). The 1x-over-3-days tier catches slow leaks — a 0.1% background error rate that no fast alert would ever see but that silently exhausts the month's budget.","The short window exists to fix reset time: with only a 1-hour long window, a 15-minute outage keeps the alert firing for another ~45 minutes after full recovery because the bad data is still inside the window. Requiring the 5-minute short window to also exceed the threshold means the alert clears within minutes of recovery, and the 1/12 rule (5m for 1h, 30m for 6h, 6h for 3d) is the Workbook's stated guideline.","Symptom-based alerts page, cause-based alerts inform. 'Users are receiving 5xx' is a symptom worth waking someone for; 'CPU is at 85%' is a cause that may or may not matter — the SRE book's monitoring chapter is explicit that pages should reflect user-visible impact, because a cause alert with no symptom is exactly the 3am page you resent and eventually mute.","Alert fatigue is a measurable failure mode, not a mood: every non-actionable page lowers the probability the on-call treats the next page as real (the crying-wolf effect), and Google's paging discipline requires every page to be urgent, actionable, novel, and to require intelligent human judgment — anything a script could handle should be automated, and anything that can wait until morning should be a ticket.","The golden signals — latency, traffic, errors, saturation — are the minimum monitoring surface for a user-facing system, and latency must be split by success/failure because fast 500s drag the 'average latency' down while users suffer. RED (Rate, Errors, Duration) is the request-centric restatement for services; USE (Utilization, Saturation, Errors) is the resource-centric one for infrastructure like disks and NICs."],"more":["Precision vs recall vocabulary for interviews: precision = fraction of alerts that were real incidents; recall = fraction of real incidents that alerted. Raw thresholds have high recall/low precision; long 'for:' durations have high precision/low recall; multi-window multi-burn-rate is the engineered compromise scoring well on both plus detection and reset time.","Detection-time math sells the design: at 14.4x burn a 1-hour window pages in minutes for a big spike, while a total outage (1000x burn) crosses the 14.4x threshold almost immediately — you never wait the full window because the threshold is on the rate, not on budget fully consumed.","Multiple burn rates without multiple windows (approach 5) works but resets slowly and can double-page — the higher tier fires, then the lower tier fires again during recovery; suppress lower severities while a higher one is active.","Low-traffic services break burn-rate math: at 10 requests/hour, one failure is a 10% error rate and a 100x burn. Mitigations include aggregating similar small services into one SLO, lengthening windows, generating synthetic probe traffic, or lowering the SLO to match statistical reality.","Black-box probing (curl from outside) catches what white-box metrics cannot — DNS, TLS, LB misconfiguration — but tells you nothing about why; use black-box to confirm user impact and white-box for diagnosis.","Alerting on absence matters: a service that stops reporting metrics looks like zero errors. Guard SLO alerts with an 'absent()' or dead-man's-switch alert so silent telemetry failure is itself a page."],"trap":"Saying 'I'd alert when the error rate exceeds the SLO' — that fires on every statistical blip and is the textbook wrong answer. The interviewer wants you to reach for burn rates, ideally citing the 14.4x/1h + 6x/6h page tiers and 1x/3d ticket tier, and to explain the short window's role in reset time.","wire":"# Prometheus: multiwindow multi-burn-rate, 99.9% SLO\\n# Page tier 1: 14.4x burn (2% budget in 1h)\\n- alert: ErrorBudgetBurnCritical\\n  expr: |\\n    (\\n      sum(rate(http_requests_total{code=~\\"5..\\"}[1h]))\\n        / sum(rate(http_requests_total[1h])) > 14.4 * 0.001\\n    and\\n      sum(rate(http_requests_total{code=~\\"5..\\"}[5m]))\\n        / sum(rate(http_requests_total[5m])) > 14.4 * 0.001\\n    )\\n  labels: {severity: page}\\n  annotations:\\n    summary: \\"Burning >2% of 30d error budget per hour\\"\\n# Tier 2: 6x over 6h/30m -> page | Tier 3: 1x over 3d/6h -> ticket"},{"key":"incidents","cat":"concept","icon":"radio","t":"Incident Management","s":"Incident command roles, mitigate-first doctrine, and clean handoffs","quick":["Roles from Google's ICS-derived model: Incident Commander coordinates and delegates, Ops Lead's team is the ONLY group changing the system, Communications Lead updates stakeholders, Planning handles logistics and the long tail.","Mitigate first, understand later: stop the bleeding with a generic action — roll back, flip the feature flag off, shed load, fail over — root cause analysis belongs to the postmortem, not the outage.","Declare an incident early using preset criteria (second team needed, customer-visible outage, or unsolved after ~1 hour), and hand off explicitly: 'You're now the incident commander' plus acknowledged confirmation."],"methods":[],"intro":["An unmanaged incident looks like a kitchen fire where everyone grabs a different extinguisher, two people spray each other, and nobody calls the fire department. Google's incident management framework is borrowed from emergency services' Incident Command System (ICS): the insight is that during a crisis, coordination is a full-time job that must be separated from hands-on-keyboard work. The moment the person debugging is also fielding executive questions and deciding priorities, both jobs are being done badly.","The structure has a few named roles. The Incident Commander (IC) holds the big picture: they assign work, track state, and make priority calls — critically, the IC does not debug. The Ops Lead runs the people actually touching production, and the SRE book is blunt that the operations team should be the only group modifying the system during an incident — freelancing fixes from the sidelines is how you turn one outage into two. The Communications Lead is the public face, sending periodic updates so stakeholders stop pinging the responders directly, and Planning handles longer-horizon work: filing bugs, arranging food and handoffs, and recording where the system has been hacked away from its normal state so it can be restored later.","The doctrine underneath all of it is mitigate first. Your instinct as an engineer is to understand the problem; the incident's need is to make users stop hurting. Those are different activities. Rolling back the last deploy, disabling the feature flag, draining traffic away from the bad region, or shedding low-priority load are all generic mitigations that work before you know the root cause — and the priority order is: stop the bleeding, restore service, and only then preserve evidence for the postmortem."],"facts":["Recursive separation of responsibilities is what lets the structure scale: when any role's workload exceeds one person, that leader requests staff and delegates, potentially spawning sub-incidents with their own leads reporting upward. This is why the same framework handles a two-person page and a multi-team regional outage — the org chart grows and shrinks with the incident instead of collapsing into a 40-person call where nobody owns anything.","Declare early using pre-agreed criteria rather than heroic judgment: Google's triggers are (1) you need to involve a second team, (2) the outage is customer-visible, or (3) the problem is still unsolved after an hour of focused analysis. The failure mode this prevents is the solo engineer grinding for three hours at 3am on something that a declared incident would have parallelized in twenty minutes — declaring an incident that turns out to be minor is cheap; the reverse is not.","Mitigation is a menu you rehearse in advance, ordered by speed and blast radius: rollback the suspect deploy (fastest when a recent change correlates), disable via feature flag (seconds, surgical), fail over to another region/replica (when the damage is localized), shed or throttle non-critical load (when the problem is capacity), and add capacity (slow, last resort). A strong interview answer names the trigger for each — e.g., 'errors started 10 minutes after a deploy, so rollback first and investigate the diff later'.","Communication runs on a cadence, not on demand: the Comms Lead posts updates at a fixed interval (e.g., every 30 minutes, even if the update is 'no change, next update at :30'), which stops executives and support teams from interrupting responders for status. The live incident state document — a concurrently editable doc with the freshest state at the top — is the single source of truth and later becomes the raw timeline for the postmortem.","Handoffs must be explicit and acknowledged: the SRE book's example is the outgoing IC saying 'You're now the incident commander, okay?' and waiting for a firm yes before dropping off. Ambiguous handoffs are how long incidents fail — everyone assumes someone else has command — and for multi-hour incidents, planned handoffs (follow-the-sun or fixed shifts) beat exhausted heroes making 2am decisions.","Severity levels exist to pre-decide the response envelope: a typical scheme is SEV1 (major customer-visible outage or data loss — full incident command, exec comms, all-hands mitigation), SEV2 (significant degradation or SLO burn — IC plus one or two responders), SEV3 (minor/contained — ticket-driven, business hours). Tying severity to error-budget burn rate makes the classification arithmetic instead of argument."],"more":["The war room / command post — physical room or a dedicated channel — centralizes coordination; the anti-pattern is the incident fragmenting across five DM threads where mitigations get attempted twice.","Preserve evidence after mitigation, not instead of it: snapshot logs, keep a broken instance cordoned rather than deleted, save graphs — but never delay restoration of service to collect forensics.","Practice is a first-class requirement: Google runs DiRT (Disaster Recovery Testing) exercises and 'Wheel of Misfortune' role-plays so the first time someone plays IC is not during a real SEV1; rotating roles across the team builds bench depth.","Watch emotional state as an operational signal: the SRE book explicitly tells responders to notice when they are overwhelmed and ask for help — panic produces exactly the risky, unreviewed production change that deepens outages.","Distinguish incident response from troubleshooting in your answers: the hypothetico-deductive debugging loop (observe, hypothesize, test) runs inside the Ops role, while the IC deliberately stays out of it to keep the big picture.","After the incident: the same state document seeds the postmortem, planning ensures temporary hacks (disabled checks, manual overrides, oversized capacity) are tracked and reverted — 'temporary' mitigations that live forever are a classic contributing factor to the next incident."],"trap":"Answering an outage scenario by diving into root-cause debugging ('I'd check the logs, then trace the query...'). Interviewers for on-call roles want the order inverted: declare, assign roles, mitigate with a generic action (rollback/flag/failover) to stop user pain, communicate on a cadence — and only then investigate. Saying 'root cause can wait for the postmortem' is a feature, not a dodge.","wire":"SEV1 timeline — checkout errors (real-shape example)\\n----------------------------------------------------\\n03:02  Page: ErrorBudgetBurnCritical (14.4x, checkout)\\n03:05  On-call acks; 5xx at 12%; budget burn confirmed\\n03:09  Deploy v483 shipped 02:48 -> correlation strong\\n03:10  INCIDENT DECLARED (customer-visible). On-call = IC\\n03:12  IC pages 2nd responder as Ops Lead; opens\\n       #inc-checkout + live state doc\\n03:15  MITIGATION: rollback v483 initiated (not debugging)\\n03:18  Comms Lead posts stakeholder update; cadence 30m\\n03:24  5xx falling 12% -> 0.4%; short-window alert clears\\n03:40  Error rate nominal 30 min; monitoring for regression\\n04:05  Incident closed. Impact: 22 min, ~9% of requests\\n04:10  Postmortem owner assigned; v483 diff quarantined"},{"key":"postmortem","cat":"concept","icon":"shield","t":"Blameless Postmortems","s":"Turning incidents into system fixes without destroying the information supply","quick":["Blameless = assume everyone acted with good intent on the information they had; investigate the system that made the mistake easy, not the person who made it.","A postmortem is a written record: impact, timeline, root cause(s) and contributing factors, what mitigated/resolved it, and action items with named owners and priorities.","Standard triggers: user-visible downtime beyond a threshold, any data loss, on-call manual intervention, resolution time over a bound, or a monitoring failure (incident found by a human, not an alert)."],"methods":[],"intro":["Aviation is the standard analogy, and it is the actual origin: pilots self-report near-misses to systems like NASA's ASRS because reporting is shielded from punishment — so the industry learns from thousands of free lessons. Invert the incentive and the data dries up instantly: if reporting a mistake gets you punished, you stop reporting, and the organization flies blind until the same latent failure kills someone. Blameless postmortems port that deal into software operations: honesty in exchange for safety.","The mechanism matters more than the slogan. 'Blameless' does not mean 'consequence-free' or 'nobody wrote the bad config'; it means the analysis assumes everyone involved had good intentions and did the right thing with the information they had at the time. The question is never 'why did Priya push the bad flag?' but 'why did the system let a single unreviewed flag flip take down checkout — where was the validation, the canary, the rollback?'. Human error is treated as a symptom of a system defect, because you cannot patch a human but you can patch a deploy pipeline.","Why blame destroys signal, concretely: the SRE book notes that in a finger-pointing culture, people will not bring issues to light for fear of punishment. Timelines arrive sanitized, the engineer who noticed the warning sign three weeks earlier stays quiet, and the postmortem converges on a comfortable fiction. The next incident then replays the same latent failure — you paid the full cost of the outage and received none of the learning."],"facts":["A complete postmortem contains: a summary with quantified impact (duration, users/requests affected, error budget consumed, revenue if known), a detailed timeline from first trigger through detection, escalation, mitigation and resolution, root cause AND contributing factors (plural — real incidents are chains, not single causes), what went well / what went poorly / where we got lucky, and action items. Example impact line: '31 minutes, 8% of checkout requests failed, consumed 72% of the monthly error budget'.","Action items are where postmortems live or die: each needs a named individual owner (a team name is nobody), a priority, and a tracking ticket, and they should be biased toward prevention and detection (add canary analysis, add an alert on the missed symptom) over 'be more careful' items, which are worthless because they patch the human instead of the system. Senior engineers formally review drafts before publication precisely to check whether the analysis went deep enough and the action items would actually prevent recurrence.","Triggers are pre-defined so the decision is never political: Google's typical criteria include user-visible downtime or degradation beyond a threshold, data loss of ANY kind, on-call engineer intervention (rollback, rerouting traffic), resolution time above a threshold, and monitoring failure — the incident was discovered by a human report rather than an alert, which is itself a defect worth a postmortem even if impact was small.","Blame has a precise failure mechanism you can articulate: punishment optimizes individual behavior for concealment, not for reliability. After a blameful review, rational engineers under-report near-misses, delay escalation (hoping to fix it quietly before anyone notices — lengthening every future MTTR), and route knowledge into private channels. The organization's incident dataset becomes survivorship-biased garbage, and systemic fixes are never made because the recorded cause is always 'human error, retrained'.","Incident metrics need caveats, MTTR above all: mean time to recovery averaged over a handful of heterogeneous incidents is statistically fragile — one 6-hour data-corruption incident among nine 5-minute rollbacks doubles your MTTR while telling you nothing. Distributions and per-class analysis beat single means, and any metric that becomes a target gets gamed (incidents closed early, severities argued down). Counting postmortems as a team KPI is similarly perverse: it punishes the honest declarers.","Postmortems are written collaboratively in real time — shared docs with commenting and review workflows — and then published widely, because a postmortem nobody reads fixed nothing beyond its own action items. Google reinforces the culture with visible senior-leadership participation, 'Postmortem of the Month' recognition, and reading groups, signaling that a well-written failure analysis is career-positive, not a confession."],"more":["'Wheel of Misfortune' exercises replay past postmortems as role-play theater — a new on-caller responds to the old incident live — turning the written archive into transferable operational muscle memory.","Contributing factors beat 'root cause' singular in mature practice: the deploy was the trigger, but the missing canary, the alert gap, and the stale runbook were co-conspirators; fix the chain, not just the last link.","'Where we got lucky' is the most underrated section — it names the latent failures that did not fire this time (the backup that happened to be fresh, the engineer who happened to be awake) so they get fixed before luck runs out.","Blameless does not abolish accountability: repeated recklessness or malice is a management matter handled outside the postmortem; keeping discipline out of the document is exactly what keeps the document honest.","Close the loop on action items with an SLA and periodic review — an org-wide backlog of unowned postmortem AIs is the classic signature of postmortem theater, where writing the doc substitutes for changing the system.","MTTx vocabulary for interviews: MTTD (detect), MTTA (acknowledge), MTTM (mitigate), MTTR (recover/resolve — always say which R you mean), and MTBF; mitigation time is often the most improvable number because it is bounded by rollback tooling, not by debugging skill."],"trap":"Treating 'blameless' as 'we don't name a cause' or 'no one is accountable'. The strong answer distinguishes person from system: the postmortem names exactly what happened including who did what, but analyzes why the system made that action possible and reasonable — and reserves individual accountability (a management concern) for genuine recklessness, outside the postmortem itself.","wire":"POSTMORTEM: checkout outage 2026-07-14 (excerpt)\\n------------------------------------------------\\nImpact : 31 min, 8% of checkout requests failed\\n         72% of 30d error budget consumed (99.9% SLO)\\nTrigger: config flag flip enabled untested code path\\nDetection: burn-rate page at 03:02 (MTTD 4 min)\\nMitigation: flag reverted 03:15 (MTTM 17 min)\\nContributing factors:\\n  1. Flag changes bypass canary pipeline\\n  2. No alert on payment-provider timeout ratio\\n  3. Runbook referenced decommissioned dashboard\\nAction items (owner, priority):\\n  AI-1 Route flags through canary  (asha, P1)\\n  AI-2 Alert: provider timeouts    (dmitri, P1)\\n  AI-3 Runbook refresh + link lint (kai, P2)\\nLucky: incident began after EU peak traffic window"},{"key":"autoscaling","cat":"concept","icon":"layers","t":"Kubernetes Autoscaling","s":"HPA math on requests, VPA, node autoscaling, and why they fight","quick":["HPA formula: desiredReplicas = ceil(currentReplicas x currentMetric / targetMetric), evaluated ~every 15s with a 10% tolerance band — and CPU utilization is a percentage of the pod's resource REQUESTS, not limits.","Scale-down has a 300s default stabilization window (uses the highest recommendation from the last 5 min) to prevent flapping; scale-up is immediate by default and both are tunable via the v2 'behavior' field.","HPA scales pod count, VPA scales pod size, Cluster Autoscaler/Karpenter scale nodes, KEDA scales on event-source metrics (queue depth, Kafka lag) including to zero — never run HPA and VPA on the same metric (CPU) for the same workload."],"methods":[],"intro":["Think of a supermarket. Horizontal scaling opens more checkout lanes (more pod replicas); vertical scaling gives one cashier a faster register (bigger CPU/memory per pod); node autoscaling extends the building when there is no floor space left for new lanes. Kubernetes has a dedicated controller for each: the HorizontalPodAutoscaler (HPA), the VerticalPodAutoscaler (VPA), and the Cluster Autoscaler or Karpenter — and interview questions love the seams where they interact badly.","The HPA is a simple control loop: roughly every 15 seconds it fetches metrics (via the Metrics Server for CPU/memory, or custom/external metrics APIs) and computes desiredReplicas = ceil(currentReplicas x currentValue / targetValue). If you run 4 pods at 90% average CPU against a 60% target, it computes ceil(4 x 90/60) = 6 pods. A 10% tolerance band around the ratio 1.0 prevents constant micro-adjustments, and min/max replica bounds cap the range.","The single most-tested detail: 'CPU utilization' in the HPA means usage divided by the pod's resource request — limits are irrelevant to the calculation. A pod requesting 500m and using 400m is at 80% for HPA purposes even if its limit is 2 cores. This has two consequences: pods without CPU requests break CPU-based HPA entirely, and changing requests (say, by a VPA) silently changes every utilization percentage the HPA sees."],"facts":["Worked scale-up: target 60% CPU-of-requests, 4 replicas averaging 90% -> ceil(4 x 90/60) = ceil(6.0) = 6 replicas. Worked scale-down: those 6 replicas later average 30% -> ceil(6 x 30/60) = 3, but the 300-second scale-down stabilization window means the HPA keeps the highest recommendation from the last 5 minutes, so a brief lull between traffic spikes does not delete capacity you are about to need.","The controller is deliberately conservative with unknowns: during scale-up, pods with missing metrics and not-yet-ready pods are assumed to be using 0% (dampening the scale-up so a stampede of pending pods does not trigger runaway growth), while during scale-down missing-metric pods are assumed at 100% of target (dampening the scale-down). Pods marked for deletion or failed are excluded entirely; readiness handling includes a ~30s initial readiness delay and a 5-minute CPU initialization window.","The autoscaling/v2 'behavior' field gives per-direction policies: stabilizationWindowSeconds plus rate policies like 'at most 100% more pods per 30s' on scale-up or 'at most 50% fewer per 60s' on scale-down, with selectPolicy choosing among multiple. This is how you encode 'scale up aggressively, scale down cautiously' — the standard shape for spiky user-facing traffic where under-provisioning costs SLO budget and over-provisioning only costs money.","HPA + VPA on CPU is a control-loop fight with a concrete mechanism: VPA changes the pod's CPU request, and because HPA utilization = usage/request, that same instant every pod's utilization percentage jumps or drops with no change in real load. VPA raises requests -> utilization %% falls -> HPA scales in -> per-pod load rises -> VPA raises requests again: two controllers actuating on one signal oscillate. Safe combos: HPA on CPU + VPA on memory, or HPA on a custom metric (RPS, queue depth) with VPA owning both resources.","Node-level scaling is a separate layer with different mechanics: the Cluster Autoscaler watches for Pending (unschedulable) pods and grows pre-defined node groups (e.g., AWS ASGs), scaling down nodes that stay underutilized; Karpenter skips node groups entirely and provisions right-sized instances directly from the pending pods' aggregate resource shapes, typically achieving faster and cheaper bin-packing. Either way, the user-visible latency chain is HPA creates pods -> pods pend -> node autoscaler adds capacity -> pods schedule, which can take minutes — so HPA alone cannot absorb a spike if the cluster is full.","KEDA (Kubernetes Event-Driven Autoscaling) extends HPA with 60+ scalers for external event sources — SQS/Kafka queue depth, Prometheus queries, cron schedules — and can scale workloads to zero, which vanilla HPA cannot (minReplicas >= 1). Queue-depth scaling is often strictly better than CPU for workers: a consumer that is I/O-blocked on a slow downstream shows low CPU while its queue explodes, so a CPU-based HPA would do exactly nothing during the backlog."],"more":["HPA cannot target DaemonSets (they run one pod per node by definition); it targets scalable resources like Deployments and StatefulSets via scaleTargetRef, and requires Metrics Server (metrics.k8s.io) for resource metrics.","Memory-based HPA is usually a trap for interviews to probe: many runtimes (JVM, glibc allocators) do not return freed memory to the OS, so memory utilization ratchets up and never signals scale-down — prefer CPU or a request-rate custom metric.","Multiple metrics on one HPA: each metric produces a replica proposal and the HPA takes the maximum, so adding a metric can only add replicas, never remove them — a safe way to layer 'CPU OR RPS' triggers.","VPA has modes (Off = recommendations only, Initial = set at pod creation, Auto/Recreate = evict and restart pods to resize); historically resizing meant pod restarts, with in-place resize arriving in newer Kubernetes versions — 'Off mode as a request-rightsizing advisor' is a low-risk production pattern.","Capacity headroom trick: because node provisioning is the slow step, teams run low-priority 'balloon'/pause pods that reserve spare capacity; a real spike preempts them instantly while the node autoscaler backfills.","Autoscaling ties back to SLOs: the target utilization IS your headroom policy — a 60% CPU target leaves 40% margin for the spike-plus-scale-lag window, and choosing it is an error-budget tradeoff (higher target = cheaper but more latency SLO burn during ramps)."],"trap":"Claiming HPA scales on CPU as a percentage of limits, or proposing 'run HPA and VPA together so pods are always right-sized'. Both are classic screens: utilization is measured against requests, and VPA mutating those requests corrupts the HPA's signal on the same metric — say 'requests, not limits' explicitly and name a safe split (HPA on RPS/custom metric, VPA on memory or in Off mode).","wire":"# HPA v2: scale fast up, slow down; CPU vs REQUESTS\\napiVersion: autoscaling/v2\\nkind: HorizontalPodAutoscaler\\nspec:\\n  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: checkout}\\n  minReplicas: 4\\n  maxReplicas: 40  # bound the blast radius both ways\\n  metrics:\\n  - type: Resource\\n    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}\\n  behavior:   # up fast, down slow\\n    scaleUp:   {stabilizationWindowSeconds: 0,\\n                policies: [{type: Percent, value: 100, periodSeconds: 30}]}\\n    scaleDown: {stabilizationWindowSeconds: 300,\\n                policies: [{type: Percent, value: 50, periodSeconds: 60}]}\\n# math: 4 pods @ 90% avg, target 60 -> ceil(4*90/60) = 6 replicas"}]`),Wn={crash:[[`c`,`You`,`kubectl get pods -n <ns> — confirm CrashLoopBackOff and restart count`],[`c`,`You`,`kubectl describe pod <pod> — events: OOMKilled? probe failures? image pull?`],[`c`,`You`,`kubectl logs <pod> --previous — the crash output from the LAST container run`],[`u`,`Check`,`Exit code 137 = OOM/SIGKILL · 1 = app error · probe config vs app startup time`],[`c`,`You`,`Fix the cause (limits, probe timing, config/secret, image) in the manifest`],[`s`,`Cluster`,`kubectl rollout status — new ReplicaSet becomes Ready, restarts stop`]],notready:[[`c`,`You`,`kubectl get nodes — identify the NotReady node and how long it's been down`],[`c`,`You`,`kubectl describe node <node> — Conditions: MemoryPressure, DiskPressure, PIDPressure, Ready`],[`u`,`Check`,`ssh/debug: systemctl status kubelet · journalctl -u kubelet — kubelet talking to the API server?`],[`u`,`Check`,`Container runtime up? CNI pods healthy? Disk full? Certificate expiry?`],[`c`,`You`,`Fix and restart kubelet; workloads reschedule per tolerations/eviction timeouts`],[`s`,`Cluster`,`Node returns Ready — uncordon if you cordoned it during the repair`]]},Gn={pods:{cat:`host`,icon:`box`,t:`Pods`,s:`The atomic unit of scheduling`,quick:[`Smallest deployable unit — 1+ containers`,`Shared network namespace & volumes`,`Ephemeral by design — never pet a pod`],methods:[`kubectl get pods`,`kubectl describe pod`,`kubectl logs`],facts:[`A pod is one or more containers sharing an IP, localhost, and volumes — scheduled together on one node, living and dying together.`,`Pods are cattle: controllers (Deployments, StatefulSets) replace them; you almost never create bare pods in production.`,`initContainers run to completion, in order, before app containers start; sidecars run alongside the app container.`,`Liveness probes restart a stuck container; readiness probes gate Service traffic; startup probes protect slow-booting apps from the liveness probe.`,`Resource requests drive scheduling; limits drive CPU throttling and memory OOM kills.`],trap:`Readiness failure ≠ restart. Only the LIVENESS probe restarts containers; readiness just pulls the pod out of Service endpoints.`},workloads:{cat:`host`,icon:`layers`,t:`Workload controllers`,s:`Deployments · StatefulSets · DaemonSets · Jobs`,quick:[`Deployment → ReplicaSet → Pods`,`StatefulSet: stable identity + storage`,`DaemonSet: one per node`],methods:[`kubectl rollout`,`kubectl scale`],facts:[`A Deployment manages stateless replicas via ReplicaSets; a rolling update creates a new RS and scales the old one down (maxSurge / maxUnavailable control the pace).`,`kubectl rollout undo reverts to the previous ReplicaSet revision — old RSes are kept at 0 replicas as history.`,`StatefulSet gives ordinal names (app-0, app-1), stable DNS via a headless Service, and per-replica PVCs that survive rescheduling.`,`DaemonSet runs exactly one pod per matching node — log shippers, CNI agents, node exporters.`,`Job runs pods to completion with retries; CronJob schedules Jobs — know concurrencyPolicy and startingDeadlineSeconds.`],trap:`Scaling a StatefulSet down does NOT delete its PVCs — data deliberately outlives the pod.`},services:{cat:`client`,icon:`cable`,t:`Services & networking`,s:`Stable virtual IPs over ephemeral pods`,quick:[`ClusterIP → NodePort → LoadBalancer`,`kube-proxy programs the rules`,`DNS: name.ns.svc.cluster.local`],methods:[`kubectl get svc`,`kubectl get endpoints`],facts:[`A Service selects pods by label and balances across READY endpoints only — empty Endpoints is the #1 'service is broken' cause (selector mismatch or nothing ready).`,`ClusterIP is virtual — it never answers ping; kube-proxy (iptables/IPVS) rewrites connections to pod IPs.`,`NodePort exposes the Service on every node (default range 30000-32767); LoadBalancer builds on NodePort with a cloud LB; headless (clusterIP: None) returns pod IPs directly in DNS.`,`Ingress routes HTTP by host/path to Services and requires an ingress controller to actually do anything.`,`NetworkPolicies: traffic is default-allow until any policy selects a pod — then that direction becomes default-deny for it.`],trap:`kubectl get endpoints is the interview reflex: a Service with no endpoints means selector mismatch or failing readiness — not a DNS problem.`},storage:{cat:`client`,icon:`filetext`,t:`Storage — PV, PVC, StorageClass`,s:`Claims decouple pods from disks`,quick:[`PVC = request · PV = the disk`,`StorageClass = dynamic provisioning`,`Access modes are node-level`],methods:[`kubectl get pv,pvc,sc`],facts:[`A pod mounts a PVC; the PVC binds a PV; a StorageClass provisions PVs on demand — hand-created PVs are rare in modern clusters.`,`volumeBindingMode: WaitForFirstConsumer delays provisioning until the pod schedules, so the disk lands in the right zone.`,`Access modes: RWO (one node), ROX (read-only many), RWX (many nodes — needs NFS/CephFS-class storage).`,`reclaimPolicy Delete removes the backing disk with the PVC; Retain keeps it (PV goes Released and needs manual cleanup).`,`PVC stuck Pending → no matching StorageClass/PV, or WaitForFirstConsumer with an unschedulable pod.`],trap:`Two pods on the SAME node can share an RWO volume — RWO restricts nodes, not pods. Classic trick question.`},openshift:{cat:`server`,icon:`shield`,t:`OpenShift deltas`,s:`What Red Hat adds & restricts`,quick:[`Routes predate Ingress`,`SCCs: no root by default`,`Projects · ImageStreams · Operators`],methods:[`oc new-app`,`oc get route`,`oc get co`],facts:[`Routes are OpenShift's L7 exposure with edge / passthrough / re-encrypt TLS; Ingress objects are translated to Routes by the HAProxy router.`,`Security Context Constraints (SCCs) gate pod privileges; the default restricted SCC runs containers as a random non-root UID — images assuming root or a fixed UID break here first.`,`Projects are namespaces plus request/quota machinery; oc new-project is the self-service path.`,`ImageStreams track image tags and can trigger redeployments on new pushes; BuildConfigs / S2I build images in-cluster from source.`,`The platform is operator-managed end to end — oc get clusteroperators is the first health check in any OpenShift incident scenario.`],trap:`"Runs on my K8s, permission denied on OpenShift" → SCC / arbitrary-UID issue, not RBAC. Fix the image (GID 0 writable), don't grant anyuid.`},rbac:{cat:`server`,icon:`key`,t:`RBAC & auth`,s:`Who can do what, where`,quick:[`Role/ClusterRole = verbs on resources`,`Bindings attach subjects`,`Additive only — no deny`],methods:[`kubectl auth can-i`],facts:[`Roles are namespaced, ClusterRoles cluster-wide; bindings connect users, groups, or ServiceAccounts to them.`,`RBAC is purely additive — there are no deny rules; least privilege means granting narrowly.`,`Workloads authenticate as ServiceAccounts with projected tokens — which is why default-SA-with-broad-grants is an anti-pattern.`,`kubectl auth can-i <verb> <resource> --as=<subject> is the fastest 403 debugger.`,`Vanilla K8s has no user objects — humans arrive via certs or OIDC; OpenShift adds real User/Group APIs and an OAuth server.`],trap:`A RoleBinding can reference a ClusterRole — granting those permissions ONLY inside that namespace. Frequently mis-answered.`},slo:{cat:`concept`,icon:`gauge`,t:`SLI · SLO · error budgets`,s:`Reliability as a number you spend`,quick:[`SLI measures · SLO targets · budget = 1−SLO`,`Alert on burn rate`,`100% is the wrong target`],methods:[],facts:[`An SLI is a measured good/total ratio (successful requests over all requests); an SLO is the target for it over a window (99.9% / 30 days).`,`Error budget = 1 − SLO: 99.9% monthly ≈ 43 minutes of full downtime to 'spend' on releases, experiments, and incidents.`,`Budget exhausted → the pre-agreed policy fires: feature freeze, reliability work first. The budget is the dev-velocity ↔ stability contract.`,`Page on burn RATE (multi-window, multi-burn-rate), not instantaneous error blips.`,`SLAs are external contracts with penalties; SLOs are internal targets set tighter than any SLA.`],trap:`"Why not 100%?" — the last nine costs exponentially more, users can't perceive it, and a zero budget forbids all change.`},triage:{cat:`concept`,icon:`alert`,t:`Troubleshooting method`,s:`The triage loop interviewers grade`,flow:`crash`,quick:[`Observe → hypothesize → test → iterate`,`describe + events + logs first`,`Mitigate before root-cause`],methods:[`kubectl describe`,`kubectl logs --previous`,`kubectl get events`],facts:[`Interview troubleshooting is graded on METHOD: say what you observe, form a hypothesis, name the command that tests it, interpret, iterate.`,`The triage trio: kubectl describe (events!), kubectl logs (--previous for crashed containers), kubectl get events --sort-by=.lastTimestamp.`,`Pending = scheduling (resources, taints, affinity, PVC). CrashLoopBackOff = starts then dies (app, probes, OOM). ImagePullBackOff = registry, tag, or pull secret.`,`In incidents: mitigate first (rollback, scale, failover), root-cause after — say this out loud.`,`kubectl debug with ephemeral containers is the modern answer to 'the image has no shell'.`],trap:`Reaching for logs on a Pending pod is the classic fail — Pending pods never started, so there are no logs; the answer is in describe/events.`}},Kn=[{id:`seed-core`,n:0,t:`seeds`,badge:``,qs:[{q:`A Deployment rollout is stuck: the new pod is Pending, old ones still run. maxUnavailable is 0, maxSurge is 1, and the cluster is at capacity. What's happening?`,o:[`The image tag is invalid`,`The surge pod can't schedule for lack of resources, and zero-unavailable forbids freeing capacity by stopping old pods`,`kube-proxy is misconfigured`,`The rollout awaits manual approval`],a:1,x:`maxSurge:1 needs headroom for one extra pod; with none, and maxUnavailable:0 blocking scale-down, the rollout cannot progress.`,h:`Walk the surge/unavailable math.`,t:`Constraint-interaction stems like this are the interview norm — narrate the mechanism.`},{q:`Which probe failure causes a container restart?`,o:[`Readiness`,`Liveness`,`Startup succeeding`,`Any probe`],a:1,x:`Liveness failures restart the container; readiness only removes the pod from Service endpoints.`,h:`One gates traffic, one gates life.`},{q:`A pod shows OOMKilled, exit code 137. First fix to evaluate?`,o:[`Raise the liveness timeout`,`Right-size the container memory limit after checking real usage`,`Add a second replica`,`Move it to another node`],a:1,x:`137 = SIGKILL from the OOM killer: usage exceeded the memory limit. Right-size or fix the leak.`,h:`128 + 9.`},{q:`kubectl get endpoints myservice returns no addresses. Most likely cause?`,o:[`CoreDNS is down`,`The Service selector doesn't match pod labels, or no matching pod is Ready`,`ClusterIP range exhausted`,`kubelet stopped`],a:1,x:`Empty endpoints = selector mismatch or readiness failure. DNS resolving the name proves nothing about endpoints.`,t:`DNS is the planted decoy.`}]},{id:`seed-plat`,n:0,t:`seeds`,badge:``,qs:[{q:`An image that runs on vanilla K8s fails on OpenShift with 'permission denied' writing /var/cache. Why?`,o:[`OpenShift forbids writable filesystems`,`The restricted SCC runs it as a random non-root UID lacking write access to that path`,`SELinux is disabled`,`The Route is misconfigured`],a:1,x:`The default restricted SCC assigns an arbitrary UID; images must be group-writable (GID 0) rather than assume root or a fixed UID.`,h:`Think UID, not RBAC.`},{q:`TLS termination where the router decrypts and re-encrypts to the pod is which Route type?`,o:[`Edge`,`Passthrough`,`Re-encrypt`,`Mutual`],a:2,x:`Edge decrypts at the router (plain to pod); passthrough never decrypts; re-encrypt decrypts then re-encrypts.`},{q:`First command to assess overall OpenShift cluster health in an incident?`,o:[`oc get pods -A`,`oc get clusteroperators`,`oc adm top nodes`,`oc get routes`],a:1,x:`Cluster operators aggregate platform health — a degraded operator points directly at the failing subsystem.`},{q:`A RoleBinding in namespace dev references ClusterRole admin. The subject can now…`,o:[`Administer the whole cluster`,`Administer only the dev namespace`,`Nothing — invalid combination`,`Read all namespaces`],a:1,x:`RoleBinding + ClusterRole = that role's verbs scoped to the binding's namespace — reuse without cluster-wide grant.`,t:`The reverse (ClusterRoleBinding → Role) is the invalid one.`}]},{id:`seed-sre`,n:0,t:`seeds`,badge:``,qs:[{q:`A service has a 99.9% 30-day SLO. Roughly how much full-downtime budget is that?`,o:[`4.3 hours`,`43 minutes`,`8.7 minutes`,`4.3 minutes`],a:1,x:`0.1% of 30 days ≈ 43 minutes. Know 99.9 / 99.95 / 99.99 by heart.`,h:`0.1% of 43,200 minutes.`},{q:`The error budget is exhausted mid-qua
