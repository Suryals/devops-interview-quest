rter. The textbook SRE response is…`,o:[`Raise the SLO`,`Pause feature releases and spend engineering time on reliability, per the pre-agreed policy`,`Silence alerts until the window rolls`,`Add replicas everywhere`],a:1,x:`The budget is a contract: exhaustion triggers the agreed policy — typically a release freeze plus reliability work.`},{q:`Why alert on burn rate instead of raw error rate?`,o:[`Cheaper to compute`,`It pages only when budget is being consumed fast enough to matter — quiet on blips, early on real burns`,`Raw error rate can't be measured`,`Tooling requires it`],a:1,x:`Multi-window burn-rate alerting maps urgency to budget impact.`},{q:`During a major incident, your first responsibility is…`,o:[`Find the root cause`,`Mitigate user impact — rollback, failover, shed load — then investigate`,`Write the postmortem`,`Update the status page`],a:1,x:`Mitigation before diagnosis — say it explicitly; it's what incident commanders are graded on.`}]}],qn=[{t:`CrashLoopBackOff — assemble the runbook`,steps:Wn.crash},{t:`Node NotReady — assemble the runbook`,steps:Wn.notready}],Jn=[[0,`Candidate`],[150,`On-caller`],[450,`Senior`],[800,`Staff Material`]],Yn=1e3;for(let[e,t]of Object.entries(Hn))Gn[e]&&(Gn[e].intro=t);for(let e of Un)Gn[e.key]=e;var Xn={core:[{q:`A container's liveness probe fails and the kubelet declares it unhealthy. What actually happens to the Pod?`,o:[`The kubelet kills and restarts only that container in place; the Pod keeps its name, IP, and node assignment`,`The endpoints controller removes the Pod's IP from the Service's EndpointSlices, but the container keeps running`,`The Pod is deleted and rescheduled to a different node by the scheduler`,`The container is throttled by the CFS quota until it recovers`],a:0,x:`A failed liveness probe only restarts the individual container in place; the Pod object, IP, and node survive. Removing endpoints on failure is what readiness does instead.`,h:`Think per-container, not per-pod.`,t:`Interviewers hope you'll say 'the pod restarts' — it doesn't.`},{q:`You run \`kubectl describe pod web-0\` and see:
Last State: Terminated
  Reason: OOMKilled
  Exit Code: 137
What does this tell you?`,o:[`The container exceeded its CPU limit and was throttled`,`The container exceeded its memory limit and the kernel OOM killer killed it`,`The container received SIGTERM during a graceful pod deletion`,`The liveness probe failed and the kubelet restarted the container`],a:1,x:`Exit code 137 with reason OOMKilled means the process allocated past its memory limit and the kernel OOM killer terminated it; CPU limits only throttle, they never kill.`},{q:`Why does a Pod need a hidden 'pause' (infrastructure) container?`,o:[`To enforce CPU/memory limits via cgroups`,`To run health checks independent of the app container`,`To hold open the shared network/IPC namespaces so app containers can join them and the Pod IP survives an app container restart`,`To provide DNS resolution for the Pod`],a:2,x:`The pause container owns the Pod's network and IPC namespaces; app containers join those namespaces, which is mechanically why the Pod IP survives an app container crashing and restarting.`},{q:`Your team sets failureThreshold: 30 and periodSeconds: 10 on a startupProbe for a slow-booting JVM app. What is the effective startup budget, and what happens to the other probes during that window?`,o:[`60 seconds; liveness runs normally throughout`,`300 seconds; readiness runs but liveness is suspended`,`30 seconds; both probes run in parallel with the startup probe`,`300 seconds; both liveness and readiness are suppressed until the startup probe succeeds once`],a:3,x:`The startup budget is failureThreshold x periodSeconds = 30 x 10s = 300s, and a startup probe suppresses both liveness and readiness until it succeeds once.`},{q:`A Pod has an init container and a native sidecar (log-shipper with restartPolicy: Always) ahead of the main app container. In what order do they start, and does the kubelet wait for the sidecar to exit before starting the app?`,o:[`Init container runs to completion first, the sidecar starts next and is not waited on to exit — the app starts once the sidecar is launched`,`All three start simultaneously`,`Sidecar and app start together, and the init container runs last`,`The kubelet waits for the sidecar to exit before starting the app container`],a:0,x:`A native sidecar is an init container with restartPolicy: Always — the kubelet starts it in init order but doesn't wait for it to exit, and keeps it running for the Pod's life.`},{q:`A node is under memory pressure and the kubelet must evict pods. Pod A has requests equal to limits for CPU and memory (Guaranteed QoS). Pod B has no requests or limits set at all (BestEffort). Which is evicted first?`,o:[`Pod A, because Guaranteed pods are evicted first to protect capacity`,`Pod B, because BestEffort pods are evicted before Burstable and Guaranteed pods`,`Both are evicted simultaneously since QoS doesn't affect eviction order`,`Neither — eviction order depends only on pod age`],a:1,x:`QoS class governs eviction order under node pressure: BestEffort pods go first, then Burstable pods exceeding requests, and Guaranteed pods are evicted last.`},{q:`kubectl get pod shows Phase: Running, but kubectl describe shows a container state of Waiting with reason CrashLoopBackOff. What should you conclude?`,o:[`The Pod phase is wrong; Kubernetes has a bug reporting Running incorrectly`,`The container passed its liveness probe and is healthy`,`Pod phase is a coarse summary and can show Running even while a container is Waiting/crash-looping; check per-container state and kubectl logs --previous`,`This is only possible if the readiness probe is misconfigured`],a:2,x:`Pod phase is a coarse rollup while container states carry the actionable detail — 'the pod says Running' proves very little on its own.`},{q:`$ kubectl rollout status deployment/web
Waiting for deployment "web" rollout to finish: 3 out of 10 new replicas have been updated...

$ kubectl get deploy web -o jsonpath='{.status.conditions[?(@.type=="Progressing")].reason}'
ProgressDeadlineExceeded

What is the correct diagnosis, and will Kubernetes fix it automatically?`,o:[`The rollout is paused; resume it with kubectl rollout resume`,`maxUnavailable is set too low; increase it and the rollout will finish`,`The old ReplicaSet was garbage collected; nothing can be done`,`The rollout is stuck (e.g. a bad image or failing readiness) and exceeded progressDeadlineSeconds; Kubernetes will NOT auto-rollback — fix with kubectl rollout undo or a corrected image`],a:3,x:`A stuck rollout only flips the Progressing condition to False with reason ProgressDeadlineExceeded after the default 600s deadline; Kubernetes never rolls back on its own.`},{q:"You run `kubectl scale deployment/web --replicas=20`. Does this trigger a new ReplicaSet and rolling update?",o:[`No — only changes to .spec.template trigger a new ReplicaSet; replica count changes do not`,`Yes — any change to the Deployment object creates a new revision`,`Yes, but only if maxSurge is greater than 0`,`No, because scale operations bypass the Deployment controller entirely`],a:0,x:`Only a change to .spec.template changes the pod-template-hash and creates a new ReplicaSet/revision; scaling replicas does not.`},{q:`You set revisionHistoryLimit: 0 on a Deployment. Weeks later a bad release ships and you try kubectl rollout undo. What happens?`,o:[`It works normally; revisionHistoryLimit only affects kubectl rollout history output`,`Rollback is impossible — the old ReplicaSets holding prior templates were garbage collected`,`Kubernetes automatically restores revision 1 regardless of the limit`,`The Deployment reverts to its default template`],a:1,x:`Rollback works by scaling an old ReplicaSet back up; revisionHistoryLimit: 0 lets those old ReplicaSets be garbage-collected, silently destroying rollback ability.`},{q:`Why does a StatefulSet require a headless Service (clusterIP: None)?`,o:[`To load-balance traffic evenly across replicas`,`To let the scheduler assign stable node names`,`To provide the stable per-pod DNS record <pod>.<svc>.<ns>.svc.cluster.local that clustered apps use to find peers`,`To automatically encrypt traffic between replicas`],a:2,x:`The headless Service is what gives each ordinal a stable DNS record, which is exactly what clustered systems like Kafka or PostgreSQL need to find their peers.`},{q:`You scale a StatefulSet from 5 replicas down to 0 and back up to 5. What happens to the PVCs created via volumeClaimTemplates?`,o:[`They are deleted on scale-down and recreated empty on scale-up`,`They are merged into a single shared PVC`,`They are deleted only if persistentVolumeClaimRetentionPolicy is unset`,`They are NOT deleted by default; each ordinal reattaches its original PVC (e.g. web-1 remounts www-web-1) with its old data`],a:3,x:`PVC binding is sticky and PVCs are not deleted by default even when the StatefulSet is scaled down or deleted — a deliberate data-safety choice.`},{q:`A 3-replica StatefulSet with the default podManagementPolicy is mid-rollout and web-0 crashloops on the new image. What happens to web-1 and web-2?`,o:[`The rollout wedges — with OrderedReady, later ordinals are never touched until web-0 becomes Ready`,`They update anyway since StatefulSets always update in parallel`,`They roll back automatically`,`They are deleted to make room for a healthy web-0`],a:0,x:`With the default OrderedReady policy, pods are created and updated strictly in order — a crashlooping web-0 wedges the entire rollout.`},{q:`A DaemonSet runs a log-shipping agent. Why do its pods keep running on a node that is being drained of ordinary workloads?`,o:[`DaemonSet pods run with root privileges that exempt them from draining`,`The controller automatically adds tolerations for node.kubernetes.io/not-ready and unreachable, keeping DaemonSet pods on nodes ordinary workloads are evicted from`,`DaemonSets are excluded from node affinity rules entirely`,`kubectl drain never affects any pod by design`],a:1,x:`The DaemonSet controller adds tolerations for node lifecycle taints automatically, which is why log agents and CNI plugins keep running on nodes ordinary workloads are being evicted from.`},{q:`kubectl describe pod shows:
Events:
  Warning  FailedScheduling  0/5 nodes are available: 3 Insufficient cpu, 2 node(s) had untolerated taint {dedicated: gpu}
What two independent fixes map to these two failure reasons?`,o:[`Add more replicas; change the Service type`,`Increase the liveness probe timeout; change restartPolicy`,`Lower CPU requests or add nodes for the Insufficient cpu nodes; add a toleration or remove the taint for the tainted nodes`,`Enable preemptionPolicy: Never; delete the PriorityClass`],a:2,x:`Each named filter in a FailedScheduling event maps one-to-one to a fix: resource shortfalls need lower requests or more nodes, taint mismatches need a toleration or taint removal.`},{q:`Which statement correctly describes how the scheduler uses requests versus limits?`,o:[`The scheduler sums limits across pods to decide node fit`,`The scheduler uses live resource usage (kubectl top) to decide node fit`,`The scheduler ignores both and relies on the kubelet to reject overloaded pods`,`The scheduler only looks at requests; limits are enforced later by the kernel, not consulted for placement`],a:3,x:`The scheduler fits pods onto nodes using only requests; limits are a kernel-enforced ceiling checked later, never part of the placement decision.`,t:`Classically confused with limits — the scheduler never looks at limits or live usage.`},{q:`A container exceeds its CPU limit under load. What happens to it, versus a container that exceeds its memory limit?`,o:[`The CPU-limited container is throttled by the CFS quota (slows down, never killed); the memory-limited container is OOMKilled by the kernel (exit 137)`,`Both are OOMKilled immediately`,`Both are throttled without being killed`,`The CPU-limited container is OOMKilled; the memory-limited container is throttled`],a:0,x:`CPU is a compressible resource enforced via CFS quota (throttling); memory is incompressible, so exceeding its limit triggers the kernel OOM killer.`,h:`CPU is compressible, memory is not.`,t:`The tempting wrong answer is 'it gets killed' for CPU — that's only true for memory.`},{q:`A required podAntiAffinity on topology.kubernetes.io/hostname is set for a 4-replica Deployment running on a 3-node cluster. What happens to the 4th replica?`,o:[`It preempts a lower-priority pod on one of the 3 nodes`,`It stays Pending forever — the constraint is unsatisfiable with only 3 nodes`,`It is scheduled onto a node already hosting a replica, ignoring the constraint`,`The scheduler automatically relaxes hard anti-affinity after a timeout`],a:1,x:`Required (hard) anti-affinity that can't be satisfied leaves the pod Pending forever; nothing is broken, the constraint is simply unsatisfiable given the node count.`},{q:`You taint a node dedicated=batch:NoSchedule and add a matching toleration to your batch pods, but you set no nodeAffinity. What's wrong with expecting the pods to land only on that node?`,o:[`NoSchedule taints require an explicit nodeSelector to have any effect at all`,`Tolerations are ignored unless combined with a PriorityClass`,`A toleration only unlocks the door — it doesn't pull the pod there; without nodeAffinity the pods may still land on general nodes`,`NoSchedule taints don't apply to Deployments, only to bare Pods`],a:2,x:`Dedicated node pools need both the taint (to repel other workloads) and matching nodeAffinity (to attract your workloads); a toleration alone never steers a pod there.`},{q:`What is the key difference in effect between a NoSchedule taint and a NoExecute taint?`,o:[`NoSchedule is a hard filter and NoExecute is only a scoring preference`,`NoExecute only applies to DaemonSets`,`NoSchedule evicts running pods; NoExecute only blocks new placements`,`NoSchedule blocks new placements but leaves running pods alone; NoExecute additionally evicts already-running pods lacking a matching toleration`],a:3,x:`Taint effects escalate: NoSchedule only blocks new placement, while NoExecute also evicts pods already running there unless they tolerate it (optionally after tolerationSeconds).`,t:`Commonly swapped in interviews — remember NoExecute is the one that evicts.`},{q:`A node stops heartbeating and goes NotReady. Roughly how long until its pods are evicted and replacements scheduled elsewhere, and what mechanism causes it?`,o:[`About 300 seconds — the node controller adds node.kubernetes.io/unreachable:NoExecute, and pods have a default 300s toleration for it before eviction`,`Immediately — NotReady nodes have their pods evicted within seconds`,`Never automatically — an operator must manually cordon and drain the node`,`40 seconds, matching the node heartbeat timeout exactly`],a:0,x:`The node controller marks the node NotReady around 40s after it stops heartbeating and taints it unreachable:NoExecute; pods carry a default 300s toleration for that taint before eviction.`},{q:`You update a ConfigMap that's consumed via env vars (valueFrom.configMapKeyRef) in a running Deployment. Nothing changes in the running pods. Why?`,o:[`ConfigMaps can't be consumed via env vars, only volumes`,`Env vars are resolved once at container creation; only a pod restart (e.g. kubectl rollout restart) picks up the new values`,`The ConfigMap update didn't actually persist to etcd`,`Env var updates require immutable: true to propagate`],a:1,x:`Environment variables from a ConfigMap or Secret are resolved exactly once at container creation; updating the object afterward changes nothing until the pod restarts.`},{q:`The same ConfigMap is mounted as a volume, but the container mounts a single key via subPath. Does the file update live when the ConfigMap changes?`,o:[`Yes, subPath mounts always refresh via the ..data symlink swap`,`Yes, but only after the pod is deleted and recreated`,`No — subPath mounts copy the file rather than symlink through ..data, so it never sees updates`,`No, because ConfigMaps are always immutable once mounted`],a:2,x:`Normal volume mounts update atomically via a symlink swap through ..data, but subPath mounts copy the file instead, so they never receive live updates.`},{q:`Is base64 encoding in a Secret's data field a form of encryption?`,o:[`Yes, base64 provides adequate encryption for etcd-at-rest storage`,`Yes, but only for Secrets, not ConfigMaps`,`No, but etcd encrypts Secrets automatically by default with no configuration`,`No — base64 is encoding, not encryption; real protection requires enabling encryption at rest via an EncryptionConfiguration with a KMS provider`],a:3,x:`base64 exists so arbitrary bytes survive JSON transport; by default Secrets sit in etcd as plaintext, so real protection needs encryption at rest via a KMS provider.`},{q:`A Deployment references a Secret key via a required env var (valueFrom, no optional: true), but the key doesn't exist. What happens?`,o:[`The container fails to start with CreateContainerConfigError`,`The container starts with an empty string for that variable`,`The Pod is stuck ContainerCreating with mount errors in Events`,`The API server rejects the Pod at admission time`],a:0,x:`A required env-var reference to a missing key blocks the container from starting with CreateContainerConfigError; a missing volume-referenced object instead leaves the Pod stuck ContainerCreating with mount errors.`},{q:`Why does setting immutable: true on a ConfigMap reduce load on the API server at scale?`,o:[`It compresses the ConfigMap's data before storage`,`The kubelet stops opening a watch for it, removing per-node watch load across the cluster`,`It moves the ConfigMap's storage from etcd to tmpfs`,`It disables RBAC checks on the object`],a:1,x:`immutable: true both blocks further edits and stops kubelets from watching the object, which removes significant watch load in clusters with tens of thousands of pods.`},{q:`Your Ingress controller needs a TLS secret, but a teammate's kubectl create secret generic produced type Opaque. What breaks, and why?`,o:[`Nothing breaks — Ingress controllers accept any Secret type`,`The Secret is auto-converted to kubernetes.io/tls on first use`,`Ingress controllers require type kubernetes.io/tls specifically, which mandates tls.crt and tls.key keys; an Opaque secret won't be accepted`,`The Pod using the Ingress fails RBAC checks`],a:2,x:`Secret types are validation contracts consumers key off of — Ingress controllers specifically demand type kubernetes.io/tls with tls.crt and tls.key.`},{q:`$ kubectl get nodes

What happened to node-2, and what happens to pods running on it?`,o:[`node-2's api-server crashed; pods on it are immediately deleted`,`node-2 lost etcd quorum; the cluster is now read-only`,`The scheduler marked node-2 unschedulable via kubectl cordon; running pods stay untouched`,`node-2's kubelet stopped heartbeating, the node controller marked it NotReady and tainted it; pods get evicted after the default 300s toleration expires, though original containers may still be running on the cut-off node`],a:3,x:`A missed heartbeat leads the node controller to mark the node NotReady and apply the unreachable:NoExecute taint; replacement pods appear elsewhere after the 300s toleration, but the original containers may still be alive on the partitioned node.`},{q:`The kube-apiserver goes down entirely but etcd, kubelet, and kube-proxy are healthy. What still works, and what doesn't?`,o:[`Existing pods keep running and Services keep routing traffic via existing kube-proxy rules; but no kubectl commands, new pods, scaling, or rescheduling can happen`,`Nothing works at all — the whole cluster stops serving traffic`,`New pods can still be scheduled since the scheduler talks to etcd directly`,`Only DNS resolution breaks; everything else continues normally`],a:0,x:`The api-server is the only component with an etcd connection; when it's down the data plane runs on autopilot but nothing can change, since the scheduler and controllers only ever talk through the api-server.`},{q:`Your 5-node etcd cluster loses 3 members simultaneously. What happens to the cluster?`,o:[`It keeps operating normally since 2 members remain online`,`It loses quorum (needs a majority of 5, i.e. 3) and refuses all writes and consistent reads — the cluster freezes at its last committed state`,`etcd automatically re-elects a leader from the remaining 2 and continues writes`,`Only read operations are affected; writes continue via the surviving members`],a:1,x:`etcd is a Raft cluster requiring a strict majority to commit writes; with only 2 of 5 members left, quorum is lost and the cluster freezes until a majority returns.`},{q:`New pods from a rollout and a scale-up are stuck Pending, with zero FailedScheduling events, while already-running pods are unaffected. Which control-plane component is most likely down?`,o:[`kube-controller-manager`,`kubelet on the affected nodes`,`kube-scheduler`,`etcd`],a:2,x:`New pods piling up in Pending with no scheduling events (and existing workloads unaffected) is the canonical signature of the scheduler itself being down.`},{q:`You delete a Deployment's pod manually while kube-controller-manager is down. What happens?`,o:[`The ReplicaSet controller creates a replacement pod after a short delay`,`The scheduler recreates the pod directly, bypassing the ReplicaSet controller`,`The api-server refuses the deletion since no controller is available`,`No replacement pod appears — the reconciliation loop that would recreate it isn't running`],a:3,x:`kube-controller-manager hosts the ReplicaSet controller's reconciliation loop; without it, the API accepts the deletion but nothing acts to restore the desired replica count.`},{q:`You can curl a Service's ClusterIP successfully but curl my-svc.my-ns.svc.cluster.local fails to resolve. What's the most likely cause?`,o:[`CoreDNS is down or misbehaving — DNS-based service discovery fails while raw IP routing (via existing kube-proxy rules) still works`,`kube-proxy has crashed on every node`,`The api-server is down`,`etcd lost quorum`],a:0,x:`CoreDNS is an addon Deployment, not a control-plane binary, but its failure mimics a total outage for name-based traffic while ClusterIP routing (kube-proxy's job) keeps working — the discriminating test interviewers like.`},{q:`A ClusterRole named 'view' is bound to a ServiceAccount via a RoleBinding in namespace 'dev' only. Can that ServiceAccount list pods in namespace 'prod'?`,o:[`Yes, because ClusterRoles always grant cluster-wide access regardless of binding type`,`No — a namespaced RoleBinding referencing a ClusterRole grants those rules only within the binding's own namespace`,`Yes, but only for read verbs like list and get`,`No, because ClusterRoles cannot be referenced by RoleBindings at all`],a:1,x:`The binding's scope wins: a ClusterRole referenced by a namespaced RoleBinding grants that ClusterRole's rules only within the binding's namespace, not cluster-wide.`,t:`The classic trap is assuming ClusterRole always means cluster-wide — it's the binding type that decides scope.`},{q:`A teammate wants to change an existing RoleBinding to point at a different ClusterRole by editing roleRef in place. Does this work?`,o:[`Yes, roleRef can be patched freely at any time`,`Yes, but only for ClusterRoleBindings, not RoleBindings`,`No — roleRef is immutable after creation; you must delete and recreate the binding (or use kubectl auth reconcile)`,`No, RoleBindings themselves are entirely immutable, including subjects`],a:2,x:`roleRef is deliberately immutable so an existing grant can't be silently repurposed; changing it requires deleting and recreating the binding.`},{q:`The API server returns: 'User system:serviceaccount:dev:app-sa cannot list resource "deployments" in API group "apps" in the namespace "prod"'. What's the correct first thing to check?`,o:[`Whether the ServiceAccount's token has expired`,`Whether the api-server certificate is valid`,`Whether etcd has quorum`,`Whether there is a binding for that subject in the 'prod' namespace specifically, since RoleBindings don't cross namespaces`],a:3,x:`Decoding a 403 starts with checking for a binding for that exact subject in the exact namespace named in the error, since RoleBindings never cross namespace boundaries.`},{q:`What's the difference between a 401 and a 403 response from the API server?`,o:[`401 means authentication failed (bad/expired token or cert); 403 means authentication succeeded but RBAC denied the action`,`401 means RBAC denied the action; 403 means authentication failed`,`Both mean the same thing — RBAC denial — just at different API versions`,`401 only occurs for ServiceAccounts; 403 only occurs for human users`],a:0,x:`401 is an authentication failure (identity unknown), while 403 means authentication succeeded but authorization was denied — conflating them sends you debugging the wrong layer.`},{q:`A developer with rights to create pods in namespace 'dev' insists they have no way to read Secrets there since they were never granted 'get secrets'. Is this reasoning sound?`,o:[`Yes — pod-create rights and secret-read rights are completely independent`,`No — anyone who can create pods can mount any secret in that namespace into their pod, making pod-create rights secret-read rights in disguise`,`Yes, unless they also have the 'impersonate' verb`,`No, but only if automountServiceAccountToken is true`],a:1,x:`A subject who can create pods can mount any secret in that namespace into a pod they control and read it that way, so pod-create rights are effectively secret-read rights.`},{q:`Why do modern ServiceAccount tokens (from the TokenRequest API) improve on legacy service-account-token Secrets?`,o:[`They are stored permanently in etcd for auditability`,`They grant cluster-admin by default for easier debugging`,`They are audience-bound, pod-bound (invalid once the pod dies), and time-limited (~1h, auto-refreshed), unlike legacy tokens which never expired`,`They eliminate the need for RBAC entirely`],a:2,x:`Projected TokenRequest tokens are scoped, short-lived, and tied to the pod's lifetime, unlike legacy service-account-token Secrets which never expired and sat readable in etcd.`},{q:`A teammate installs a CRD for PostgresCluster but no controller is deployed yet. They create a PostgresCluster object. What happens?`,o:[`The api-server rejects the object since no controller is registered`,`A default StatefulSet is automatically created for it`,`The object is stored but immediately marked Terminating until a controller appears`,`The object is validated and stored in etcd like any resource, but nothing happens in the world — there's no behavior without a controller`],a:3,x:`A CRD alone is schema registration; the api-server serves full CRUD for it, but without a controller reconciling it, creating an object changes nothing in the world.`},{q:`$ kubectl get postgrescluster main-db -o yaml

What does the mismatch between spec.replicas and status.readyReplicas tell you, and who is allowed to write each field?`,o:[`spec is the desired state (user-writable) and status is the observed state (controller-writable only); here the controller has achieved 1 of the 3 desired replicas and is still working`,`Both fields are user-writable; the mismatch means a validation webhook failed`,`status.readyReplicas is set by the scheduler, not the controller`,`The mismatch indicates the CRD schema is misconfigured`],a:0,x:`The spec/status split is a write-ownership contract — users write spec (desired), only the controller writes status (observed) — so this mismatch simply shows reconciliation still in progress.`},{q:`A namespace is stuck in Terminating state indefinitely after deletion. What is the most likely cause?`,o:[`The api-server is down`,`Some controller responsible for removing its finalizer is dead or erroring, so the finalizer list never empties and deletion never completes`,`etcd lost quorum during the deletion`,`The namespace has a NoExecute taint applied`],a:1,x:`While finalizers are non-empty, deletion only sets deletionTimestamp and the object persists Terminating; a dead or erroring controller that never removes its finalizer is THE cause of stuck-Terminating objects.`},{q:`Why does deleting a CRD potentially wipe out related cloud resources (e.g. real databases an operator provisioned)?`,o:[`Deleting a CRD only removes the schema, never the custom resource instances`,`It doesn't — CRDs and their instances are fully independent of any cleanup logic`,`Deleting a CRD deletes every instance of that custom resource cluster-wide, and via the operator's own finalizer-driven cleanup this can cascade to deprovisioning real external resources`,`Cloud resources are only affected if RBAC grants the 'escalate' verb`],a:2,x:`Deleting a CRD deletes every instance of that resource cluster-wide, and if the operator's cleanup logic runs on that deletion, real external resources can be torn down too — which is why Helm deliberately leaves CRDs behind on uninstall.`},{q:`How do controllers avoid hammering the API server while tracking thousands of objects?`,o:[`They poll the API in a tight loop with rate limiting`,`They cache objects in etcd directly, bypassing the api-server`,`They subscribe to a Kafka-like event log maintained by etcd`,`They use informers — a client-side watch plus in-memory cache feeding a deduplicating workqueue that worker goroutines reconcile`],a:3,x:`Informers maintain a watch-fed local cache and enqueue object keys onto a deduplicating workqueue, letting a single controller pod track thousands of objects without polling the api-server.`},{q:`Two different controller instances both try to update the same custom resource's status at nearly the same time. How is the conflict resolved?`,o:[`Optimistic concurrency via resourceVersion causes the stale write to fail with a 409 Conflict, which the workqueue simply retries against the fresher object`,`The api-server queues writes and applies them sequentially with no errors`,`A distributed lock service external to Kubernetes must be used`,`The first writer wins permanently and the second write is silently dropped`],a:0,x:`Reconcilers rely on resourceVersion-based optimistic concurrency; a stale write fails with 409 Conflict and the workqueue retries it against the current object, no locking required.`}],netstore:[{q:`Your Deployment shows 3/3 pods Running, but curl to the Service ClusterIP times out. What should you check first?`,o:[`kubectl get endpointslices for the Service — readiness probes may be failing`,`Restart the pods`,`Delete and recreate the Service`,`Check the node's kubelet logs`],a:0,x:`Running pods can still have failing readiness probes, which keeps them out of EndpointSlices (ready:true). A Service with no ready endpoints times out even though pods look healthy in kubectl get pods.`,t:`services`},{q:`A teammate says 'ping 10.96.4.7 fails but curl 10.96.4.7:80 works, so the Service must be broken.' Why is this reasoning wrong?`,o:[`The ClusterIP only supports UDP, not ICMP or TCP`,`ping requires root privileges inside the pod`,`ClusterIP is a virtual IP enforced only by iptables/IPVS DNAT rules; ICMP has no rewrite rule so ping fails, while the TCP connection is correctly DNAT'd`,`The Service is in fact broken and curl succeeded by coincidence`],a:2,x:`No process listens on the ClusterIP anywhere — it's kernel rules programmed by kube-proxy. TCP connections get DNAT'd to a ready pod; ICMP has no such rule, so ping failing is expected, not a sign of breakage.`,t:`services`},{q:`In a Service manifest, what is the difference between port and targetPort?`,o:[`They must always be equal`,`port is what the Service listens on at the ClusterIP; targetPort is the container port traffic is DNAT'd to`,`targetPort is only used for NodePort services`,`port is randomly assigned by kube-proxy`],a:1,x:`port is the ClusterIP-facing port clients dial (e.g. 80); targetPort is where DNAT lands on the pod (e.g. 8080), and can be a named port so different pods use different container ports.`,t:`services`},{q:`500 office users share a single egress NAT IP and hit a Service with sessionAffinity: ClientIP. What incident pattern is likely?`,o:[`Even load balancing across all pods`,`The Service silently ignores sessionAffinity behind NAT`,`DNS round-robin overrides the affinity setting`,`All 500 users stick to a single backend pod for up to 3 hours, leaving other pods idle`],a:3,x:`ClientIP affinity uses conntrack keyed on source IP with a default 10800s (3h) timeout. Behind NAT, many real users share one source IP, so they all stick to the same pod — a classic 'one pod hot, rest idle' incident.`,t:`services`},{q:`Why does a headless Service (clusterIP: None) exist, and what does it change about DNS?`,o:[`It disables DNS entirely for that Service`,`It forces all traffic through NodePort`,`It is only valid for LoadBalancer type Services`,`It skips the virtual IP; DNS returns individual pod IPs as multiple A records instead of one VIP, letting clients pick a specific replica`],a:3,x:`Headless Services program no kube-proxy rules; cluster DNS instead returns one A record per ready pod IP, which StatefulSets rely on for stable per-pod names like mysql-0.mysql.db.svc.cluster.local.`,t:`services`},{q:`You run: kubectl describe svc web

Endpoints: <none>

kubectl get pods shows the backing Deployment's 3 pods as Running. What are the two most likely causes?`,o:[`The Service type is wrong, or the node is out of disk`,`Selector label mismatch between the Service and the pods, or the pods are failing their readiness probes`,`The ClusterIP CIDR is exhausted`,`CoreDNS is down`],a:1,x:`An empty Endpoints/EndpointSlice with Running pods points to either a selector/label typo (app: web vs app: webapp) or readiness probes failing, since only ready:true pods populate endpoints.`,h:`Recall the trap described for the services card: check endpoints, not pod status.`,t:`services`},{q:`Why does IPVS mode scale better than iptables mode for kube-proxy in clusters with 5,000+ Services?`,o:[`IPVS runs entirely in userspace and skips the kernel`,`iptables mode does not support TCP`,`IPVS uses an in-kernel hash table with real scheduling algorithms instead of evaluating thousands of sequential iptables rules`,`IPVS eliminates the need for EndpointSlices`],a:2,x:`iptables mode evaluates rules sequentially; IPVS uses an in-kernel hash table with algorithms like rr, lc, sh, which scales far better at high Service counts.`,t:`services`},{q:`What is the key behavioral difference between externalTrafficPolicy: Cluster and externalTrafficPolicy: Local for a NodePort/LoadBalancer Service?`,o:[`Cluster mode SNATs traffic (client IP is hidden) and forwards to any node; Local mode preserves the client source IP but drops traffic on nodes with no local backend pod`,`Cluster mode is IPv6-only`,`Local mode disables health checks entirely`,`There is no functional difference, only a naming difference`],a:0,x:`Cluster mode forwards to any node and SNATs, hiding the real client IP from pods. Local mode preserves the source IP but nodes without a local endpoint drop the traffic instead of forwarding it; cloud LBs pair this with health-check NodePorts.`,t:`services`},{q:`A pod in namespace shop runs nslookup payments and it resolves successfully to a ClusterIP, even though the Service is also named payments. How is the short name resolved?`,o:[`CoreDNS guesses the namespace from the pod's labels`,`kubelet writes a search list in /etc/resolv.conf (shop.svc.cluster.local, svc.cluster.local, cluster.local), so 'payments' is retried as payments.shop.svc.cluster.local`,`Short names are cached from the last successful lookup`,`The pod must have a hosts file entry pre-populated`],a:1,x:`kubelet writes a 3-entry search list into every pod's resolv.conf; a lookup for 'payments' is silently expanded against that list until one succeeds — here, payments.shop.svc.cluster.local.`,t:`dns`},{q:`An app makes frequent calls to an external API, api.stripe.com, and engineers notice spiky latency plus high CoreDNS query volume. What's the likely root cause?`,o:[`The external API is rate-limiting the cluster`,`CoreDNS caching is disabled by default`,`The pod's dnsPolicy is set to None`,`ndots:5 makes api.stripe.com (2 dots) get expanded through the whole search list first, producing three guaranteed NXDOMAIN queries before the real upstream query fires`],a:3,x:`With ndots:5, any name with fewer than 5 dots is tried against the search list before being sent upstream as-is, so external names like api.stripe.com generate extra NXDOMAIN lookups against CoreDNS — a classic ndots latency gotcha.`,t:`dns`},{q:`A pod is configured with hostNetwork: true and dnsPolicy: ClusterFirst. Service names stop resolving from inside it. Why?`,o:[`For hostNetwork pods, ClusterFirst silently degrades to the node's resolv.conf instead of cluster DNS; ClusterFirstWithHostNet is required to keep cluster DNS`,`hostNetwork pods can never resolve DNS`,`The pod needs an explicit nameserver entry in its Service manifest`,`hostNetwork disables CoreDNS cluster-wide`],a:0,x:`ClusterFirst silently falls back to the node's own resolv.conf for hostNetwork pods. dnsPolicy: ClusterFirstWithHostNet is the documented fix to keep using cluster DNS in that case.`,t:`dns`},{q:`You debug with: kubectl exec -it dbg -- nslookup mysql.db.svc.cluster.local

Name: mysql.db.svc.cluster.local
Address: 10.244.1.5
Address: 10.244.2.9
Address: 10.244.3.3

What kind of Service is mysql, and why are there multiple addresses?`,o:[`A LoadBalancer Service with 3 external IPs`,`A misconfigured Service with duplicate selectors`,`A headless Service (clusterIP: None) — DNS returns one A record per ready pod IP instead of a single ClusterIP`,`A NodePort Service exposing 3 ports`],a:2,x:`A regular Service always resolves to exactly one A record (the ClusterIP). Multiple A records, one per pod, is the signature of a headless Service — load balancing happens at DNS/client level instead of kube-proxy.`,t:`dns`},{q:`A NetworkPolicy egress-isolates a namespace, and afterward all Service name lookups start timing out from pods in it. What's missing?`,o:[`An explicit egress allow rule to kube-system on both UDP and TCP port 53 for CoreDNS`,`The Service's targetPort is wrong`,`The pod's dnsPolicy must be set to None`,`CoreDNS itself must be restarted after every NetworkPolicy change`],a:0,x:`Cluster DNS relies on egress to CoreDNS in kube-system on port 53. Egress isolation without an explicit DNS allow rule (UDP AND TCP 53) breaks nearly every lookup.`,t:`dns`},{q:`Why does the interview-standard debugging flow start with nslookup kubernetes.default before checking your own app's Service?`,o:[`kubernetes.default is a special DNS record with no dependency on CoreDNS`,`It restarts CoreDNS as a side effect`,`kubernetes.default is the only Service guaranteed to always exist, so its failure isolates the problem to CoreDNS/DNS path rather than your app`,`It bypasses ndots expansion entirely`],a:2,x:`kubernetes.default always exists on any cluster. If it fails to resolve, the problem is CoreDNS itself or the path to it (crashlooping pods, a NetworkPolicy eating port 53) — not your application.`,t:`dns`},{q:`Which statement about pod DNS records is accurate per the cluster DNS model?`,o:[`Every pod automatically gets a resolvable hostname-based DNS record`,`Only the IP-based form (10-244-1-5.shop.pod.cluster.local) always works; hostname-based records require spec.hostname + spec.subdomain matching a headless Service`,`Pods never get any DNS record, only Services do`,`Pod DNS records are stored in /etc/hosts, not CoreDNS`],a:1,x:`Plain pod names are NOT resolvable by default — a frequent false assumption. Only the IP-based form always works, and named records need explicit hostname/subdomain configuration tied to a headless Service.`,t:`dns`},{q:`You create an Ingress resource in a fresh cluster with no controller installed. What happens?`,o:[`kube-apiserver rejects the object with a validation error`,`Kubernetes automatically installs ingress-nginx`,`Traffic is routed using default kube-proxy rules`,`Nothing errors and nothing happens — the Ingress is inert YAML until a controller watches and claims it`],a:3,x:`The Ingress object does nothing by itself. It requires an ingress controller to watch it and program a real proxy; with none installed, creation silently succeeds but has zero effect — the #1 'why doesn't my Ingress work' answer.`,t:`ingress`},{q:`You run:

$ curl http://<lb-ip>/
HTTP/1.1 404 Not Found

$ curl -H 'Host: shop.example.com' http://<lb-ip>/
HTTP/1.1 200 OK

The Ingress only defines a rule for host: shop.example.com. Why does the first request 404?`,o:[`The backend Service has no ready endpoints`,`The TLS secret is missing`,`pathType is set to Exact`,`Without the right Host header, the request matches no host rule and falls through to the default backend`],a:3,x:`404 signals a routing/claiming problem, not a backend problem. Sending no Host header (or the wrong one) matches no host rule, so the controller serves its default 404 backend.`,t:`ingress`},{q:`An Ingress rule matches correctly, but clients get a 502/503. What does this indicate versus a 404, and what's the 30-second triage?`,o:[`404 and 502 mean the same thing: check DNS`,`A matched rule but a dead upstream — run kubectl describe ingress plus kubectl get endpointslices for the backend Service`,`502/503 always means the TLS certificate expired`,`Restart the ingress controller pod immediately`],a:1,x:`404 = no rule matched (routing problem). 502/503 = a rule matched but the upstream Service/backend failed (bad Service name/port, no ready endpoints, or connection resets) — describe ingress + get endpointslices is the fast triage.`,t:`ingress`},{q:`An Ingress rule uses path: /api with pathType: Prefix. Which incoming request path does NOT match?`,o:[`/api`,`/api/v1`,`/apiary`,`/api/`],a:2,x:`Prefix matching operates on whole path segments. /api matches /api and /api/v1 (and /api/) but NOT /apiary, since that isn't a segment boundary match.`,t:`ingress`},{q:`A browser shows a certificate warning naming 'Kubernetes Ingress Controller Fake Certificate' when visiting an HTTPS Ingress host. What does this indicate?`,o:[`The Ingress's TLS secret's cert SANs don't cover the requested host, so the controller falls back to its self-signed default certificate`,`The cluster has no TLS support at all`,`The client's browser is misconfigured`,`DNS resolved to the wrong load balancer`],a:0,x:`When the referenced cert's SANs don't cover the requested host, the controller silently serves its self-signed 'Fake Certificate' — a dead giveaway of a cert/host mismatch, per the card's TLS facts.`,t:`ingress`},{q:`Why can one LoadBalancer + one ingress controller front dozens of Services more cost-effectively than Service type: LoadBalancer per Service?`,o:[`Ingress compresses HTTP traffic to reduce bandwidth costs`,`LoadBalancer Services are L4 and each gets its own cloud LB and IP; Ingress is L7 and shares a single entry point that reads Host/path to route to many backend Services`,`Ingress controllers run without any load balancer at all`,`kube-proxy automatically merges multiple LoadBalancer Services into one IP`],a:1,x:`Service type LoadBalancer is L4 — every Service pays for its own cloud LB and IP, with no URL awareness. Ingress moves routing to L7 behind one shared LB, using Host/path rules to fan out to many Services.`,t:`ingress`},{q:`What does the Ingress spec's TLS block require, and what happens if it's missing while a host rule still exists?`,o:[`Nothing — TLS is automatic for all Ingress hosts`,`The Secret can live in any namespace as long as it's named correctly`,`TLS termination always happens at the backend pod, never at the controller`,`A tls block needs a hosts list and a secretName pointing at a kubernetes.io/tls Secret in the SAME namespace; without it, the controller terminates HTTP only for that host, not HTTPS`],a:3,x:`TLS is declared per-Ingress via hosts + secretName referencing a kubernetes.io/tls Secret in the same namespace as the Ingress; without it there's no HTTPS termination configured for that host.`,t:`ingress`},{q:`A team applies a NetworkPolicy with podSelector: {} and policyTypes: [Ingress], containing zero ingress rules. What's the effect?`,o:[`It default-denies all ingress to every pod in the namespace, since selection alone triggers isolation regardless of rule content`,`Nothing — an empty rules list means no policy is enforced`,`It allows all ingress since there are no explicit deny rules`,`It only affects pods that are also selected by another policy`],a:0,x:`Isolation is triggered by selection, not rule content. podSelector: {} selects every pod; policyTypes: [Ingress] with no rules isolates them all with nothing allowed in — the canonical default-deny pattern.`,t:`netpol`},{q:`In a NetworkPolicy 'from' block, what's the difference between one list entry containing both namespaceSelector and podSelector, versus two separate dashed entries for each?`,o:[`No difference; YAML normalizes both to the same rule`,`Two separate entries always causes a validation error`,`One entry with both selectors is an AND (pods matching podSelector INSIDE matching namespaces); two separate entries is an OR (either match qualifies)`,`namespaceSelector is ignored unless it's in its own entry`],a:2,x:`This is the classic AND/OR trap: a single from: entry with both selectors means AND; two dashed list entries mean OR. A stray extra '-' silently turns a tight rule into a much looser one — YAML won't warn you.`,t:`netpol`},{q:`You run:

$ kubectl exec -it app -- nc -zv -w2 db 5432
nc: db (10.96.14.2:5432): Operation timed out

$ kubectl exec -it dbg -- nc -zv -w2 10.244.3.9 5432
Connection to 10.244.3.9 5432 port [tcp/*] succeeded!

(dbg is not selected by any NetworkPolicy; app is.) What does this timeout-vs-success pattern suggest?`,o:[`A NetworkPolicy is silently dropping the packets — timeouts point at policy or firewall drops, not a listening problem`,`The database process has crashed`,`The DB Service's targetPort is misconfigured`,`DNS is returning a stale ClusterIP`],a:0,x:`Policy-dropped packets are silently discarded, producing client timeouts, not refused connections. 'Refused' would mean reaching the host with nothing listening (ports/endpoints issue). Timeout + working connectivity from an unselected pod is the classic NetworkPolicy signature.`,t:`netpol`},{q:`A team applies default-deny-egress to a namespace, then immediately applies default-deny-ingress, planning to add the DNS-allow rule last. What breaks, and why does ordering matter?`,o:[`Nothing breaks; order is irrelevant since policies are additive`,`Ingress rules take priority over egress rules automatically`,`The whole namespace loses name resolution immediately, because egress to CoreDNS on port 53 wasn't allowed before egress was locked down`,`The API server rejects policies applied out of order`],a:2,x:`The documented rollout order is: label namespaces, allow DNS egress everywhere, THEN default-deny ingress, THEN default-deny egress. Reversing that (deny egress before allowing DNS) takes down name resolution for the whole namespace in one apply.`,t:`netpol`},{q:`A NetworkPolicy tries to restrict traffic 'to the database Service' using an ipBlock with the Service's ClusterIP CIDR. Why is this unreliable?`,o:[`ipBlock only supports IPv6 addresses`,`Policies select pods, not Services — kube-proxy DNATs Service traffic to a pod IP BEFORE policy evaluation, so ipBlock on a ClusterIP CIDR doesn't reliably match`,`ClusterIPs are randomly reassigned every few minutes`,`ipBlock cannot be combined with podSelector in the same policy`],a:1,x:`Policies evaluate against pod IPs, since kube-proxy has already DNAT'd Service traffic before policy enforcement. ipBlock is meant for real external CIDRs; matching pod traffic via a ClusterIP CIDR is explicitly unreliable.`,t:`netpol`},{q:`Pod A successfully opens a TCP connection to Pod B under a restrictive NetworkPolicy setup. Do you also need a mirrored ingress rule on A to allow B's replies back?`,o:[`Yes, every egress rule needs a matching ingress rule on the initiator`,`Only if the connection uses UDP instead of TCP`,`Only if sessionAffinity: ClientIP is set on the Service`,`No — connection tracking allows reply packets automatically once the initiating connection is permitted; policies govern connection initiation, not both directions`],a:3,x:`Reply packets are handled by conntrack: if the initial connection was allowed, responses flow back automatically. You do not write a mirror rule for the reverse direction of an established flow.`,t:`netpol`},{q:`A cluster runs classic Flannel as its CNI. The team applies several NetworkPolicies and traffic is still unrestricted. What's the likely explanation?`,o:[`NetworkPolicy YAML syntax is invalid`,`NetworkPolicies require a paid Kubernetes distribution`,`The policies need a namespace label to activate`,`Flannel (classic) doesn't implement NetworkPolicy enforcement, so policies are accepted by the API but silently ignored`],a:3,x:`NetworkPolicy enforcement is the CNI's job. Calico and Cilium enforce it; classic Flannel does not — an unenforced policy fails silently, a documented operational trap.`,t:`netpol`},{q:`A policy needs to allow ingress from 'the monitoring namespace'. What must be true for namespaceSelector: matchLabels: {kubernetes.io/metadata.name: monitoring} to work?`,o:[`The monitoring namespace must be manually labeled 'name: monitoring' first`,`Nothing extra — this label is automatically applied to every namespace by its name`,`namespaceSelector only matches namespace names directly, labels are irrelevant`,`This selector syntax is invalid and must use podSelector instead`],a:1,x:`namespaceSelector matches namespace LABELS, not raw names. Every namespace automatically carries kubernetes.io/metadata.name: <name>, making matchLabels on that key the modern, label-hygiene-free way to select a namespace by name.`,t:`netpol`},{q:`kubectl describe pod on a stuck pod shows:

Warning  FailedCreatePodSandBox  kubelet  Failed to create pod
sandbox: plugin type="calico" failed: error adding container to
network: no configuration found in /etc/cni/net.d

Meanwhile pods that were already running on that node keep serving traffic fine. What does this split symptom indicate?`,o:[`A total node network outage affecting all traffic`,`The pod's application code has a bug`,`A CNI failure on that node — new pods can't get sandboxes created, but already-running pods keep working because their veths/routes were wired before the failure`,`The Service's selector no longer matches`],a:2,x:`CNI plugins are invoked at sandbox creation. A broken CNI stops NEW pods at ContainerCreating while already-running pods keep working since their networking was already wired — the classic CNI-outage fingerprint, distinct from a total network outage.`,t:`cni`},{q:`A node shows NotReady with 'container runtime network not ready: NetworkReady=false ... cni plugin not initialized'. What is the standard triage pair?`,o:[`Check /etc/cni/net.d/ for config presence and confirm the CNI DaemonSet pod is actually Running on that node`,`Restart kubelet and hope it self-heals`,`Reboot the node immediately`,`Increase the node's pod CIDR size`],a:0,x:`This exact message means kubelet found no CNI config in /etc/cni/net.d/. The documented triage is: config present in /etc/cni/net.d/, binaries present in /opt/cni/bin/, and is the CNI DaemonSet pod Running on that node.`,t:`cni`},{q:`Requests with small payloads succeed between pods on different nodes, but large-payload requests hang or fail intermittently. What CNI-layer explanation fits?`,o:[`The Service's sessionAffinity is misconfigured`,`A VXLAN overlay's encapsulation reduces the effective MTU; mismatched MTU causes large packets to fail while small ones succeed`,`The pod CIDR has been exhausted`,`CoreDNS is returning stale records`],a:1,x:`VXLAN overlays wrap pod packets in UDP, reducing effective MTU. A mismatched MTU produces the infamous 'small requests work, large payloads hang' bug — a classic overlay networking gotcha.`,t:`cni`},{q:`What core guarantee does the Kubernetes network model require that a CNI plugin must implement?`,o:[`Every pod shares the node's IP for simplicity`,`Pods must NAT all cross-node traffic through kube-proxy`,`Only pods in the same namespace can communicate`,`Every pod gets its own IP, and all pods can reach all other pods across nodes WITHOUT NAT`],a:3,x:`The contract is: every pod gets a real IP, all pods reach all pods across nodes without NAT, node agents can reach node pods, and a pod sees itself at the same IP others see. CNI plugins implement this; Kubernetes itself does not.`,t:`cni`},{q:`A pod fails to schedule with the event 'failed to allocate for range: no IP addresses available', while the node otherwise looks healthy. What's the likely cause?`,o:[`The node's pod CIDR slice (e.g. a /24, ~250 IPs) is exhausted, capping how many pods that node can host`,`The node's kubelet certificate has expired`,`The Service CIDR has been exhausted`,`The container runtime is out of disk space`],a:0,x:`Each node typically owns a pod CIDR slice from the cluster CIDR; a /24 caps it at roughly 250 usable pod IPs. Exhausting that range produces exactly this 'no IP addresses available' event while the node itself looks otherwise healthy.`,t:`cni`},{q:`Why can DaemonSets like the CNI plugin itself start scheduling on a node that is still NotReady?`,o:[`DaemonSets ignore node readiness entirely for all pods, always`,`NotReady nodes automatically become Ready once any pod is scheduled`,`DaemonSets with the right tolerations bypass the NotReady gate, which is the bootstrap trick that lets the CNI's own DaemonSet bring networking up`,`kubelet grants an exception only to pods running as root`],a:2,x:`kubelet's Ready condition gates most workloads from scheduling, but DaemonSets with appropriate tolerations can still be placed — this is exactly how the CNI's own DaemonSet gets onto a NotReady node to bring up networking in the first place.`,t:`cni`},{q:`How does Cilium's eBPF datapath change kube-proxy-style Service handling compared to iptables mode, according to the card?`,o:[`It replaces iptables chains with in-kernel eBPF programs, so Service resolution and policy checks don't degrade as O(rules) with thousands of Services, and can fully replace kube-proxy`,`It requires more iptables rules for large clusters`,`It moves all networking into userspace for easier debugging`,`It disables NetworkPolicy enforcement to gain speed`],a:0,x:`eBPF programs attached in the kernel avoid the O(rules) degradation of sequential iptables chains, letting large clusters scale Service/policy handling — this is the documented reason large clusters move off iptables-mode kube-proxy.`,t:`cni`},{q:`A PVC requesting ReadWriteOnce is already mounted read-write by a pod on node1. A second pod is scheduled onto node1 as well and also mounts it read-write. A third pod is scheduled onto node2 and tries to mount the same PVC. What happens?`,o:[`All three pods mount successfully since RWO allows unlimited pods`,`Only one pod total may ever mount an RWO volume`,`The first two pods (both on node1) succeed; the third pod on node2 fails to attach with a Multi-Attach error, because RWO counts NODES, not pods`,`The PVC automatically converts to RWX to accommodate the third pod`],a:2,x:`ReadWriteOnce means one NODE can mount read-write. Multiple pods on that same node can all write; a pod on a different node fails with 'Multi-Attach error for volume' — the single most-missed access-mode distinction.`,t:`storage`},{q:`You run:

$ kubectl describe pvc data
Status: Pending
Events:
  Type    Reason                Message
  ----    ------                -------
  Normal  WaitForFirstConsumer  waiting for first consumer to be
                                 created before binding

What should you do?`,o:[`Treat it as an error and delete/recreate the PVC`,`Nothing is wrong — this is WaitForFirstConsumer working as designed; create the pod that will use the claim`,`Manually patch the PV's claimRef to force binding`,`Switch the StorageClass's reclaimPolicy to Delete`],a:1,x:`This message is normal, not an error, when volumeBindingMode is WaitForFirstConsumer — provisioning is deliberately delayed until a pod actually consumes the claim so the scheduler can pick the node/zone first.`,t:`storage`},{q:`A team deletes a PVC bound to a PV with reclaimPolicy: Retain, expecting to recreate the PVC and reattach seamlessly. Instead, the new PVC stays Pending and the old PV shows status Released. Why?`,o:[`Retain automatically wipes the disk, so there's nothing left to bind`,`PVs can never be reused once a PVC is deleted, regardless of reclaimPolicy`,`The new PVC must use a different StorageClass to bind to a Released PV`,`The PV's spec.claimRef still points at the deleted claim's UID; it must be manually cleared (patched/edited) before the PV becomes Available again`],a:3,x:`Retain preserves both the PV object and its data, but the dangling claimRef prevents automatic re-binding. Recovery requires deliberately patching/editing the PV to clear claimRef, exposing the data to the next claimant.`,t:`storage`},{q:`A cluster has no default StorageClass, and a PVC is created without setting storageClassName at all. What happens?`,o:[`The PVC binds to any available PV regardless of class`,`Kubernetes creates a default StorageClass automatically`,`The PVC is rejected at creation time by the API server`,`The PVC stays Pending forever with an event like 'no persistent volumes available for this claim and no storage class is set'`],a:3,x:`Omitting storageClassName normally gets mutated to the default class — but with no default class configured, and no matching static PV, the PVC sits Pending eternally. This is called out as the #1 storage question on fresh clusters.`,t:`storage`},{q:`What is the practical difference between a PVC with storageClassName: "" (empty string) versus one that simply omits storageClassName?`,o:[`They are functionally identical in all cases`,`Empty string explicitly opts OUT of dynamic provisioning and matches only classless static PVs; omitting the field lets it be mutated to the cluster's default class if one exists`,`Omitting the field always fails validation`,`Empty string forces the PVC to use the fast-ssd class by convention`],a:1,x:`storageClassName: "" is a deliberate statement to skip dynamic provisioning entirely, matching only pre-existing classless static PVs — a different behavior from simply omitting the field, which defers to the default class.`,t:`storage`},{q:`A pod using a dynamically provisioned PVC fails to schedule with the event 'volume node affinity conflict'. What's the likely root cause?`,o:[`The PVC's access mode is incompatible with the StorageClass`,`The reclaimPolicy is set to Retain instead of Delete`,`volumeBindingMode: Immediate provisioned the disk in one zone before the pod's node affinity forced scheduling into a different zone, since cloud block volumes are zonal`,`CoreDNS cannot resolve the storage provisioner's Service`],a:2,x:`Immediate binding mode can provision in a zone that later conflicts with where the pod's node affinity/scheduling constraints require it to land, since block volumes are zonal. WaitForFirstConsumer exists specifically to avoid this by delaying provisioning until after pod placement.`,t:`storage`},{q:`A StorageClass has allowVolumeExpansion: true, and a team wants to shrink an over-provisioned 100Gi PVC down to 20Gi by editing spec.resources.requests.storage. What happens?`,o:[`There is no shrink path — downsizing requires creating a new smaller volume and copying data over; only expansion is supported`,`The CSI driver shrinks the disk and reclaims the freed space automatically`,`Shrinking works instantly but destroys existing data`,`The PVC is automatically deleted and a smaller one is created in its place`],a:0,x:`Expansion is one-directional: allowVolumeExpansion lets you grow a PVC upward via the CSI driver, but there is no shrink path at all. Downsizing means provisioning a new smaller volume and copying data.`,t:`storage`},{q:`You run:

$ kubectl get pvc data
NAME   STATUS        VOLUME    CAPACITY   ACCESS MODES
data   Terminating   pvc-abc1  10Gi       RWO

This persists for several minutes after kubectl delete pvc data, and a pod is still mounting it. What's the most likely explanation?`,o:[`The PVC was never actually deleted due to an API server bug`,`The kubernetes.io/pvc-protection finalizer holds it in Terminating until the last pod actively using it is gone`,`Terminating PVCs always require manual finalizer removal, even in normal operation`,`The StorageClass's reclaimPolicy is set to Retain, which blocks all deletion`],a:1,x:`PVCs (and PVs) in active use are shielded by pvc-protection / pv-protection finalizers. A deleted-but-mounted PVC hangs in Terminating until the last consuming pod is gone — this is expected behavior, not a bug.`,t:`storage`}],troubleshoot:[{q:`A prod pod shows this:
$ kubectl describe pod payment-api-7d9f8b6c5-x2kqj
State:          Waiting
  Reason:       CrashLoopBackOff
Last State:     Terminated
  Reason:       Error
  Exit Code:    1
Restart Count:  7
Events:
  Warning  BackOff  2m (x21 over 9m)  kubelet  Back-off restarting failed container
What is the single next command to find out why it's dying?`,o:[`kubectl logs payment-api-7d9f8b6c5-x2kqj --previous`,`kubectl delete pod payment-api-7d9f8b6c5-x2kqj to force a fresh restart`,`kubectl logs payment-api-7d9f8b6c5-x2kqj (without --previous)`,`kubectl exec -it payment-api-7d9f8b6c5-x2kqj -- /bin/sh`],a:0,x:`The container already crashed and restarted; --previous fetches logs from the terminated instance that actually died, while plain logs would show the fresh container that hasn't failed yet.`,h:`The current container hasn't failed yet — you need the last one's logs.`,t:`triage`},{q:"Running `kubectl logs mypod` on a CrashLoopBackOff pod returns nothing. What should you conclude?",o:[`The application never writes to stdout, so you must exec into the container instead`,`Nothing conclusive yet — the current container is fresh; add --previous to see the crashed instance's logs`,`The pod's logs were garbage collected after one hour`,`There genuinely are no logs, so the problem must be a scheduling issue`],a:1,x:`This is the classic trap: interviewers deliberately set it because forgetting --previous instantly reveals who hasn't debugged a real crash loop.`,t:`triage`},{q:`Three pods are unhealthy but you don't yet know if it's one app, one node, or the whole cluster. What's the fastest way to narrow the investigation before diving into any single pod?`,o:[`Restart all affected pods and see which ones come back healthy`,`Escalate directly to the platform team without further investigation`,`Determine the blast radius first — is it one pod, one node, one namespace, or the whole cluster`,`Immediately run kubectl logs --previous on every pod in the cluster`],a:2,x:`One question halves the search space: one pod means an app problem, one node means a node problem, everything means control plane/CNI/DNS.`,t:`triage`},{q:`During a live incident where a bad deploy is causing errors, what should you do FIRST?`,o:[`Delete the broken Deployment entirely to stop the errors`,`Wait until you have the exact exit code before taking any action`,`Immediately kubectl describe every pod to build a full root-cause picture before touching anything`,`Mitigate immediately — e.g. kubectl rollout undo — then investigate the broken state calmly afterward`],a:3,x:`Mitigate-before-root-cause: your first duty in an incident is stopping user impact, not explaining it.`,t:`triage`},{q:"Why is `kubectl get events --sort-by=.metadata.creationTimestamp` preferred over plain `kubectl get events`?",o:[`Without --sort-by, the event ordering is not guaranteed to be chronological`,`--sort-by is required to see events across all namespaces`,`Plain kubectl get events only shows events from the last 60 seconds`,`Plain kubectl get events omits Warning-type events by default`],a:0,x:`The flag turns the raw event stream into a readable, genuinely chronological timeline.`,t:`triage`},{q:"You're investigating an incident that started two hours ago, but `kubectl get events` shows nothing relevant to the original failure. Why, and what should you check instead?",o:[`Events are namespaced, so you simply forgot the -A flag`,`Events are garbage-collected after about an hour; check restart counts, container Last State, and monitoring history instead`,`The cluster's audit log has been disabled and needs to be re-enabled`,`kubectl get events only ever shows the single most recent event per object`],a:1,x:`Events are ephemeral (~1 hour retention by default), which is exactly why interviewers ask what to do when they're already gone.`,t:`triage`},{q:"A production container image is distroless (no shell), so `kubectl exec -it mypod -- /bin/sh` fails with 'no such file or directory'. What's the documented way to get tooling inside the running pod's namespaces?",o:[`kubectl exec -it mypod -- /bin/busybox sh`,`Rebuild and redeploy the image with a shell added, then exec in`,`kubectl debug -it mypod --image=busybox --target=<container>`,`kubectl cp busybox:/bin/sh mypod:/bin/sh`],a:2,x:`Ephemeral debug containers inject real tools into the running pod's namespaces; --target additionally shares the process namespace.`,t:`triage`},{q:"A pod crashes within ~100ms of starting, too fast to `kubectl exec` into. What technique lets you inspect the exact same filesystem, env vars, and mounts at leisure?",o:[`Increase the container's terminationGracePeriodSeconds to give more time to exec in`,`kubectl rollout restart and hope to exec in during a slower startup`,`kubectl debug node/<node> -it --image=busybox`,`kubectl debug <pod> -it --copy-to=dbg --set-image='*=ubuntu' -- sleep 1d`],a:3,x:`--copy-to creates a disposable clone with the entrypoint overridden so it stays up, sharing the original's filesystem, env vars, and mounts.`,t:`triage`},{q:"In `kubectl describe pod` output, what's the practical difference between seeing a FailedScheduling event versus a BackOff event?",o:[`FailedScheduling means the pod never reached a node; BackOff means it reached a node and is dying there — two different investigations`,`FailedScheduling only happens for DaemonSets; BackOff only happens for Deployments`,`BackOff always means a node problem, while FailedScheduling always means an application bug`,`They mean the same thing, just from different Kubernetes versions`],a:0,x:`One screen answers which investigation family you're in.`,t:`triage`},{q:`What are the three commands that make up the core observation trio for Kubernetes triage?`,o:[`kubectl get all, kubectl apply --dry-run, kubectl rollout status`,`kubectl describe pod, kubectl logs --previous, kubectl get events --sort-by=.metadata.creationTimestamp`,`kubectl top pod, kubectl get pod -w, kubectl exec -it`,`kubectl cluster-info, kubectl version, kubectl config view`],a:1,x:`describe pod shows state/events, logs --previous shows the dying words, get events gives the cluster timeline.`,t:`triage`},{q:`Given:
$ kubectl logs payment-api-7d9f8b6c5-x2kqj --previous
FATAL: could not connect to database "payments" at db-primary:5432: connection refused
What does this tell you about where to look next?`,o:[`The container image is corrupted and must be rebuilt`,`This is definitely an OOMKilled event, so raise the memory limit`,`The app itself is fine; investigate why db-primary:5432 is unreachable (network, DNS, or the database being down)`,`The Service selector doesn't match any pod labels`],a:2,x:`The previous instance's logs name the actual fatal error — a downstream connection failure, not an app bug.`,t:`triage`},{q:"A pod has multiple containers (or init containers) and `kubectl logs mypod` errors out asking you to specify a container. What's the fix?",o:[`kubectl describe pod always substitutes for logs in multi-container pods`,`Delete and recreate the pod with only one container`,`kubectl logs mypod --all-containers is required and has no shorthand`,`kubectl logs mypod -c <container-name>`],a:3,x:`The -c flag targets logs at a specific container in a multi-container or init-container pod.`,t:`triage`},{q:"What does `kubectl get pod <pod> -o yaml` give you that `kubectl describe pod` might leave ambiguous?",o:[`The full ground truth stored by the API server — status.conditions and exact containerStatuses including exit codes and image IDs`,`A live stream of the pod's stdout/stderr`,`The scheduler's internal decision-making logs`,`A diff against the previous revision of the pod`],a:0,x:`-o yaml exposes exactly what the cluster stored, useful for spotting things like an unexpected pulled image digest.`,t:`triage`},{q:`Why does interview-style Kubernetes troubleshooting reward saying the diagnostic loop out loud ('first I'd describe the pod because...') rather than just naming the eventual fix?`,o:[`kubectl commands cannot be run silently in a real interview`,`It demonstrates a disciplined observe-hypothesize-test loop rather than guessing at fixes, which is what's actually being graded`,`The fix is usually irrelevant and only command syntax matters`,`Kubernetes certification exams require verbal explanations`],a:1,x:`Interviewers are method-testing: observe, hypothesize one cause, test with one command, repeat.`,t:`triage`},{q:`Given:
$ kubectl get pods -n prod
NAME                    READY STATUS   RESTARTS AGE
checkout-6f7d9c-b2xkq   0/1   Pending  0        12m
$ kubectl describe pod checkout-6f7d9c-b2xkq | tail -3
  Warning FailedScheduling 45s (x9 over 12m) default-scheduler
  0/6 nodes are available: 4 Insufficient memory,
  2 node(s) had untolerated taint {dedicated: gpu}.
What is the diagnosis?`,o:[`The application is crashing on startup due to an out-of-memory condition`,`The image failed to pull because of a registry authentication error`,`The scheduler can't place the pod: 4 nodes lack sufficient memory and 2 have an untolerated taint — a scheduling problem, not an app problem`,`The pod is stuck Terminating because of a finalizer`],a:2,x:`FailedScheduling itemizes the rejection per node; this pod never reached a node at all.`,t:`podstates`},{q:"A junior engineer sees a Pending pod and runs `kubectl logs` on it to investigate. Why is this the wrong move?",o:[`kubectl logs always requires the -f flag for Pending pods`,`kubectl logs only works on pods in the Running phase for security reasons`,`Pending pods delete their logs automatically`,`A Pending pod hasn't been bound to a node yet, so no container has started and there are no application logs to see`],a:3,x:`Pending is purely a scheduling conversation; application logs simply don't exist yet.`,t:`podstates`},{q:`What are the real Pod phases in Kubernetes (as opposed to the display strings kubectl shows, like CrashLoopBackOff)?`,o:[`Pending, Running, Succeeded, Failed, Unknown`,`ImagePullBackOff, ContainerCreating, Running, Evicted, Completed`,`Waiting, Running, Terminated, Ready, NotReady`,`Pending, Scheduled, Running, CrashLoopBackOff, Terminated`],a:0,x:`CrashLoopBackOff, ImagePullBackOff, and Terminating are derived display strings, not actual pod phases.`,t:`podstates`},{q:"A pod is stuck Pending, and `kubectl get pvc` shows its claim status as Pending. What's the likely explanation?",o:[`The Service selector doesn't match the pod's labels`,`The pod is waiting on an unbound PersistentVolumeClaim, and it will sit in Pending indefinitely until the PVC binds`,`The container image doesn't exist in the registry`,`The node's kubelet certificate has expired`],a:1,x:`An unbound PVC produces the event 'pod has unbound immediate PersistentVolumeClaims' and keeps the pod Pending forever.`,t:`podstates`},{q:`A pod restarts repeatedly and \`kubectl describe pod\` shows:
Last State:     Terminated
  Reason:       OOMKilled
