rprising ways."],"more":["Ingress spec is deliberately minimal, so real-world behavior lives in controller annotations — nginx.ingress.kubernetes.io/rewrite-target, ssl-redirect, proxy-body-size, canary weights. These are 100% non-portable between controllers, which is a core motivation for Gateway API's typed, portable fields.","Gateway API in one breath: GatewayClass (which implementation), Gateway (a deployed listener — infra team owns it), HTTPRoute (routing rules — app teams own them, and can attach across namespaces via ReferenceGrant). Role-oriented, supports header matching/traffic splitting natively, and also does TCP/gRPC routes.","defaultBackend catches anything no rule matches; if you define an Ingress with no rules at all, defaultBackend is required. ingress-nginx ships its own default 404 backend, which is what actually serves those 'default backend - 404' bodies people paste into tickets.","End-to-end TLS (edge to pod) needs controller-specific annotations like nginx's backend-protocol: HTTPS, or you terminate at the edge and re-encrypt via a service mesh; the bare Ingress spec cannot express backend TLS — Gateway API's BackendTLSPolicy can.","cert-manager is the de-facto certificate workflow: an Issuer/ClusterIssuer plus an annotation on the Ingress makes it solve ACME challenges (often by temporarily injecting its own Ingress paths) and write the signed cert into the referenced Secret, auto-renewing thereafter.","Because the controller pod is in the data path, it needs capacity planning like any proxy: worker connections, keepalives to upstreams, and — often forgotten — its own PodDisruptionBudget and multiple replicas, or a node drain takes down every ingress route in the cluster at once."],"trap":"\\"I created the Ingress, DNS points at the LB, and I still get 404.\\" Walk the chain: (1) is a controller even installed and did it claim this Ingress — kubectl get ingressclass, check ingressClassName or a default class; (2) does kubectl get ingress show an ADDRESS assigned; (3) are you sending the right Host header — curl http://<ip>/ without -H Host: matches no host rule; (4) does the backend Service exist with ready endpoints. 404 = routing/claiming problem; 502/503 = matched rule, dead upstream. Two different investigations — don't mix them.","wire":"apiVersion: networking.k8s.io/v1\\nkind: Ingress\\nmetadata:\\n  name: shop\\nspec:\\n  ingressClassName: nginx        # which controller claims this\\n  tls:\\n  - hosts: [\\"shop.example.com\\"]\\n    secretName: shop-tls         # kubernetes.io/tls Secret, same ns\\n  rules:\\n  - host: shop.example.com\\n    http:\\n      paths:\\n      - path: /api\\n        pathType: Prefix         # /api, /api/v1 — not /apiary\\n        backend:\\n          service:\\n            name: api\\n            port:\\n              number: 8080\\n      - path: /\\n        pathType: Prefix\\n        backend:\\n          service: {name: web, port: {number: 80}}"},{"key":"netpol","cat":"client","icon":"shield","t":"NetworkPolicies","s":"From default-allow to zero-trust: selectors, additive rules, DNS gotcha","quick":["Kubernetes pods default to allow-all in both directions; a NetworkPolicy that SELECTS a pod flips it to deny-by-default for the listed policyTypes.","Policies are additive allow-lists — there is no deny rule and no ordering; the union of everything that selects a pod is what's allowed.","Enforcement is the CNI's job: with a plugin that doesn't implement policy (classic Flannel), NetworkPolicies are silently ignored."],"methods":["kubectl get netpol -A","kubectl describe netpol <name>","kubectl label ns monitoring name=monitoring","kubectl exec -it dbg -- nc -zv -w2 db 5432","kubectl exec -it dbg -- nslookup web","kubectl get ns --show-labels"],"intro":["Out of the box, a Kubernetes cluster is a flat open network: any pod can talk to any pod in any namespace, in both directions. NetworkPolicies are the firewall layer, but their mental model inverts what most firewall veterans expect. Think of a building where every office door starts unlocked. Writing a policy that selects a pod is like installing a lock on its door — from that instant the door is locked to everyone, and the policy's rules are the guest list of who gets a key. There are no 'deny' entries: you cannot blacklist one noisy neighbor while staying open; you lock the door and enumerate the allowed.","Because policies are additive allow-lists, multiple policies selecting the same pod never conflict — the effective access is the union of all their rules, and evaluation order does not exist. And a connection must be allowed on BOTH ends: pod A's egress rules must permit reaching B, and B's ingress rules must permit A. One side saying yes is not enough, which is why 'I allowed ingress on the server, why is it still blocked' often ends at an egress policy on the client.","Two operational truths dominate real incidents: the NetworkPolicy API is enforced by your CNI plugin — Calico and Cilium enforce it, plain Flannel does not, and an unenforced policy fails silently — and the moment you add egress isolation, you almost certainly just broke DNS, because pods resolve names via CoreDNS in kube-system on port 53."],"facts":["Isolation is per-direction and triggered by selection, not by rule content: a policy whose podSelector matches pod X and whose policyTypes includes Ingress makes X ingress-isolated even if the policy contains zero ingress rules — that is exactly how the canonical default-deny works: podSelector: {} selects every pod in the namespace, policyTypes: [Ingress], no rules, nothing allowed in.","The AND/OR trap is the single most-tested detail: one from: entry containing BOTH namespaceSelector and podSelector means 'pods matching podSelector INSIDE namespaces matching namespaceSelector' (AND), while two separate list entries (each with its own dash) mean 'either of these' (OR). A stray '-' before podSelector silently converts a tight rule into 'that namespace, OR any pod with this label in MY namespace' — a real security bug that YAML will never warn you about.","namespaceSelector matches namespace LABELS, not names — allowing 'from namespace monitoring' requires the monitoring namespace to carry a label you can select. Every namespace automatically gets kubernetes.io/metadata.name: <name>, so matchLabels: {kubernetes.io/metadata.name: monitoring} is the modern, label-hygiene-free way to select a namespace by name.","Egress-isolating a pod without an explicit DNS rule breaks nearly everything at once, because the very first step of any connection — resolving the Service name — dies. The canonical companion rule allows egress to the kube-system namespace (or CoreDNS pods by label k8s-app: kube-dns) on port 53 over BOTH UDP and TCP; forget TCP and large responses or fallback retries still fail intermittently, which is far nastier to debug than a clean outage.","Symptoms are protocol-shaped: policy-dropped packets are typically silently discarded, so clients see connection timeouts (hangs), not 'connection refused' — refused means you reached a host and nothing was listening, which points at ports/endpoints instead of policy. In an incident, timeout + working pod-IP connectivity from an unselected pod is the classic NetworkPolicy signature.","Policies select pods, not Services: traffic 'to a Service' is DNAT'd to a pod IP by kube-proxy BEFORE policy evaluation, so your rules target the backend pods' labels, and ipBlock with a ClusterIP CIDR does not do what people hope. ipBlock is meant for real cluster-external CIDRs, and matching pod traffic with it is explicitly unreliable since the CNI may rewrite addresses either side of enforcement."],"more":["Reply packets are handled by connection tracking: if the initial connection is allowed, responses flow back automatically — you do NOT write a mirror ingress rule for every egress rule. Policies govern connection initiation, not both directions of an established flow.","A ports: list with no from:/to: peer means 'this port from/to anyone'; an entirely empty rule ({}) means 'everything' — which is how allow-all-ingress policies un-isolate pods that some other default-deny selected. Empty-vs-missing distinctions in this API are load-bearing.","NetworkPolicy cannot: filter L7 (paths, methods, hostnames), log denials, block traffic from the pod's own node (kubelet health checks are always allowed), or apply cluster-wide defaults — it is namespaced only. Cilium/Calico CRDs (CiliumNetworkPolicy, GlobalNetworkPolicy) add L7 rules, deny rules, and cluster scope; the vanilla API deliberately stays minimal.","Rollout hygiene: policies apply to existing pods immediately, but many CNIs do not kill established connections when a new policy would forbid them — so a deny can appear to 'not work' against long-lived connections until they naturally reconnect. Test with fresh connections.","Standard zero-trust rollout order: (1) label namespaces, (2) apply allow-DNS-egress everywhere, (3) apply default-deny ingress per namespace and fix what breaks, (4) then default-deny egress — reversing 3 and 4 takes down the whole namespace's name resolution in one apply.","hostNetwork pods and node-originated traffic blur policy boundaries (they share the node's IP), and NodePort traffic arrives SNAT'd unless externalTrafficPolicy: Local — both classic reasons a policy 'mysteriously' allows or blocks more than expected."],"trap":"\\"We applied default-deny-egress plus an allow rule to the database, and now the app can't even reach it — but the DB accepts connections from a test pod.\\" The kill chain is DNS: the app resolves 'db.data.svc.cluster.local' before dialing, the egress policy allows TCP 5432 to the db pods but says nothing about port 53 to kube-system, so every lookup times out and the app never gets to the allowed connection. Add the DNS egress rule (UDP AND TCP 53) — and remember the test pod worked because it wasn't selected by any egress policy, or because someone dialed the raw pod IP.","wire":"apiVersion: networking.k8s.io/v1\\nkind: NetworkPolicy\\nmetadata:\\n  name: db-lockdown\\n  namespace: data\\nspec:\\n  podSelector:\\n    matchLabels: {app: db}      # who gets isolated\\n  policyTypes: [Ingress, Egress]\\n  ingress:\\n  - from:\\n    - namespaceSelector:        # ONE entry: ns AND pod (no extra dash!)\\n        matchLabels: {kubernetes.io/metadata.name: shop}\\n      podSelector:\\n        matchLabels: {app: api}\\n    ports:\\n    - {protocol: TCP, port: 5432}\\n  egress:\\n  - to:\\n    - namespaceSelector:\\n        matchLabels: {kubernetes.io/metadata.name: kube-system}\\n    ports:                      # DNS or nothing resolves\\n    - {protocol: UDP, port: 53}\\n    - {protocol: TCP, port: 53}"},{"key":"cni","cat":"client","icon":"cable","t":"CNI & the Pod Network","s":"The IP-per-pod contract, what plugins actually do, and how it breaks","quick":["The Kubernetes network model is a contract: every pod gets its own IP, all pods reach all pods WITHOUT NAT, and a pod sees the same IP others see.","Kubernetes doesn't implement this itself — a CNI plugin (Calico, Cilium, Flannel...) wires each pod's network namespace and routes cross-node traffic.","CNI failures have signatures: pods stuck ContainerCreating with 'failed to set up sandbox', or nodes NotReady with 'CNI plugin not initialized'."],"methods":["kubectl describe pod <stuck-pod>   # sandbox / CNI errors in Events","kubectl get pods -n kube-system -o wide   # find the CNI daemonset","kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'","ls /etc/cni/net.d/   # on the node: CNI config present?","kubectl describe node <n> | grep -A5 Conditions","kubectl logs -n kube-system <cni-pod>"],"intro":["Before Kubernetes, containers on one host shared the host's IP and fought over ports — deploying meant spreadsheets of 'app A gets 8081, app B gets 8082' and NAT everywhere. Kubernetes rejected that with a simple, strict contract called the network model: every pod gets its own real IP address; every pod can reach every other pod — across nodes — without NAT; agents on a node (kubelet) can reach that node's pods; and a pod sees itself at the same IP everyone else uses. It's the difference between employees sharing one desk phone with extensions, and everyone getting a direct-dial number: no coordination, no translation table, an app just binds its natural port.","Kubernetes defines this contract but deliberately does not implement it. That job goes to a CNI (Container Network Interface) plugin: when kubelet asks the container runtime to create a pod sandbox, the runtime invokes the CNI plugin, which creates the pod's network interface (typically a veth pair into the pod's network namespace), asks its IPAM component for an IP from the node's pod CIDR, and installs the routes/tunnels/eBPF programs that make that IP reachable from every other node. Cross-node reachability is where plugins differ: some encapsulate (VXLAN overlay), some program routes or BGP (native routing).","One-liners worth having ready: Flannel — simple VXLAN overlay, easy, historically no NetworkPolicy enforcement; Calico — BGP/native routing (overlay optional), strong NetworkPolicy plus its own richer policy CRDs; Cilium — eBPF datapath instead of iptables, L7-aware policies, Hubble observability, can even replace kube-proxy. Remember three separate, non-overlapping ranges: pod CIDR (CNI), Service CIDR (API server), node network."],"facts":["The 'no NAT pod-to-pod' rule is what makes the whole platform composable: when pod A (10.244.1.5) dials pod B (10.244.2.7) on another node, B's application sees source IP 10.244.1.5 — real, symmetric addressing. That's why NetworkPolicies can match peers by pod identity, why mesh mTLS and IP-based allow-lists work, and why Services only need a thin DNAT layer on top instead of full proxying.","The CNI plugin is invoked at pod sandbox creation, so a broken CNI stops new pods at ContainerCreating while ALREADY-RUNNING pods keep working — their veths and routes are still programmed. That split symptom (old traffic fine, new pods stuck, kubectl describe pod shows 'failed to set up pod sandbox: failed to find plugin ... in path /opt/cni/bin' or 'error adding container to network') is the classic fingerprint distinguishing a CNI outage from a total network outage.","A node stays NotReady with reason 'container runtime network not ready: NetworkReady=false ... cni plugin not initialized' when kubelet finds no CNI config in /etc/cni/net.d/ — the exact state of a kubeadm cluster right after init, before you install a CNI. The node-level triage pair is: config present in /etc/cni/net.d/, binaries present in /opt/cni/bin/, and is the CNI DaemonSet pod on that node actually Running.","Each node typically owns a pod CIDR slice (e.g. node1: 10.244.1.0/24, node2: 10.244.2.0/24) handed out by the controller-manager (--cluster-cidr) or the CNI's own IPAM; a /24 yields ~250 usable pod IPs, which quietly caps pods-per-node, and exhausting it produces pods stuck ContainerCreating with 'failed to allocate for range: no IP addresses available' while the node otherwise looks healthy.","Overlay vs native routing is a classic trade-off question: VXLAN (Flannel default, Calico optional) wraps pod packets in UDP so they cross any L3 underlay without the fabric knowing pod IPs — at the cost of encap overhead and a reduced effective MTU (mismatched MTU = the infamous 'small requests work, large payloads hang' bug). Calico's BGP mode advertises pod CIDRs as real routes for wire-speed native forwarding, but the underlying network must accept those routes.","Cilium's eBPF datapath replaces iptables chains with programs attached in the kernel, so Service resolution and policy checks don't degrade as O(rules) with thousands of Services — and it can fully replace kube-proxy. This is the mechanism behind 'why do large clusters move from iptables-mode kube-proxy', a favorite scaling question."],"more":["The CNI spec itself is tiny: the runtime executes plugin binaries from /opt/cni/bin with verbs ADD/DEL/CHECK, passing JSON config from /etc/cni/net.d/ on stdin; plugins chain (main plugin, then IPAM like host-local, then meta-plugins like portmap or bandwidth). 'CNI' in conversation usually means the whole networking product, but strictly it's this exec-based interface.","Kubernetes addresses four distinct traffic problems, each with its own machinery: container-to-container (shared pod netns, localhost), pod-to-pod (CNI — this card), pod-to-Service (kube-proxy VIPs), external-to-Service (NodePort/LB/Ingress). Naming which layer a symptom lives in is half of every networking interview answer.","kubelet's Ready condition literally gates on the runtime reporting NetworkReady, and until the node is Ready, most workloads won't schedule there — but DaemonSets with the right tolerations do, which is the bootstrap trick that lets the CNI's own DaemonSet start on a NotReady node to bring networking up.","hostNetwork: true pods bypass CNI entirely — they share the node's netns and IP, need no pod-network to start (which is why kube-proxy and CNI agents themselves use it), but they consume node ports and their traffic looks node-originated to NetworkPolicies.","Multus enables multi-homed pods: a meta-plugin that calls one primary CNI plus extra CNIs per pod via annotations, giving a pod eth0 on the cluster network and net1 on, say, an SR-IOV NIC — standard in telco/NFV, exotic elsewhere.","Dual-stack clusters give pods both IPv4 and IPv6 (pod.status.podIPs), with a primary family that Services default to; all three ranges (pod, Service, node) must be dual-stack-consistent, and the CNI must support it — a growing interview topic as IPv6-only clusters appear."],"trap":"\\"After a node reboot / CNI upgrade, new pods on one node sit in ContainerCreating forever, but pods created yesterday are serving fine.\\" Don't chase the app — read kubectl describe pod Events: 'failed to set up pod sandbox' → CNI. Then check that node: is the CNI DaemonSet pod Running there, does /etc/cni/net.d/ have config, do /opt/cni/bin binaries match the new version, is the pod CIDR exhausted ('no IP addresses available')? Old pods keep working because their networking was wired before the failure — survivor bias that routinely sends people hunting imaginary app bugs.","wire":"$ kubectl get nodes\\nNAME    STATUS     ROLES    AGE   VERSION\\nnode1   Ready      <none>   90d   v1.31.2\\nnode2   NotReady   <none>   90d   v1.31.2\\n\\n$ kubectl describe node node2 | grep -i network\\n  Ready  False ... KubeletNotReady  container runtime network not\\n  ready: NetworkReady=false reason:NetworkPluginNotReady\\n  message:Network plugin returns error: cni plugin not initialized\\n\\n$ kubectl describe pod web-7d4b9-x2k8p\\n  Warning  FailedCreatePodSandBox  kubelet  Failed to create pod\\n  sandbox: plugin type=\\"calico\\" failed: error adding container to\\n  network: no configuration found in /etc/cni/net.d\\n# Fix: restore CNI config/DaemonSet on node2; running pods were fine\\n# all along because their veths were wired before the breakage."},{"key":"storage","cat":"client","icon":"layers","t":"PVs, PVCs & StorageClasses","s":"The full storage lifecycle: provisioning, binding, reclaim, expansion","quick":["PVC = a namespaced request for storage ('give me 10Gi RWO'); PV = the actual cluster-scoped volume; StorageClass = the recipe for creating PVs on demand.","Binding is exclusive 1:1 — a PVC binds a PV via claimRef, matching on size (PV >= request), access modes, and storageClassName.","When the PVC is deleted, reclaimPolicy decides: Delete destroys the PV and the real disk; Retain parks the PV as 'Released' with data intact."],"methods":["kubectl get pv,pvc -A","kubectl describe pvc <name>    # Events explain Pending","kubectl get storageclass       # look for (default) marker","kubectl patch pv <pv> -p '{\\"spec\\":{\\"persistentVolumeReclaimPolicy\\":\\"Retain\\"}}'","kubectl patch pvc data -p '{\\"spec\\":{\\"resources\\":{\\"requests\\":{\\"storage\\":\\"20Gi\\"}}}}'","kubectl get events --field-selector involvedObject.name=<pvc>"],"intro":["Container filesystems are amnesiac — restart the container and every written byte is gone. Kubernetes splits the durable-storage problem into three objects that mirror a hotel booking. The PersistentVolumeClaim (PVC) is your booking request: 'one room, 10Gi, ReadWriteOnce', made in your namespace with no idea which physical room you'll get. The PersistentVolume (PV) is the actual room: a cluster-scoped object wrapping a real disk (EBS volume, NFS export, local SSD). The StorageClass is the hotel chain's build-to-order service: instead of the admin pre-building rooms (static provisioning), the class names a provisioner (a CSI driver) that constructs a brand-new PV the moment a matching booking arrives (dynamic provisioning).","The lifecycle is a state machine worth reciting: a PV starts Available; a control loop binds it exclusively 1:1 to a matching PVC (both objects point at each other — the PV's claimRef) and it becomes Bound; pods then mount the volume by referencing the PVC by name. Delete the PVC and the PV's reclaimPolicy takes over: Delete removes the PV object AND the underlying disk (the default for dynamically provisioned volumes), Retain keeps both but parks the PV in Released — data intact, yet NOT reusable, because the dangling claimRef still names the dead claim. A Released PV never re-binds until an admin clears that claimRef.","Two more dials complete the picture: volumeBindingMode on the StorageClass decides WHEN provisioning happens — Immediate (at PVC creation, blind to where the pod will land) versus WaitForFirstConsumer (wait for the pod, then provision in ITS zone) — and accessModes describe how many nodes may mount the volume, a constraint enforced at the node level, not the pod level."],"facts":["Access modes count NODES, not pods — the single most-missed distinction: ReadWriteOnce means one NODE can mount read-write, so two pods scheduled onto that same node can both write to an RWO volume, while a third pod on another node fails to attach with 'Multi-Attach error for volume'. ReadWriteOncePod (RWOP) is the stricter mode that genuinely enforces a single pod, and RWX (many nodes read-write) requires a shared filesystem like NFS/CephFS — cloud block disks (EBS, PD) are RWO by nature.","A PVC binds only to a PV that satisfies ALL of: capacity >= request, access modes compatible, and storageClassName equal — and binding is exclusive even when wasteful, so a 5Gi claim landing on a 100Gi static PV permanently occupies all 100Gi. No candidate PV plus no provisioner means the PVC just sits Pending forever with 'no persistent volumes available for this claim and no storage class is set'.","The Retain/Released war story: team deletes a PVC assuming they can re-create it and reattach — the new PVC stays Pending while the old PV shows Released, because the PV's spec.claimRef still points at the deleted claim's UID. Recovery is kubectl patch/edit the PV to remove claimRef (making it Available again) — after verifying the data should be exposed to the next claimant, since Retain deliberately preserves every byte for manual cleanup or rescue.","volumeBindingMode: WaitForFirstConsumer exists because Immediate mode can provision a disk in zone us-east-1a while the pod's node affinity later forces it into 1b — an unschedulable pod with 'volume node affinity conflict', since cloud block volumes are zonal. WFC delays provisioning until a pod actually consumes the claim, letting the scheduler pick the node first and provision in that topology; the visible tell is a PVC Pending with event 'waiting for first consumer to be created before binding' — which is NORMAL, not an error.","Exactly one StorageClass should carry the annotation storageclass.kubernetes.io/is-default-class: \\"true\\" — a PVC that omits storageClassName is mutated to use it. But storageClassName: \\"\\" (empty string) is a different statement entirely: it explicitly opts OUT of dynamic provisioning and matches only classless static PVs. Cluster has no default class + PVC omits the field = eternal Pending, the #1 storage question on fresh clusters.","Expansion, never shrinkage: if the StorageClass has allowVolumeExpansion: true, you simply edit the PVC's spec.resources.requests.storage upward and the CSI driver grows the backing disk, though filesystem resize may wait until pod (re)start depending on driver support for online expansion. There is no shrink path at all — downsizing means new smaller volume + data copy — and PVCs/PVs in active use are shielded from deletion by the kubernetes.io/pvc-protection and pv-protection finalizers, which is why a deleted-but-mounted PVC hangs in Terminating until the last pod using it is gone."],"more":["reclaimPolicy on dynamically provisioned PVs is inherited from the StorageClass at creation (default Delete) — but you can flip an individual precious PV to Retain post-hoc with kubectl patch pv, a standard pre-migration safety move before deleting namespaces.","StatefulSets use volumeClaimTemplates to stamp out one PVC per replica (data-db-0, data-db-1, ...), and deliberately do NOT delete them on scale-down, so db-1 rejoins with its old data on scale-up; the persistentVolumeClaimRetentionPolicy field (stable in v1.32) finally lets you opt into auto-deletion on scale-down or StatefulSet deletion.","Ephemeral spectrum for contrast: emptyDir lives and dies with the pod (node-local scratch, optionally medium: Memory for tmpfs); generic ephemeral volumes give a pod a dynamically provisioned PVC that is deleted with the pod; CSI ephemeral volumes are driver-defined inline volumes. Rule of thumb: cache → emptyDir, per-pod real disk → generic ephemeral, survive-the-pod data → PVC.","The CSI (Container Storage Interface) architecture replaced in-tree cloud volume code: an external-provisioner sidecar watches PVCs and calls CreateVolume, the attacher handles attach/detach to nodes, the node plugin (DaemonSet) does the actual mount, and the resizer handles expansion. 'provisioner: ebs.csi.aws.com' in a StorageClass names exactly this driver.","Static provisioning still matters for local disks: the local volume type requires a nodeAffinity on the PV (this disk exists only on node X) and pairs with WaitForFirstConsumer so the scheduler co-places the pod with its data — the price is that losing the node means losing the volume, so it's for replicated systems (Kafka, Cassandra) only.","PVC triage one-liner sequence: kubectl describe pvc (Events tell you 'no storage class', 'waiting for first consumer', or provisioner errors like quota/limits exceeded), then kubectl get sc to check a default exists, then the CSI controller pod logs — in that order, cheapest signal first.","mountOptions on a StorageClass (e.g. noatime, discard) are passed through blind — nothing validates them, and a bad option surfaces later as pods failing with mount errors, not at class creation; allowedTopologies restricts which zones the provisioner may create volumes in and pairs naturally with WaitForFirstConsumer."],"trap":"\\"PVC is Pending — is it broken?\\" Read the event before touching anything. 'waiting for first consumer to be created before binding' = WaitForFirstConsumer working as designed; create the pod. 'no persistent volumes available ... and no storage class is set' = no default StorageClass and none named — fix the class. 'volume node affinity conflict' on the POD (not the PVC) = disk already provisioned in a different zone than the node — the Immediate-mode zonal trap. And a Released PV that won't re-bind isn't broken either: Retain kept the claimRef on purpose; clear it consciously, because doing so hands the old data to the next claimant.","wire":"apiVersion: storage.k8s.io/v1\\nkind: StorageClass\\nmetadata:\\n  name: fast-ssd\\n  annotations:\\n    storageclass.kubernetes.io/is-default-class: \\"true\\"\\nprovisioner: ebs.csi.aws.com        # CSI driver that builds PVs\\nreclaimPolicy: Delete               # or Retain for precious data\\nvolumeBindingMode: WaitForFirstConsumer   # provision in the pod's zone\\nallowVolumeExpansion: true\\n---\\napiVersion: v1\\nkind: PersistentVolumeClaim\\nmetadata:\\n  name: data\\nspec:\\n  accessModes: [ReadWriteOnce]      # one NODE read-write, not one pod\\n  storageClassName: fast-ssd\\n  resources:\\n    requests:\\n      storage: 10Gi\\n# Pod: volumes: [{name: d, persistentVolumeClaim: {claimName: data}}]"},{"key":"triage","cat":"concept","icon":"terminal","t":"The Triage Method","s":"Observe, hypothesize, test — the loop interviewers actually grade","quick":["Every Kubernetes debug answer follows one loop: observe (describe/logs/events), hypothesize one cause, run one command to test it, and repeat — never jump straight to a fix.","The trio is kubectl describe pod (states + events), kubectl logs --previous (why the LAST container died), and kubectl get events --sort-by=.metadata.creationTimestamp for the cluster-wide timeline.","In an incident, mitigation beats root cause: rollout undo, scale, or shift traffic first, then debug the broken thing offline — say this out loud and you sound senior."],"methods":["kubectl describe pod <pod> — one command, three answers: container State/Last State with exit code and reason, restart count, and the Events section at the bottom","kubectl logs <pod> --previous — logs from the crashed instance; without --previous you see the fresh container that hasn't failed yet","kubectl logs <pod> -c <container> — required when the pod has multiple containers or init containers","kubectl get events --sort-by=.metadata.creationTimestamp — chronological timeline; add -A for cluster-wide, --field-selector involvedObject.name=<pod> to filter","kubectl debug -it <pod> --image=busybox --target=<container> — ephemeral debug container into a running pod, sharing its namespaces","kubectl debug <pod> -it --copy-to=dbg --set-image='*=ubuntu' — debug a copy when the pod is crashlooping too fast to exec into","kubectl debug node/<node> -it --image=busybox — pod on the node with host filesystem at /host, for node-level inspection without SSH","kubectl get pod <pod> -o yaml — the full truth: conditions, statuses, exit codes, and what the API server actually stored"],"intro":["Kubernetes troubleshooting questions are not memory tests — they are method tests. The interviewer describes a broken system ('pods are crashing', 'the service returns 502s') and watches whether you flail with random commands or run a disciplined loop: observe the current state, form ONE hypothesis, run ONE command that confirms or kills it, then iterate. Saying the loop explicitly ('first I'd describe the pod to see the state and events, because that tells me which of three failure families I'm in') scores more than knowing any single flag.","Your observation toolkit is a trio. kubectl describe pod shows the container state machine (Waiting/Running/Terminated), the Last State with its exit code, the restart count, and — most importantly — the Events section, which is the scheduler, kubelet, and probes narrating what they tried and why it failed. kubectl logs shows what the application said; the --previous flag is the one juniors forget, and it's essential because in a crash loop the current container is seconds old while the crashed one holds the actual error. kubectl get events gives you the cluster's timeline when the problem is bigger than one pod.","The senior layer on top is incident thinking. Before deep-diving, ask about blast radius: one pod, one node, one namespace, or the whole cluster? That single question halves the search space (one pod = app problem; one node = node problem; everything = control plane, CNI, or DNS). And in production, mitigate before you root-cause: kubectl rollout undo, scale up healthy replicas, or cordon the bad node — users stop bleeding, and the broken artifact is still there to study."],"facts":["kubectl describe pod is the single highest-value first command because it answers three questions at once: the container's State and Last State (with exit code and Reason like OOMKilled or Error), the restart count, and the Events section where the scheduler and kubelet explain themselves. A FailedScheduling event means the pod never reached a node, while a BackOff event means it reached a node and is dying there — two completely different investigations from one screen.","kubectl logs --previous fetches the logs of the last terminated instance of the container, and it is the difference between seeing the crash and seeing nothing. In CrashLoopBackOff the current container is either freshly restarted (empty logs) or not running at all, so plain kubectl logs is often blank; --previous shows the stack trace or fatal config error from the instance that actually died. It only reaches one restart back — if you need older history you need a log aggregator.","kubectl get events --sort-by=.metadata.creationTimestamp turns the event stream into a readable timeline; without --sort-by the ordering is not guaranteed chronological. Events are namespaced (use -A for cluster-wide) and by default garbage-collected after about an hour, so in a long-running incident the events for the original failure may already be gone — which is exactly why interviewers like asking what you'd do when events are empty (answer: check restart counts, container Last State, and your monitoring history).","kubectl debug with ephemeral containers solves the distroless problem: production images increasingly have no shell, so kubectl exec fails with 'no such file or directory'. kubectl debug -it mypod --image=busybox --target=app injects a temporary container with real tools into the running pod's namespaces — with --target it shares the process namespace so you can see the app's processes. Ephemeral containers can't be removed once added and have no probes or resource guarantees; they're for inspection, not repair.","When a pod crashes too fast to attach to, kubectl debug --copy-to creates a disposable clone you can modify: --set-image swaps the image, and appending a command like '-- sleep 1d' overrides the entrypoint so the clone stays up while you poke around inside the exact same filesystem, env vars, and mounts. This is the textbook answer to 'the container dies in 100ms, how do you get inside it?' — and the clone is unmanaged by the original Deployment, so remember to delete it.","Mitigate-before-root-cause is the phrase that separates operators from students: in a live incident your first duty is stopping user impact, not explaining it. Concretely that means kubectl rollout undo after a bad deploy, scaling healthy replicas, cordoning a suspect node, or shifting traffic — then investigating the preserved broken state calmly. Pair it with blast-radius scoping ('is it one pod, one node, or everything?') and you've demonstrated the two instincts interviewers are actually screening for."],"more":["kubectl debug node/<nodename> -it --image=busybox schedules a privileged pod onto the node with the host filesystem mounted at /host, giving you journalctl, systemctl, and node logs without SSH access — increasingly the only option in managed clusters where you can't SSH at all. Clean up the debug pod afterwards with kubectl delete pod node-debugger-....","kubectl debug supports --profile (general, baseline, restricted, netadmin, sysadmin) to control how privileged the debug container is; netadmin grants NET_ADMIN for tcpdump-style network capture, while restricted lets you debug in namespaces enforcing the restricted Pod Security Standard.","The exit-code decoder ring is worth memorizing: 0 = clean exit (a problem only if the container was supposed to run forever), 1 = generic app error, 137 = SIGKILL (128+9, OOM kill or grace-period expiry), 143 = SIGTERM (128+15, graceful shutdown honored), 126/127 = command not executable / not found (bad entrypoint or missing binary in a slim image).","kubectl get pod -o yaml is the ground truth when describe feels ambiguous: status.conditions shows PodScheduled/Initialized/ContainersReady/Ready as booleans with reasons, and status.containerStatuses carries exact exit codes, restart counts, and image IDs — useful for spotting that the node actually pulled a different digest than you expected.","For 'pod runs but behaves wrong', the docs' answer is config drift: kubectl apply --validate=strict -f pod.yaml catches misspelled or mis-nested fields that would otherwise be silently dropped, and diffing your local YAML against kubectl get pod -o yaml from the API server reveals what the cluster actually stored versus what you think you applied.","kubectl events (the newer subcommand, GA since v1.26) improves on kubectl get events with sane default chronological ordering and --for=pod/<name> filtering — worth mentioning as the modern alternative if the interviewer is current."],"trap":"Running kubectl logs without --previous on a CrashLoopBackOff pod, seeing empty output, and concluding 'there are no logs'. The crashed container's logs are one flag away — and interviewers deliberately set this trap because it instantly reveals who has debugged a real crash loop.","wire":"$ kubectl describe pod payment-api-7d9f8b6c5-x2kqj\\nName:         payment-api-7d9f8b6c5-x2kqj\\nNamespace:    prod\\nStatus:       Running\\nContainers:\\n  payment-api:\\n    State:          Waiting\\n      Reason:       CrashLoopBackOff\\n    Last State:     Terminated\\n      Reason:       Error\\n      Exit Code:    1\\n    Restart Count:  7\\nEvents:\\n  Warning  BackOff  2m (x21 over 9m)  kubelet  Back-off restarting failed container\\n$ kubectl logs payment-api-7d9f8b6c5-x2kqj --previous\\nFATAL: could not connect to database \\"payments\\" at db-primary:5432: connection refused"},{"key":"podstates","cat":"concept","icon":"box","t":"Pod Failure States","s":"Pending, CrashLoopBackOff, ImagePullBackOff and friends — decoded","quick":["Pending means the scheduler can't place the pod (resources, taints, PVC, affinity) — the FailedScheduling event in describe literally lists why every node was rejected.","CrashLoopBackOff means the container starts and dies repeatedly; kubelet backs off 10s, 20s, 40s up to a 5-minute cap, and the exit code (1 app error, 137 OOM/SIGKILL, 143 SIGTERM) tells you why.","ImagePullBackOff is always one of three things: wrong image name/tag, registry unreachable, or missing/wrong imagePullSecrets — the Failed pull event spells out which."],"methods":["kubectl describe pod <pod> — the state, Last State, exit code, and the Events section that names the exact failure","kubectl logs <pod> --previous — the dying words of the crashed container","kubectl get pod <pod> -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}' — pull the exit code directly","kubectl get events --field-selector involvedObject.name=<pod> --sort-by=.metadata.creationTimestamp — this pod's timeline only","kubectl get pvc — Pending PVCs explain Pending pods with volume claims","kubectl describe nodes | grep -A5 Taints — see what's repelling the scheduler","kubectl patch pod <pod> -p '{\\"metadata\\":{\\"finalizers\\":null}}' — last-resort unstick for Terminating pods (understand why first!)","kubectl delete pod <pod> --grace-period=0 --force — force-remove a pod stuck Terminating on a dead node"],"intro":["Every broken pod shows a status string in kubectl get pods, and each string maps to a specific failure family with a specific investigation. Interviewers walk through them one by one — 'pod is Pending, go' — so the winning preparation is knowing, for each state, (a) what mechanism produces it, (b) what kubectl describe will show, and (c) the two or three usual culprits. Note that CrashLoopBackOff, ImagePullBackOff, and Terminating are kubectl display strings derived from container state, not real pod phases — the actual phases are only Pending, Running, Succeeded, Failed, and Unknown.","The cleanest mental split: Pending means the pod never landed on a node — this is a scheduling conversation (resources, taints, affinity, volumes) and application logs don't exist yet. CrashLoopBackOff means the pod landed and the app keeps dying — this is an application/config conversation driven by exit codes and --previous logs. ImagePullBackOff and ContainerCreating mean the node accepted the pod but can't build the sandbox — registry, CNI, or volume plumbing. Placing the failure in the right family before naming causes is exactly the structure interviewers want to hear.","The remaining states are node-lifecycle stories: Terminating stuck means deletion is blocked by a finalizer or an unreachable kubelet; Evicted means the node itself ran out of a resource and the kubelet sacrificed pods to survive; OOMKilled means the kernel enforced this container's own memory limit. Each leaves distinct fingerprints in describe output, and reading those fingerprints correctly is the whole game."],"facts":["A Pending pod has been accepted by the API server but not bound to a node, and the FailedScheduling event in kubectl describe pod itemizes the rejection per node — e.g. '0/5 nodes are available: 3 Insufficient memory, 2 node(s) had untolerated taint'. The four usual causes are insufficient CPU/memory versus requests (remember: scheduling is by requests, not actual usage), untolerated taints, unsatisfiable affinity/anti-affinity or nodeSelector, and an unbound PVC — a pod waiting on a Pending PersistentVolumeClaim sits in Pending forever with a 'pod has unbound immediate PersistentVolumeClaims' event.","CrashLoopBackOff means the container starts, exits, and the kubelet restarts it with exponential backoff: 10s, 20s, 40s, doubling to a cap of 5 minutes, and the counter only resets after the container runs cleanly for 10 minutes. That's why a crashlooping pod shows 'Waiting: CrashLoopBackOff' most of the time — it's not crashing continuously, it's parked in the penalty box between attempts. The state itself names no cause; the cause lives in the exit code and kubectl logs --previous.","Exit code 137 means the kernel sent SIGKILL — in Kubernetes that is almost always the OOM killer enforcing the container's memory limit. kubectl describe pod shows Last State: Terminated, Reason: OOMKilled, and the fix conversation is right-sizing the limit versus fixing the leak, not restarting harder. Exit 143 is SIGTERM handled gracefully (normal shutdown — suspicious only in a loop, where it usually means a failing liveness probe is killing a healthy-but-slow app); exit 1 is a generic application error whose explanation is in --previous logs.","ImagePullBackOff (preceded by brief ErrImagePull attempts) has exactly three families of cause: the image name or tag is wrong or was never pushed ('manifest unknown' / 'not found' in the pull event), the registry is unreachable from the node (network, proxy, or registry outage), or authentication fails ('unauthorized' / 'pull access denied') because imagePullSecrets is missing, misspelled, in the wrong namespace, or holds expired credentials. The Failed event under describe quotes the registry's actual error string, so read it before guessing — and note a private image with no pull secret produces the same 'not found' as a typo, because registries hide private repos from unauthenticated users.","A pod stuck in ContainerCreating for minutes means the kubelet accepted it but can't finish the sandbox, and the two big culprits are networking and volumes: 'FailedCreatePodSandBox ... failed to set up pod network' points at the CNI plugin (crashed CNI daemonset, exhausted pod CIDR/IP space), while FailedMount / FailedAttachVolume events point at storage — a volume still attached to another node, a CSI driver problem, or a referenced ConfigMap/Secret that doesn't exist ('MountVolume.SetUp failed ... secret \\"x\\" not found').","Terminating stuck has two classic mechanisms: a finalizer on the pod that no controller is removing (metadata.finalizers is non-empty; the deletion waits indefinitely — also caused by a broken admission webhook blocking the pod UPDATE that removes it), or a dead node whose kubelet can never confirm the containers stopped. Also remember the grace-period timeline: delete sends SIGTERM, waits terminationGracePeriodSeconds (default 30s, preStop hooks run first), then SIGKILL — so an app that ignores SIGTERM always takes the full 30 seconds to die, which looks 'stuck' to the impatient."],"more":["Evicted pods are the kubelet's self-defense: under node-pressure eviction (MemoryPressure, DiskPressure, PIDPressure crossing eviction thresholds) it kills pods to reclaim resources, ranking them by whether usage exceeds requests, then by priority, then by relative usage — so BestEffort pods (no requests) and pods over their requests die first, while Guaranteed pods (requests == limits) are safest. Evicted pods stay visible as Failed with Reason: Evicted until garbage-collected, which is why you sometimes see dozens of Evicted corpses after a disk-pressure incident.","OOMKilled has a subtlety worth volunteering: the limit is enforced per-container via cgroups, and the OOM killer targets processes inside the cgroup — so a sidecar can be OOMKilled while the main container survives, and a child process can be killed leaving the main PID alive (the container doesn't restart, it just silently loses a worker). Check describe for which container shows OOMKilled, and remember exit 137 can also be a grace-period SIGKILL — Reason: OOMKilled versus Error disambiguates.","Init containers add their own states: Init:0/2 means waiting on init containers, Init:CrashLoopBackOff means an init container is the crasher, and Init:Error means one exited non-zero. Init containers run sequentially to completion before app containers start, so a hung 'wait-for-db' init container makes the whole pod look stuck — kubectl logs <pod> -c <init-container-name> is the move.","CreateContainerConfigError is the state juniors misread as an image problem: it means the container config can't be assembled, almost always because a referenced ConfigMap or Secret doesn't exist (envFrom/valueFrom pointing at a missing key or object). The describe event names the missing object exactly.","Probe-induced crash loops are the sneaky variant: the app is healthy but slow to start, the liveness probe fails during warmup, kubelet kills it (SIGTERM → exit 143), and the restart makes startup even slower under load — a death spiral. The fix is a startupProbe (which suspends liveness/readiness until first success, e.g. failureThreshold 30 × periodSeconds 10 = 5 minutes of patience), not a longer initialDelaySeconds guess.","kubectl delete pod --grace-period=0 --force removes the pod object from the API server without waiting for kubelet confirmation — legitimate for pods on a confirmed-dead node, dangerous for StatefulSets, where the pod's processes may still be running and a force-delete lets the controller create a duplicate identity (split-brain risk for databases). Interviewers love asking why StatefulSets deliberately do NOT force-replace pods on unreachable nodes."],"trap":"Treating CrashLoopBackOff as a cause rather than a symptom. 'The pod is in CrashLoopBackOff, so I'd restart it' fails the question — the state only says 'it keeps dying'; the actual diagnosis is the exit code plus kubectl logs --previous, and restarting harder is exactly what the kubelet is already doing.","wire":"$ kubectl get pods -n prod\\nNAME                        READY   STATUS             RESTARTS      AGE\\ncheckout-6f7d9c-b2xkq       0/1     Pending            0             12m\\ncheckout-6f7d9c-9hslm       0/1     CrashLoopBackOff   6 (91s ago)   12m\\ncheckout-6f7d9c-tr4wp       0/1     ImagePullBackOff   0             12m\\n$ kubectl describe pod checkout-6f7d9c-b2xkq | tail -3\\n  Warning  FailedScheduling  45s (x9 over 12m)  default-scheduler\\n  0/6 nodes are available: 4 Insufficient memory,\\n  2 node(s) had untolerated taint {dedicated: gpu}.\\n$ kubectl describe pod checkout-6f7d9c-tr4wp | grep -A2 Failed\\n  Warning  Failed  3m  kubelet  Failed to pull image \\"registry.corp/checkout:v2.4.1\\":\\n  rpc error: manifest for registry.corp/checkout:v2.4.1 not found"},{"key":"nodetrouble","cat":"concept","icon":"gauge","t":"Node Troubleshooting","s":"NotReady, pressure evictions, cordon/drain, and what happens to orphaned pods","quick":["NotReady means the kubelet stopped posting healthy status — diagnose bottom-up on the node: kubelet service (journalctl -u kubelet), container runtime, CNI, certificates, disk.","cordon marks a node unschedulable (existing pods stay); drain cordons AND evicts pods gracefully, honoring PodDisruptionBudgets — which is why a drain can legitimately hang.","When a node dies, its pods are marked via the unreachable NoExecute taint and evicted after ~5 minutes by default — Deployments replace them elsewhere, StatefulSets wait for confirmation."],"methods":["kubectl get nodes — the fleet overview; any STATUS other than Ready is your starting point","kubectl describe node <node> — Conditions (Ready/MemoryPressure/DiskPressure/PIDPressure/NetworkUnavailable), Taints, Allocated resources, and node events","journalctl -u kubelet -f — the kubelet's own logs on the node; the single best source for why it stopped reporting","systemctl status kubelet && systemctl status containerd — is the kubelet even running, and is its runtime alive","kubectl debug node/<node> -it --image=busybox — get onto the node without SSH; host filesystem at /host","kubectl cordon <node> / kubectl uncordon <node> — flip schedulability without touching running pods","kubectl drain <node> --ignore-daemonsets --delete-emptydir-data — evict everything for maintenance, respecting PDBs","kubectl get pdb -A — see which PodDisruptionBudgets might be blocking a drain (ALLOWED DISRUPTIONS: 0 is your blocker)","df -h /var/lib/kubelet && crictl ps — on-node disk and runtime checks when DiskPressure or sandbox errors appear"],"intro":["A node is Ready only while its kubelet regularly posts healthy status to the API server; when heartbeats stop or the kubelet self-reports a problem, the node controller flips it to NotReady or Unknown. Everything scheduled there is now in jeopardy, so node questions carry more blast radius than pod questions — and interviewers use them to test whether you can operate at the layer below Kubernetes: systemd, container runtimes, certificates, and disks.","The NotReady diagnosis runs bottom-up through the kubelet's dependencies. Is the machine up and reachable? Is the kubelet process running (systemctl status kubelet), and what do its logs say (journalctl -u kubelet)? Can it talk to its container runtime (containerd/CRI-O down produces distinctive 'connection refused to CRI socket' errors)? Is the CNI healthy (NetworkUnavailable condition, 'cni plugin not initialized')? Are the kubelet's client certificates expired (TLS errors in the log — a classic on clusters running past their first birthday)? Is the disk full (kubelet fails ungracefully when /var/lib/kubelet or the image filesystem fills)? kubectl describe node's Conditions table plus five minutes of journalctl usually names the culprit.","The second half of node mastery is controlled versus uncontrolled removal. Controlled: cordon then drain for maintenance, where PodDisruptionBudgets deliberately slow you down to protect availability. Uncontrolled: the node just dies, and Kubernetes runs its taint-based eviction machinery — understanding that ~5-minute timeline, and why a StatefulSet pod stays stuck while a Deployment pod gets replaced, is a signature senior-level answer."],"facts":["kubectl describe node shows five conditions and their healthy values: Ready=True, and MemoryPressure, DiskPressure, PIDPressure, NetworkUnavailable all False. When the kubelet stops posting entirely, conditions flip to Unknown with 'Kubelet stopped posting node status' — which tells you the node controller lost contact, distinct from the kubelet actively reporting a problem. Unknown means 'go look at the machine'; a specific True pressure condition means 'go look at that resource'.","The NotReady checklist in dependency order: (1) node powered and network-reachable, (2) kubelet running — systemctl status kubelet, then journalctl -u kubelet for the reason it's failing, (3) container runtime alive — kubelet logs show 'failed to connect to CRI socket' when containerd is down, (4) CNI initialized — 'network plugin not ready: cni config uninitialized' keeps a node NotReady even with a healthy kubelet, (5) kubelet client certificate validity — expired certs produce x509 errors and are a notorious anniversary outage, (6) disk space — a full /var/lib/kubelet or image filesystem can crash the kubelet outright, worse than mere DiskPressure.","cordon and drain are different verbs interviewers make you distinguish: cordon only sets spec.unschedulable (taints the node NoSchedule) so nothing NEW lands, while every existing pod keeps running untouched. drain cordons first, then evicts all pods via the Eviction API — it refuses to proceed without --ignore-daemonsets (DaemonSet pods would just be recreated) and without --delete-emptydir-data if pods use emptyDir volumes whose data will be destroyed. Drain is the standard pre-maintenance move; cordon alone is the 'stop the bleeding, I suspect this node' move.","Drain uses graceful eviction, which means PodDisruptionBudgets are honored — and a PDB with maxUnavailable: 0, or a 2-replica app with minAvailable: 2, makes ALLOWED DISRUPTIONS zero and the drain retries forever with 'Cannot evict pod as it would violate the pod's disruption budget'. This is a feature, not a bug: the budget is protecting availability. The fixes are scaling the app up so a disruption becomes affordable, fixing an over-strict PDB, or (break-glass) deleting the pod directly, since plain delete bypasses PDBs — they only guard voluntary evictions.","Node-pressure eviction is the kubelet locally killing pods when memory, disk, or PIDs cross eviction thresholds — no scheduler or API involvement, and PDBs do NOT apply because it's not voluntary. The eviction order: first pods whose usage exceeds their requests (BestEffort pods, with zero requests, always 'exceed' and die first), then by pod priority, then by usage relative to requests — so Guaranteed-QoS pods (requests == limits) are the most protected. Evicted pods remain as Failed/Evicted objects, and the node also gains a pressure taint that keeps new victims away.","When a node dies uncontrolled, the timeline is: kubelet misses heartbeats, node goes NotReady/Unknown (~40s of missed leases), the node controller adds node.kubernetes.io/unreachable:NoExecute, and pods without a matching toleration are evicted after the default tolerationSeconds of 300 — that's the famous 'pods take 5 minutes to reschedule off a dead node' behavior (every pod gets this toleration auto-injected at 300s; tune it per-pod for faster failover). Crucially the evicted pods can't confirm termination (kubelet is gone), so they linger Terminating; Deployments create replacements anyway, but StatefulSets deliberately refuse — a duplicate pod identity could mean two writers on one volume — until the node object is deleted or the pod is force-deleted by a human."],"more":["kubectl debug node/<node> -it --image=busybox is the SSH-less escape hatch: it runs a pod on that node with the host root filesystem mounted at /host, so chroot /host gives you journalctl, systemctl, and /var/log. In managed clusters (EKS/GKE/AKS) where node SSH may be disabled, this is often the ONLY way to read kubelet logs — a modern detail worth volunteering.","DiskPressure has two distinct filesystems behind it: nodefs (the kubelet's own volumes and logs) and imagefs (container images and writable layers). The kubelet's first response is garbage collection — deleting dead containers and unused images — and only if that fails does it evict pods; recurring DiskPressure usually means oversized image churn, log files inside containers, or emptyDir abuse rather than 'the disk is simply small'.","The control-plane taints node-role.kubernetes.io/control-plane:NoSchedule and the pressure taints (node.kubernetes.io/memory-pressure, disk-pressure, unschedulable) are how conditions become scheduling behavior — cordon itself is implemented as the unschedulable taint. DaemonSets tolerate most of these automatically, which is why monitoring agents survive on cordoned and pressured nodes.","Kubelet certificate rotation exists (--rotate-certificates and serverTLSBootstrap) but clusters built without it hit mass x509 'certificate has expired' failures — the signature symptom is many nodes going NotReady near the same date with TLS errors in journalctl. kubeadm clusters renew certs on control-plane upgrade, so 'we haven't upgraded in over a year' is a red flag answer.","A NotReady node does not stop its containers: if only the kubelet or its API connection is broken, workloads may still be running and serving — meanwhile the ReplicaSet controller has started replacements elsewhere, so you can briefly have MORE live replicas than desired. This is why idempotency and leader-election matter, and it's the mechanism behind the classic StatefulSet-vs-Deployment interview question.","For zonal thinking: the node controller rate-limits evictions (default 0.1 nodes/sec) and, when a large fraction of a zone goes NotReady simultaneously, backs off evicting at all — it assumes a network partition or control-plane problem rather than mass node death, avoiding a self-inflicted total outage. Knowing Kubernetes hesitates during large-scale failure is a genuinely senior detail."],"trap":"Answering 'the node is NotReady, so I'd drain it' — you can't gracefully drain a node whose kubelet is dead (evictions can't be confirmed), and draining skips the actual question of WHY it's NotReady. The expected answer is diagnose first (describe node, journalctl -u kubelet, runtime, CNI, certs, disk), cordon to contain, and only force-remove workloads once the node is confirmed dead.","wire":"$ kubectl get nodes\\nNAME           STATUS     ROLES    AGE    VERSION\\nnode-a1        Ready      <none>   212d   v1.29.4\\nnode-a2        NotReady   <none>   212d   v1.29.4\\nnode-a3        Ready      <none>   211d   v1.29.4\\n$ kubectl describe node node-a2\\nConditions:\\n  Type           Status    Reason                     Message\\n  Ready          Unknown   NodeStatusUnknown          Kubelet stopped posting node status.\\n  MemoryPressure Unknown   NodeStatusUnknown          Kubelet stopped posting node status.\\nTaints:        node.kubernetes.io/unreachable:NoExecute\\n               node.kubernetes.io/unreachable:NoSchedule\\n$ kubectl drain node-a3 --ignore-daemonsets\\nevicting pod prod/orders-db-1\\nerror when evicting pods/\\"orders-db-1\\": Cannot evict pod as it would violate the pod's disruption budget."},{"key":"apps","cat":"concept","icon":"cable","t":"Service & App Debugging","s":"No traffic, 502s, DNS failures, and stuck rollouts — the app-layer playbook","quick":["'Service gets no traffic' is answered by one command: kubectl get endpointslices — empty endpoints mean either the selector matches no pod labels or no matching pod is Ready (readiness probe failing).","A failing readiness probe silently removes the pod from Service endpoints without restarting anything — the pod shows Running 0/1, and that 0/1 is the entire diagnosis.","For a bad deploy, kubectl rollout undo deployment/<name> is the instant mitigation; rollout status tells you it's stuck, and progressDeadlineSeconds (default 600s) is when Kubernetes formally declares the rollout failed."],"methods":["kubectl get endpointslices -l kubernetes.io/service-name=<svc> — THE service-debug command: are there ready backend IPs at all?","kubectl describe svc <svc> — selector, ports, targetPort, and the Endpoints summary in one view","kubectl get pods --selector=<key>=<value> — replay the Service's selector by hand to see what it actually matches","kubectl get pods -o wide — READY column (0/1 = failing readiness) plus pod IPs to cross-check against endpoints","kubectl run dnsutils --image=registry.k8s.io/e2e-test-images/agnhost:2.39 -it --rm -- sh — throwaway client pod; then nslookup <svc> and wget -qO- http://<svc>:<port> to test DNS and connectivity from inside","kubectl get pods -n kube-system -l k8s-app=kube-dns — is CoreDNS itself up; follow with kubectl logs -n kube-system -l k8s-app=kube-dns","kubectl rollout status deployment/<name> — is the rollout progressing, stuck, or timed out","kubectl rollout history deployment/<name> — what changed and when (use --revision=N for detail)","kubectl rollout undo deployment/<name> [--to-revision=N] — the mitigation; rolls back to the previous ReplicaSet","kubectl describe ingress <name> — backend service/port mapping and load-balancer events for 502 hunts"],"intro":["App-layer questions simulate the most common real page: 'the deployment says everything is fine, but users get errors'. The traffic path is Ingress → Service → EndpointSlice → pod, and the discipline is walking that chain hop by hop instead of guessing. The single highest-yield fact: a Service does not route to pods directly — it routes to endpoints, and the endpoint controller only adds a pod if BOTH its labels match the Service selector AND the pod is Ready. So 'service has no traffic' collapses to one command (get endpointslices) with two branches: empty because of a selector/label mismatch, or empty because readiness probes are failing.","The readiness-probe branch deserves its own paragraph because it's the most-tested trap in Kubernetes interviews: readiness failure does NOT restart the container (that's liveness). The pod sits there Running but 0/1, quietly removed from every Service that selects it. A whole fleet can go 0/1 simultaneously — say, when a readiness endpoint checks a dependency that went down — and then the Service has zero endpoints, the ingress has nothing to send to, and users see 502/503 while every pod process is technically alive. Reading '0/1' in kubectl get pods as 'readiness failing, endpoint removed' is reflex-level knowledge.","The last pillar is rollouts. A Deployment update creates a new ReplicaSet and shifts replicas over under maxSurge/maxUnavailable rules; it gets STUCK when the new pods can't become Ready (crash loop, image pull failure, failing readiness, insufficient resources, or unsatisfiable PDB during surge). After progressDeadlineSeconds (default 600) the Deployment condition Progressing flips to False with Reason: ProgressDeadlineExceeded — Kubernetes does not auto-rollback; that's your job with kubectl rollout undo. Because rollout mechanics keep old pods serving during a stuck rollout, users are often fine while the deploy is broken — knowing that distinction shows real operational judgment."],"facts":["The service-debug chain is selector → labels → readiness → port: kubectl describe svc shows the selector, kubectl get pods --selector=<same labels> replays it by hand, and kubectl get endpointslices -l kubernetes.io/service-name=<svc> shows the result. Empty endpoints with matching, Running pods means readiness is failing (READY 0/1); endpoints present but connections refused means a port mismatch — the Service's targetPort must equal the container's actual listening port (containerPort), and a Service created with targetPort 80 against an app listening on 8080 produces endpoints that exist but refuse every connection.","Readiness and liveness failures have opposite signatures and opposite blast radii: liveness failure kills and restarts the container (RESTARTS climbing, exit 143 from the SIGTERM), while readiness failure leaves it running but unregistered (READY 0/1, RESTARTS flat, 'Readiness probe failed' warnings in describe). A dependency-checking readiness probe can therefore take an entire healthy fleet out of rotation at once — which is why the guidance is: readiness checks 'can I serve', liveness checks only 'am I deadlocked', and never point liveness at a dependency.","502/503 through an ingress is a hop-by-hop elimination: 503 usually means the ingress found NO usable backend (empty endpoints — back to selectors and readiness), while 502 means it reached something that answered wrongly — pod crashed mid-request, app listening on a different port than targetPort, connection timeouts, or TLS/protocol mismatch (backend expects HTTPS or gRPC and the ingress speaks plain HTTP, fixed via backend-protocol annotations). Confirm which hop is broken by curling the Service directly from a debug pod: if that works, the problem is ingress-side config; if it fails, go back down to endpoints.","In-cluster DNS failures present as app errors ('could not resolve db-primary') and the test is running nslookup <svc> from a throwaway client pod — not from your laptop. The ladder: does nslookup kubernetes.default work (CoreDNS reachable at all)? Are the CoreDNS pods Ready (kubectl get pods -n kube-system -l k8s-app=kube-dns) and their logs clean? Remember short names are namespace-scoped — 'db-primary' from namespace A won't resolve a service in namespace B without the qualified form db-primary.b or the FQDN db-primary.b.svc.cluster.local — cross-namespace short names are a top-3 real-world DNS 'outage'.","kubectl rollout status deployment/web is how you catch a stuck rollout ('1 out of 3 new replicas have been updated...' that never advances); after progressDeadlineSeconds (default 600) it exits non-zero and the Deployment reports Progressing=False, Reason: ProgressDeadlineExceeded. The deadline does NOT roll anything back or stop the rollout — it only sets a condition (which your CI should gate on). Diagnosis is one indirection away: kubectl get pods and describe the NEW ReplicaSet's pods, because a stuck rollout is always really a pod problem (CrashLoopBackOff, ImagePullBackOff, readiness never passing, or Pending on resources).","kubectl rollout undo deployment/web reverts to the previous ReplicaSet's pod template — it's fast because the old ReplicaSet still exists (kept per revisionHistoryLimit, default 10) and often still has ready pods during a stuck rollout. rollout history lists revisions (annotate deploys with kubernetes.io/change-cause to make it readable), and --to-revision=N targets an older one. The classic incident sequence interviewers reward: rollout status shows stuck → describe new pods shows the cause → rollout undo mitigates NOW → fix the actual bug offline and re-deploy."],"more":["Config drift is the 'runs but behaves wrong' family: the pod is healthy but reads different config than you think. Diff intent against reality — kubectl get deploy -o yaml versus your Git manifest (kubectl diff -f does this properly) — and remember pods consume ConfigMaps as env vars ONLY at container start: updating a ConfigMap does not update running pods' environments, so half your fleet can run old config until the next restart, the classic 'only some pods misbehave' puzzle.","NetworkPolicy is the invisible suspect when DNS resolves and endpoints exist but connections time out: a default-deny policy in the namespace silently drops traffic that isn't explicitly allowed — and a policy allowing app traffic but forgetting UDP 53 egress breaks DNS in a maddeningly intermittent way. kubectl get networkpolicy -n <ns> should be on your service-debug checklist.","kube-proxy is the layer below Services: it programs iptables/IPVS rules that turn the ClusterIP into real pod IPs. If endpoints look correct but ClusterIP connections fail from exactly one node, suspect that node's kube-proxy (check the kube-system daemonset pod on it) — 'works from some nodes, not others' is the fingerprint distinguishing kube-proxy trouble from app trouble.","Rollouts can also be stuck by PDBs plus maxUnavailable: with replicas 3, maxUnavailable 1, and a PDB of minAvailable 3, the Deployment can never take a pod down to make progress — surge-only rollouts (maxUnavailable: 0, maxSurge: 1) sidestep it but require spare cluster capacity for the extra pod, which itself can leave the surge pod Pending on a full cluster.","Session-affinity and long-connection gotchas: kubectl rollout restart deployment is the clean way to bounce pods (never delete pods one by one when a controller can do it under PDB protection), but clients holding long-lived connections (gRPC, websockets) don't rebalance to new pods until they reconnect — 'we deployed the fix but some clients still see the bug' often means old connections pinned to draining pods.","The two-minute service-debug script worth reciting: (1) kubectl get pods -o wide — Running and 1/1? (2) get endpointslices — populated? (3) describe svc — selector and targetPort sane? (4) from a debug pod: nslookup then curl the ClusterIP then curl a pod IP directly — each hop that works eliminates a layer, and whichever hop first fails names the subsystem."],"trap":"Blaming the ingress or 'networking' for 502s before checking endpoints. The majority of no-traffic and 502 incidents resolve at kubectl get endpointslices — a selector typo or a failing readiness probe — and interviewers specifically watch whether you check endpoints early or burn minutes describing ingress controllers while the READY column says 0/1.","wire":"$ kubectl get pods -l app=web -o wide\\nNAME                   READY   STATUS    RESTARTS   AGE   IP\\nweb-59d4c7d6b8-fk2xp   0/1     Running   0          8m    10.244.1.17\\nweb-59d4c7d6b8-mq9zt   0/1     Running   0          8m    10.244.2.31\\n$ kubectl get endpointslices -l kubernetes.io/service-name=web\\nNAME        ADDRESSTYPE   PORTS   ENDPOINTS   AGE\\nweb-b8dxl   IPv4          8080    <unset>     42d\\n$ kubectl describe pod web-59d4c7d6b8-fk2xp | grep -A1 Readiness\\n  Warning  Unhealthy  90s (x24 over 8m)  kubelet\\n  Readiness probe failed: Get \\"http://10.244.1.17:8080/healthz\\": dial tcp: connect: connection refused\\n$ kubectl rollout undo deployment/web\\ndeployment.apps/web rolled back"},{"key":"openshift","cat":"server","icon":"layers","t":"OpenShift Platform Delta","s":"What changes when your Kubernetes becomes OpenShift — projects, oc, cluster operators, machine configs","quick":["OpenShift = Kubernetes + opinionated batteries: OAuth login, built-in registry, Routes, SCCs, builds — all managed by cluster operators.","A Project is a namespace plus annotations (UID range, node selector) created through a template you can't bypass with plain 'kubectl create ns' as a normal user.","'oc get co' is the single fastest cluster health check — every platform component reports Available/Progressing/Degraded through its cluster operator."],"methods":["oc login --token=<token> --server=https://api.cluster.example.com:6443","oc get clusteroperators (oc get co)","oc new-project team-a --display-name='Team A'","oc status / oc project / oc whoami","oc adm top nodes && oc get machineconfigpool","oc debug node/<node-name>","oc explain route.spec / oc api-resources --api-group=route.openshift.io"],"intro":["OpenShift Container Platform (OCP) is Red Hat's distribution of Kubernetes. Everything you know about Pods, Deployments, Services, and ConfigMaps still applies — OpenShift runs a real Kubernetes API server underneath, and kubectl works against it. What OpenShift adds is a layer of opinionated, supported components that vanilla clusters make you assemble yourself: an integrated OAuth server for login, a built-in image registry, HAProxy-based ingress via Routes, a stricter default security model (SCCs), and CI-ish build primitives (BuildConfigs, ImageStreams). In interviews, the winning framing is 'Kubernetes plus a productized platform layer', not 'a different orchestrator'.","The management philosophy is the biggest mental shift: almost nothing on an OCP cluster is configured by hand. Every platform component — API server, ingress, DNS, registry, monitoring, even the operating system config of nodes — is owned by a cluster operator that continuously reconciles it. If you SSH to a node and edit a file, the Machine Config Operator will detect drift or stomp it on the next rollout. You change the cluster by editing custom resources (IngressController, ImageContentSourcePolicy, MachineConfig) and letting operators do the work. Nodes run RHCOS (Red Hat Enterprise Linux CoreOS), an immutable OS that is itself treated as operator-managed configuration.","Day to day you use 'oc', a superset of kubectl. All kubectl verbs work, plus OpenShift-specific ones: 'oc new-app' to generate app resources from an image or git repo, 'oc login' against the OAuth server, 'oc project' to switch namespaces, 'oc debug node/...' to get a host shell, and 'oc rsh' into pods. Projects are OpenShift's wrapper around namespaces: same object underneath, but created via a request flow that stamps annotations (like the UID range SCCs use) and can enforce quotas, limits, and node selectors from a project template."],"facts":["A Project is literally a Kubernetes namespace with OpenShift metadata layered on. When a self-service user runs 'oc new-project', the request goes through the projectrequest API, which instantiates a project template — this stamps annotations like openshift.io/sa.scc.uid-range (which drives arbitrary-UID assignment for pods) and can inject default quotas, LimitRanges, and NetworkPolicies. That's why admins customize the project template instead of writing an admission webhook to bootstrap new namespaces.","'oc get co' lists ClusterOperators, each with three conditions: Available, Progressing, and Degraded. A healthy cluster shows every operator Available=True, Progressing=False, Degraded=False. During an upgrade you expect Progressing=True to walk through operators one by one; a stuck upgrade almost always shows exactly which operator is Degraded, and 'oc describe co <name>' plus the operator's pods in its openshift-* namespace tell you why. This makes 'oc get co' the OCP equivalent of a top-level health dashboard.","Node configuration is declarative via MachineConfig objects, rendered and applied by the Machine Config Operator (MCO). MachineConfigs are grouped by MachineConfigPool (typically 'master' and 'worker'); when you create a new MachineConfig — say to add a kernel argument or a registry CA — the MCO cordons, drains, reboots, and updates nodes in the pool one at a time. That's why applying a MachineConfig to the worker pool causes a rolling reboot of every worker, which surprises people who expected a config file push.","The cluster upgrade itself is operator-driven: the Cluster Version Operator (CVO) reads the desired version from the ClusterVersion resource and reconciles every other operator to the manifests in the release payload. This is why you can't just bump one component's image — the CVO would revert it. Legitimate customization happens through each operator's own CR (e.g., the IngressController CR to add router replicas), never by editing operator-managed Deployments directly.","Authentication is built in: the cluster runs an OAuth server, and 'oc login' exchanges credentials (via identity providers you configure — htpasswd, LDAP, OIDC) for a bearer token. Authorization is standard Kubernetes RBAC with OpenShift convenience roles like 'admin', 'edit', 'view' pre-bound per project, plus 'oc adm policy add-role-to-user' as sugar over RoleBindings. There is no cloud-IAM-webhook dance like EKS; identity is a first-class cluster service.","The internal image registry (image-registry.openshift-image-registry.svc:5000) is a cluster service wired to ImageStreams: every project gets push/pull access scoped by RBAC, and builds push there by default. Combined with default-on platform monitoring (Prometheus/Alertmanager stack in openshift-monitoring) and logging options, this is the practical meaning of 'batteries included' — the stuff you'd bolt onto vanilla K8s with Helm charts ships as supported, operator-managed components."],"more":["oc is a strict superset of kubectl, but a few behaviors differ: 'oc new-app' generates Deployment + Service + (optionally) BuildConfig/ImageStream from a git URL or image; 'oc expose svc/<name>' creates a Route, not an Ingress; 'oc adm' hosts cluster-admin tooling (must-gather, node drain, policy). Interviewers like hearing that plain kubectl works fine — you just lose the OpenShift-specific verbs and resource shortcuts.","'oc adm must-gather' collects a support bundle (operator states, node logs, resource dumps) and is the expected first artifact when opening a Red Hat support case; pairing it with 'oc adm inspect co/<name>' shows you know the actual support workflow, not just kubectl debugging.","OperatorHub/OLM (Operator Lifecycle Manager) extends the operator philosophy to workloads: you install databases, service mesh, GitOps etc. as operators via Subscription objects, and OLM handles upgrades and dependency resolution. Knowing that 'install this via OperatorHub' means 'create a Subscription in a namespace watched by an OperatorGroup' is a solid differentiator.","Default self-service is configurable: the self-provisioner cluster role lets any authenticated user create projects; hardened clusters remove that binding so only a pipeline or admin creates projects from a vetted template. This is a common governance question — the answer is 'remove self-provisioner from system:authenticated:oauth and customize the project request template'.","RHCOS nodes are immutable and managed via Ignition + MachineConfigs; you generally cannot 'yum install' anything on them. Host access for debugging goes through 'oc debug node/<node>' which schedules a privileged pod with the host filesystem mounted at /host — followed by 'chroot /host' for a real host shell.","Releases follow Kubernetes closely (OCP 4.x maps to specific K8s minors, e.g. 4.19 ~ K8s 1.32). EUS (Extended Update Support) releases matter for enterprise upgrade planning — clusters typically hop even-numbered EUS-to-EUS with a supported path enforced by the CVO's update graph."],"trap":"Saying 'OpenShift is not really Kubernetes' or, at the other extreme, treating it as identical. It IS certified Kubernetes — kubectl and standard manifests work — but the delta (SCCs rejecting root images, Routes instead of raw Ingress, operators reverting manual edits, MachineConfigs rebooting nodes) is exactly what breaks naive lift-and-shift. Also: never 'fix' an operator-managed resource by editing it directly; the operator will revert you. Change the operator's CR instead.","wire":"$ oc get co\\nNAME             VERSION   AVAILABLE   PROGRESSING   DEGRADED   SINCE\\nauthentication   4.19.3    True        False         False      12d\\nconsole          4.19.3    True        False         False      12d\\ndns              4.19.3    True        False         False      45d\\nimage-registry   4.19.3    True        False         False      12d\\ningress          4.19.3    True        True          False      3m2s\\nmachine-config   4.19.3    True        False         True       14m\\nmonitoring       4.19.3    True        False         False      12d\\nnetwork          4.19.3    True        False         False      45d\\n\\n$ oc describe co machine-config | grep -A2 Degraded\\n    Status: True\\n    Reason: RequiredPoolsFailed\\n    Message: error pool worker is not ready, 1 node(s) degraded"},{"key":"scc","cat":"server","icon":"shield","t":"Security Context Constraints (SCC)","s":"Why root-assuming images die on OpenShift — restricted-v2, arbitrary UIDs, and fixing images the right way","quick":["restricted-v2 is the default SCC: no root, no privilege escalation, ALL capabilities dropped, seccomp enforced, and the pod runs as a random UID from the project's range.","Fix images, not policy: don't hardcode a UID, chown/chmod app dirs to
