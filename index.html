oll-mr`,`scroll-ml`],"scroll-my":[`scroll-mt`,`scroll-mb`],"scroll-p":[`scroll-px`,`scroll-py`,`scroll-ps`,`scroll-pe`,`scroll-pbs`,`scroll-pbe`,`scroll-pt`,`scroll-pr`,`scroll-pb`,`scroll-pl`],"scroll-px":[`scroll-pr`,`scroll-pl`],"scroll-py":[`scroll-pt`,`scroll-pb`],touch:[`touch-x`,`touch-y`,`touch-pz`],"touch-x":[`touch`],"touch-y":[`touch`],"touch-pz":[`touch`]},conflictingClassGroupModifiers:{"font-size":[`leading`]},postfixLookupClassGroups:[`container-type`],orderSensitiveModifiers:[`*`,`**`,`after`,`backdrop`,`before`,`details-content`,`file`,`first-letter`,`first-line`,`marker`,`placeholder`,`selection`]}});function zn(...e){return Rn(ut(e))}var Bn=o((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),I=o(((e,t)=>{t.exports=Bn()}))(),Vn=pt(`inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0`,{variants:{variant:{default:`bg-primary text-primary-foreground shadow hover:bg-primary/90`,destructive:`bg-destructive text-destructive-foreground shadow-sm hover:bg-destructive/90`,outline:`border border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground`,secondary:`bg-secondary text-secondary-foreground shadow-sm hover:bg-secondary/80`,ghost:`hover:bg-accent hover:text-accent-foreground`,link:`text-primary underline-offset-4 hover:underline`},size:{default:`h-9 px-4 py-2`,sm:`h-8 rounded-md px-3 text-xs`,lg:`h-10 rounded-md px-8`,icon:`h-9 w-9`}},defaultVariants:{variant:`default`,size:`default`}}),L=_.forwardRef(({className:e,variant:t,size:n,asChild:r=!1,...i},a)=>(0,I.jsx)(r?Xe:`button`,{className:zn(Vn({variant:t,size:n,className:e})),ref:a,...i}));L.displayName=`Button`;var Hn={},Un=JSON.parse(`[{"key":"pods","cat":"host","icon":"box","t":"Pods & Container Lifecycle","s":"The atomic unit: shared namespaces, init/sidecar ordering, probes, restarts, QoS","quick":["Smallest deployable unit — containers share one network namespace and IP","Init containers run to completion first; sidecars are init containers with restartPolicy: Always","Liveness restarts a container, readiness only pulls it out of Service endpoints"],"methods":["kubectl describe pod <name>","kubectl logs <pod> -c <container> --previous","kubectl get pod <name> -o yaml","spec.restartPolicy","livenessProbe / readinessProbe / startupProbe","kubectl debug -it <pod> --image=busybox --target=<container>"],"intro":["A Pod is the smallest thing Kubernetes will schedule — not a container, but a wrapper around one or more containers that are forced to live and die together on the same node. Think of it as a tiny virtual host: every container inside gets the same IP address, the same localhost, and can share volumes, while still being separate processes with separate images and filesystems.","Why does this exist at all? Because real applications often need a helper glued to them — a log shipper, a proxy, a one-time setup step — and those helpers must share the app's network and storage. Kubernetes solves this by making the Pod the unit of scheduling and the container the unit of packaging.","Mental model: the Pod is a rented apartment, containers are roommates. They share the address (IP), the front door (ports), and common areas (volumes), but each has their own room (filesystem). If the whole apartment is condemned (pod deleted/evicted), everyone leaves together; if one roommate collapses (container crash), the landlord (kubelet) revives just that roommate in place."],"facts":["Every Pod starts with a hidden 'pause' (infrastructure) container whose only job is to hold the Linux network, IPC, and (optionally) PID namespaces open. Application containers are then started joined into those namespaces — that is mechanically why two containers in the same Pod can reach each other on localhost and why the Pod's IP survives an app container crashing and restarting: the namespaces belong to pause, not to your app.","Init containers run strictly one at a time, in the order listed, and each must exit 0 before the next starts; app containers only start after the last init container completes. A native sidecar is literally an init container with restartPolicy: Always — the kubelet starts it in init order but does not wait for it to exit, keeps restarting it for the life of the Pod, and (unlike a plain app container) guarantees it comes up before the main app and shuts down after it, which is exactly what a log shipper or service-mesh proxy needs.","A failed liveness probe makes the kubelet kill and restart that one container in place — the Pod keeps its name, IP, and node, and only the RESTARTS counter climbs. A failed readiness probe never restarts anything: the endpoints controller just removes the Pod's IP from the EndpointSlices of every matching Service, so traffic stops flowing to it while the process keeps running. That's why a deadlocked app needs liveness but an app waiting on a slow dependency needs readiness — restarting it wouldn't make the database come back.","A startup probe suppresses both liveness and readiness probes until it succeeds once, and its budget is failureThreshold × periodSeconds — e.g. failureThreshold: 30 with periodSeconds: 10 gives a slow JVM up to 300 seconds to boot before the kubelet gives up and restarts it. Without it, you'd have to inflate the liveness probe's initialDelaySeconds to cover the worst-case startup, which then also delays detection of real deadlocks for the entire life of the container.","restartPolicy (Always, OnFailure, Never) is set per-Pod but enforced per-container by the kubelet, and restarts use an exponential backoff starting at 10s and doubling to a 5-minute cap — that backoff window is what you're seeing as CrashLoopBackOff. The status is not an error itself; it means 'the container exited, and the kubelet is deliberately waiting before the next restart attempt', so the real diagnosis lives in kubectl logs --previous, which shows the dying container's last output.","QoS class is computed from requests/limits at Pod creation and decides who dies first under node memory pressure: Guaranteed (every container has requests equal to limits for CPU and memory), Burstable (at least one request set, but not fully Guaranteed), BestEffort (nothing set at all). When the kubelet must evict, BestEffort pods and Burstable pods exceeding their requests go first, while Guaranteed pods are last — so a production database with requests=limits will outlive a limitless batch job on a starving node."],"more":["Static Pods are run by the kubelet directly from manifest files on the node's disk (typically /etc/kubernetes/manifests) with no controller and no scheduler involved; the kubelet then creates read-only 'mirror pods' in the API server so you can see them with kubectl, but deleting the mirror pod does nothing — the kubelet immediately recreates it. This is how kubeadm runs the control plane itself: api-server, etcd, scheduler and controller-manager are static pods on the control-plane node.","Pod deletion is a two-phase negotiation: the API server sets deletionTimestamp, the kubelet sends SIGTERM to each container, and only after terminationGracePeriodSeconds (default 30s) does it send SIGKILL. Simultaneously the endpoints controller removes the Pod from Service endpoints — but these two paths race, so a pod can still receive a few requests after SIGTERM. That's why graceful shutdown handlers plus a small preStop sleep are the standard fix for dropped connections during rollouts.","Probe defaults are sharper than people expect: timeoutSeconds defaults to just 1 second, failureThreshold to 3, periodSeconds to 10. An endpoint that occasionally takes 1.5s to respond under load will intermittently 'fail' liveness three times in a row and get its container killed mid-traffic-spike — the classic self-inflicted outage where the probe, not the app, causes the restarts.","Pod phase (Pending, Running, Succeeded, Failed, Unknown) is a coarse summary, while container states (Waiting, Running, Terminated) carry the actionable detail. A Pod can be phase Running while a container inside is in Waiting with reason CrashLoopBackOff — so 'the pod says Running' proves very little; always read kubectl describe for per-container state, last state, and exit codes (137 = SIGKILL/OOM, 143 = SIGTERM).","Ephemeral containers (kubectl debug) let you attach a fresh container with debugging tools into a running Pod's namespaces without restarting it — essential for distroless or scratch images that have no shell. With --target you even share the target container's process namespace, so you can see its processes from the debug container.","successThreshold must be 1 for liveness and startup probes (a single success resets the failure count and marks it live), but readiness may set it higher — e.g. successThreshold: 3 means the pod must pass three consecutive checks before traffic returns, which damps flapping endpoints from bouncing in and out of a Service."],"trap":"Interviewers ask 'what happens when a liveness probe fails?' hoping you'll say 'the pod restarts' — it doesn't: the kubelet restarts only that container in place, and the Pod object, its IP, and its node assignment all survive.","wire":"apiVersion: v1\\nkind: Pod\\nmetadata:\\n  name: web\\nspec:\\n  initContainers:\\n  - name: wait-db\\n    image: busybox:1.36\\n    command: [\\"sh\\", \\"-c\\", \\"until nc -z db 5432; do sleep 2; done\\"]\\n  - name: log-shipper           # native sidecar\\n    image: fluent-bit:2.2\\n    restartPolicy: Always\\n  containers:\\n  - name: app\\n    image: myapp:1.4\\n    startupProbe:\\n      httpGet: {path: /healthz, port: 8080}\\n      failureThreshold: 30      # 30 x 10s = 300s startup budget\\n      periodSeconds: 10\\n    livenessProbe:\\n      httpGet: {path: /healthz, port: 8080}\\n      periodSeconds: 10\\n      failureThreshold: 3\\n    readinessProbe:\\n      httpGet: {path: /ready, port: 8080}\\n      periodSeconds: 5"},{"key":"workloads","cat":"host","icon":"layers","t":"Deployments, StatefulSets & Friends","s":"Rollout mechanics, rollback, stable identity, node daemons, and batch work","quick":["Deployment drives ReplicaSets; maxSurge/maxUnavailable pace the swap","Rollback = re-scaling an old ReplicaSet kept by revisionHistoryLimit","StatefulSet gives ordinal names, stable DNS, and one PVC per replica"],"methods":["kubectl rollout status deployment/<name>","kubectl rollout undo deployment/<name> --to-revision=2","kubectl rollout history deployment/<name>","spec.strategy.rollingUpdate.maxSurge / maxUnavailable","spec.updateStrategy.rollingUpdate.partition (StatefulSet)","kubectl get rs -l app=<name>"],"intro":["You almost never create bare Pods, because a bare Pod that dies stays dead. Workload controllers are the layer that keeps recreating Pods to match a declared desired state: a Deployment for interchangeable stateless replicas, a StatefulSet for replicas that need a name and their own disk, a DaemonSet for one-per-node agents, and Jobs/CronJobs for work that should finish rather than run forever.","The key insight for interviews is that a Deployment doesn't manage Pods directly — it manages ReplicaSets, and each ReplicaSet manages Pods of exactly one template version. A rolling update is really two ReplicaSets being scaled in opposite directions, and a rollback is just scaling an old ReplicaSet back up.","Mental model: the Deployment is a shift manager swapping one uniformed crew (old ReplicaSet) for another (new ReplicaSet). maxSurge says how many extra workers may be on the floor during the handover; maxUnavailable says how many stations may sit empty. The old crew's roster is kept on file (revision history) so a bad new crew can be sent home instantly."],"facts":["A rolling update creates a new ReplicaSet named <deployment>-<pod-template-hash> and scales it up while scaling the old one down, bounded by maxSurge and maxUnavailable (both default 25%, rounded up and down respectively). Concretely with 10 replicas: maxSurge 25% allows up to 13 total pods, maxUnavailable 25% requires at least 8 available — so the controller starts up to 3 new pods, waits for them to pass readiness, kills up to 2 old ones, and ratchets forward in these increments until the new ReplicaSet owns all 10.","Only a change to .spec.template triggers a rollout and a new revision — editing replicas, labels on the Deployment itself, or annotations does not. Mechanically the controller hashes the pod template into the pod-template-hash label; a new hash means a new ReplicaSet. This is why 'kubectl scale' never causes a rolling restart, and why 'kubectl rollout restart' works by injecting a kubectl.kubernetes.io/restartedAt annotation into the template, forcing a hash change with an otherwise identical spec.","Rollback (kubectl rollout undo) is not a special mechanism — old ReplicaSets are kept at 0 replicas (revisionHistoryLimit, default 10), and undo simply copies an old ReplicaSet's template back into the Deployment, which then scales that ReplicaSet up under the normal rolling-update rules. This is also why setting revisionHistoryLimit: 0 silently destroys your ability to roll back: the old ReplicaSets holding those templates are garbage-collected.","A rollout that can't make progress — image pull failures, pods never passing readiness — doesn't fail loudly by itself; the Deployment waits progressDeadlineSeconds (default 600) and then only flips its Progressing condition to False with reason ProgressDeadlineExceeded. Kubernetes will NOT auto-rollback: the stuck new pods and remaining old pods just sit there, which is why 'kubectl rollout status' hanging plus a ProgressDeadlineExceeded condition is the canonical 'stuck rollout' scenario, fixed by rollout undo or pushing a corrected image.","A StatefulSet gives each replica a persistent identity: pod name <set>-<ordinal> (web-0, web-1...), a matching hostname, and a stable DNS record <pod>.<headless-service>.<ns>.svc.cluster.local via a required headless Service (clusterIP: None). If web-1 is rescheduled to another node it comes back as web-1 with the same DNS name — which is exactly what clustered systems like Kafka or PostgreSQL need to find their peers, and what a Deployment's random pod names (web-75675f5897-x7x2p) can never provide.","volumeClaimTemplates stamp out one PVC per ordinal (www-web-0, www-web-1...), and the binding is sticky: web-1 always remounts www-web-1 wherever it lands. Scaling down or even deleting the StatefulSet does NOT delete these PVCs by default — a deliberate data-safety choice — so scaling from 5 back up to 5 reattaches the old data, and truly removing data requires deleting the PVCs yourself (or opting into persistentVolumeClaimRetentionPolicy)."],"more":["With the default podManagementPolicy: OrderedReady, a StatefulSet creates pods strictly sequentially (web-0 must be Running and Ready before web-1 starts) and deletes in reverse order. The nasty corollary: if web-0 crashloops on a bad update, the entire rollout wedges and no later pod is touched — sometimes requiring scale-to-zero, fix the spec, scale back up. podManagementPolicy: Parallel drops the ordering for apps that don't need it.","StatefulSet updateStrategy.rollingUpdate.partition is a built-in canary: only pods with ordinal >= partition get the new template. Set partition: 2 on a 3-replica set and only web-2 updates; observe it, then lower the partition to 1, then 0 to complete the rollout — no service-mesh tooling required. updateStrategy: OnDelete goes further and only updates a pod when you manually delete it.","A DaemonSet runs exactly one pod per (matching) node and reacts to node lifecycle, not a replica count — add a node, get a pod. The default scheduler places DaemonSet pods using node affinity, and the controller adds tolerations for node.kubernetes.io/not-ready and unreachable automatically, which is why log agents and CNI plugins keep running on nodes that ordinary workloads are being evicted from.","A Job runs pods to completion: completions sets how many successes are needed, parallelism how many run at once, and backoffLimit (default 6) how many pod failures are tolerated before the Job is marked Failed. Because failed pods are recreated with exponential backoff, a Job's workload must be idempotent — the same work item can be attempted more than once.","A CronJob only creates Job objects on a schedule; everything after that is Job mechanics. concurrencyPolicy (Allow, Forbid, Replace) governs overlap when a run outlives its interval, and startingDeadlineSeconds bounds how late a missed run may start — if the controller was down past that deadline, the run is skipped and counted as missed, a classic 'why didn't my 2am job run' incident.","Deployment .spec.paused lets you make several template edits without triggering a rollout per edit: pause, apply changes, resume — one rollout, one revision. Combined with minReadySeconds (a pod must stay Ready this long before counting as available), you can force rollouts to advance slowly enough to catch crash-after-start bugs before the old ReplicaSet is fully drained."],"trap":"When asked to compare Deployment vs StatefulSet, the trap is saying 'StatefulSet is for apps with storage' — a Deployment pod can mount a PVC too; StatefulSet's real differentiators are stable per-replica identity (name/DNS), one PVC per replica from templates, and ordered rollout, none of which a Deployment can express.","wire":"$ kubectl rollout status deployment/web\\nWaiting for deployment \\"web\\" rollout to finish: 3 out of 10 new replicas have been updated...\\n\\n$ kubectl get rs -l app=web\\nNAME             DESIRED   CURRENT   READY   AGE\\nweb-75675f5897   8         8         8       2d    # old template\\nweb-869b4f7d6c   3         3         0       4m    # new, stuck: 0 READY\\n\\n$ kubectl get deploy web -o jsonpath='{.status.conditions[?(@.type==\\"Progressing\\")].reason}'\\nProgressDeadlineExceeded\\n\\n$ kubectl rollout undo deployment/web\\ndeployment.apps/web rolled back"},{"key":"scheduling","cat":"host","icon":"gauge","t":"Scheduling, Resources & Placement","s":"Requests vs limits, affinity, taints/tolerations, spread, and preemption","quick":["Scheduler places by requests only; limits are enforced later by the kernel","CPU over limit = throttled; memory over limit = OOMKilled (exit 137)","Taints repel at the node; affinity attracts from the pod"],"methods":["resources.requests / resources.limits","kubectl taint nodes node1 key=value:NoSchedule","affinity.nodeAffinity / podAffinity / podAntiAffinity + topologyKey","topologySpreadConstraints (maxSkew, whenUnsatisfiable)","priorityClassName","kubectl describe pod <name>   # Events: FailedScheduling reasons"],"intro":["Scheduling is the matchmaking step: kube-scheduler watches for pods with no nodeName, filters out nodes that can't host them (not enough unreserved resources, untolerated taints, failed affinity), scores the survivors, and binds the pod to the winner. After binding, the scheduler is done — everything else (starting containers, enforcing limits) is the kubelet's and the kernel's job.","Two separate vocabularies control placement. Resource requests/limits are about capacity: requests reserve room on a node, limits cap what the container may actually use. Affinity, taints, and spread constraints are about location: which nodes are allowed, preferred, forbidden, and how replicas should be distributed across failure domains.","Mental model: requests are a restaurant reservation (the table is held whether you eat or not), limits are the all-you-can-eat ceiling enforced at the buffet. Taints are 'staff only' signs a node hangs on its own door; tolerations are the badge a pod carries to walk past the sign — but the badge alone doesn't steer the pod there, which is why dedicated nodes need taints AND affinity together."],"facts":["The scheduler only ever looks at requests, never limits and never live usage: a node qualifies if the sum of all scheduled pods' requests plus the new pod's requests fits within the node's allocatable. This means a node whose pods request little but consume a lot still looks 'free' to the scheduler and will keep receiving pods — the root cause of overcommitted nodes OOM-killing workloads while kubectl top shows other nodes idle.","CPU and memory limits fail in opposite ways because of how the kernel enforces them. A CPU limit becomes a CFS quota: a container over its limit is throttled — paused in scheduler timeslices — so it gets slow (latency spikes) but never killed. A memory limit becomes a cgroup memory cap: allocating past it triggers the kernel OOM killer, which kills the process — the container exits with code 137 and reason OOMKilled, and the kubelet restarts it per restartPolicy.","nodeAffinity's two flavors differ in enforcement, not syntax: requiredDuringSchedulingIgnoredDuringExecution is a hard filter (no matching node means the pod stays Pending forever), while preferredDuringSchedulingIgnoredDuringExecution just adds weight (1-100) to matching nodes' scores and schedules elsewhere if needed. Both are 'IgnoredDuringExecution': if a node's labels change after placement, already-running pods are not evicted. Inside the rules, multiple nodeSelectorTerms are ORed while matchExpressions within one term are ANDed — inverting these is a classic YAML bug.","podAntiAffinity spreads pods relative to other pods, and topologyKey defines the blast radius of 'apart': topology.kubernetes.io/hostname means never two on the same node, topology.kubernetes.io/zone means never two in the same zone. A required anti-affinity on hostname for a 4-replica Deployment on a 3-node cluster leaves replica 4 Pending forever — nothing is 'wrong', the constraint is simply unsatisfiable, which is why preferred anti-affinity or topology spread is usually safer for spreading.","Taint effects escalate: NoSchedule blocks new placements but leaves running pods alone; PreferNoSchedule is only a scheduling preference; NoExecute additionally evicts already-running pods that lack a matching toleration, optionally after tolerationSeconds. Kubernetes itself relies on this: when a node stops heartbeating, the node controller adds node.kubernetes.io/unreachable:NoExecute, and because pods get a default toleration of 300s for it, workloads are auto-evicted from a dead node after 5 minutes — the mechanism behind 'my pods moved after the node died'.","topologySpreadConstraints even out replicas across domains: maxSkew is the maximum allowed difference in matching-pod counts between any two domains under the given topologyKey, and whenUnsatisfiable chooses between DoNotSchedule (hard: pod goes Pending) and ScheduleAnyway (soft: skew minimized as a score). With maxSkew: 1 across zones, a 6-replica app lands 2-2-2 across three zones — the modern replacement for hand-rolled zone anti-affinity."],"more":["Preemption: when a pod with a higher PriorityClass can't schedule, the scheduler may evict lower-priority pods from a node to make room — the victims get graceful termination, and the field nominatedNodeName marks where the pod expects to land. preemptionPolicy: Never creates high-priority-but-polite pods that jump the queue without evicting anyone. Unset priority is 0, so any positive PriorityClass can in principle preempt your default workloads.","requests without limits vs limits without requests behave asymmetrically: if you set only limits, requests default to equal the limits (instant Guaranteed QoS, often over-reserving); if you set only requests, usage can burst to the node's capacity. Best current practice widely cited: always set memory requests=limits (OOM is unrecoverable), set CPU requests but consider omitting CPU limits to avoid needless throttling.","nodeName set directly in the pod spec bypasses the scheduler entirely — no resource check, no affinity, no NoSchedule taint check — and hands the pod straight to that node's kubelet, which will still reject it if resources are exhausted. NoExecute taints still apply and will evict it. This is how the scheduler itself binds pods, and why 'why does my pod ignore taints' is often 'because something set nodeName'.","The unschedulable pod is a top interview scenario: kubectl describe shows an Event like '0/5 nodes are available: 3 Insufficient cpu, 2 node(s) had untolerated taint {dedicated: gpu}'. Read it literally — every node fell to a named filter. Fixes map one-to-one: lower requests or add nodes for Insufficient cpu; add a toleration or remove the taint for taint failures; fix labels for affinity failures.","kubectl cordon only marks a node unschedulable (it applies the node.kubernetes.io/unschedulable:NoSchedule taint — running pods stay), while kubectl drain cordons AND evicts pods honoring PodDisruptionBudgets and gracefully terminating them. Drain refuses to delete DaemonSet pods (they'd be recreated instantly) without --ignore-daemonsets — a distinction interviewers love.","Dedicated node pools need the pair, not either alone: the taint (dedicated=team-a:NoSchedule) keeps everyone else's pods off the nodes, and nodeAffinity/nodeSelector on team-a's pods keeps them off everyone else's nodes. A toleration only unlocks the door — it never pulls the pod through it, so tolerated pods without affinity may still schedule onto general nodes."],"trap":"The classic trap is 'what happens when a container exceeds its CPU limit?' — the tempting answer 'it gets killed' is wrong: CPU is compressible so the kernel throttles it; only exceeding the memory limit gets a container OOMKilled.","wire":"apiVersion: v1\\nkind: Pod\\nmetadata:\\n  name: worker\\nspec:\\n  priorityClassName: high-priority\\n  tolerations:\\n  - key: \\"dedicated\\"\\n    operator: \\"Equal\\"\\n    value: \\"batch\\"\\n    effect: \\"NoSchedule\\"\\n  affinity:\\n    nodeAffinity:\\n      requiredDuringSchedulingIgnoredDuringExecution:\\n        nodeSelectorTerms:\\n        - matchExpressions:\\n          - {key: dedicated, operator: In, values: [\\"batch\\"]}\\n  containers:\\n  - name: worker\\n    image: worker:2.1\\n    resources:\\n      requests: {cpu: \\"500m\\", memory: \\"512Mi\\"}\\n      limits:   {cpu: \\"1\\",    memory: \\"512Mi\\"}   # mem req=limit: no OOM surprises"},{"key":"config","cat":"host","icon":"filetext","t":"ConfigMaps & Secrets","s":"Env vs volume consumption, update propagation, immutability, and real secrecy","quick":["Env vars freeze at container start; mounted volumes refresh in place","base64 in a Secret is encoding, not encryption — etcd needs encryption at rest","subPath mounts and immutable objects never get live updates"],"methods":["kubectl create configmap app-cfg --from-file=config.yaml","kubectl create secret generic db-cred --from-literal=password=...","envFrom / valueFrom.configMapKeyRef / valueFrom.secretKeyRef","volumes[].configMap / volumes[].secret + volumeMounts","immutable: true","kubectl get secret db-cred -o jsonpath='{.data.password}' | base64 -d"],"intro":["ConfigMaps and Secrets exist to pull configuration out of container images so the same image runs unchanged in dev, staging, and prod. A ConfigMap holds non-confidential key-value data (up to 1MiB); a Secret has the same shape but is intended for credentials and gets extra handling — tmpfs storage on nodes, optional encryption at rest, and tighter RBAC conventions.","The decision that actually matters day-to-day is HOW a pod consumes them: injected as environment variables, or mounted as files in a volume. That choice silently determines whether config changes ever reach a running pod, whether values leak into 'kubectl describe' and process listings, and whether your app can hot-reload.","Mental model: env-var injection is printing the config onto the container's birth certificate — fixed at creation, readable by anyone who can inspect the process. Volume mounting is pinning the config to a corkboard in the pod — the kubelet quietly swaps the pinned pages when the source changes, and the app can re-read them whenever it likes."],"facts":["Environment variables from a ConfigMap or Secret are resolved exactly once, when the container is created — updating the object afterward changes nothing in running pods, and only a pod restart (e.g. kubectl rollout restart) picks up new values. Volume-mounted keys, by contrast, are refreshed in place by the kubelet: total lag is the kubelet sync period plus its cache propagation delay (with the default 'Watch' detection strategy this is near-immediate; TTL-based caching adds up to the TTL). This asymmetry is the single most-tested ConfigMap fact in interviews.","The kubelet performs volume updates atomically via symlinks: the mounted directory's files are actually symlinks through a ..data link to a timestamped hidden directory, and an update writes the new content to a fresh directory then swaps the one symlink. An application therefore never reads a half-written config file — but an application that resolved the real path once at startup (or anything mounted via subPath, which copies rather than symlinks) will never see the update at all.","A Secret's data: field is base64-encoded purely so arbitrary bytes survive JSON transport — it is encoding, not encryption, and anyone with get access on the Secret decodes it with one 'base64 -d'. By default Secrets also sit in etcd as plaintext (base64 is transparent), so real protection requires enabling encryption at rest via an EncryptionConfiguration with a KMS provider on the API server, plus RBAC that treats 'get secrets' as a privileged verb.","On worker nodes, volume-mounted Secrets are written to a tmpfs (RAM-backed) filesystem, never to disk, and only on nodes actually running a pod that mounts them; the kubelet fetches a Secret only when a pod needs it and purges it when the pod goes away. Env-var-consumed secrets lose part of this benefit: the values end up in the process environment where they can leak via /proc/<pid>/environ, crash dumps, or frameworks that print environments on startup.","immutable: true on a ConfigMap or Secret does two things: the API server rejects any further data changes (you must delete and recreate to change it), and the kubelet stops opening a watch for it — in clusters with tens of thousands of pods this removes massive watch load from the API server. The standard pattern is versioned names (app-config-v42) plus a Deployment template reference change, which conveniently also gives you rollout-based config deploys and rollback.","Referencing a ConfigMap or Secret key that doesn't exist fails differently per mode: a required env-var reference (valueFrom without optional: true) blocks the container from starting with CreateContainerConfigError, while a missing volume-referenced object keeps the whole pod stuck in ContainerCreating with mount errors in Events. Both are top 'my pod won't start' scenarios where kubectl describe pod names the missing object explicitly."],"more":["Changing a ConfigMap does NOT restart or roll pods — Kubernetes has no built-in 'config changed, redeploy' link. Teams close the loop either by hashing the config into a pod-template annotation (checksum/config in Helm) so every config change alters the template and triggers a normal rolling update, or by running an operator like Reloader/Stakater that watches ConfigMaps and patches Deployments.","Secret types (Opaque, kubernetes.io/tls, kubernetes.io/dockerconfigjson, kubernetes.io/basic-auth, kubernetes.io/ssh-auth, kubernetes.io/service-account-token) are mostly validation contracts: kubernetes.io/tls must carry tls.crt and tls.key, dockerconfigjson must hold a valid .dockercfg JSON. Consumers key off them too — Ingress controllers demand type kubernetes.io/tls, and imagePullSecrets on a pod (or on its ServiceAccount, which auto-attaches them) must be dockerconfigjson secrets.","Namespace scoping is absolute: a pod can only reference ConfigMaps and Secrets in its own namespace, so 'shared' config must be copied per-namespace or synced by tooling. Static pods can't reference ConfigMaps or Secrets at all — the kubelet reads their manifests from disk before it can talk to the API server, which is precisely why control-plane components take flags and hostPath files instead.","RBAC nuance: granting 'list' or 'watch' on secrets is effectively granting 'get' on every secret in scope, since list returns full objects including data. Least-privilege secret access therefore means verb get plus resourceNames pinning specific secrets — and remember that anyone who can create pods in a namespace can mount any secret in that namespace, making pod-create rights secret-read rights in disguise.","Size and scale: both objects are capped at ~1MiB (etcd object limit), and every pod consuming them adds kubelet watch/cache load. Large blobs (ML models, big CA bundles) belong in volumes or object storage, not ConfigMaps; many small immutable objects scale far better than one giant mutable one.","Production-grade secret management usually pushes the source of truth outside the cluster: External Secrets Operator or CSI Secret Store drivers sync from Vault/AWS Secrets Manager/GCP Secret Manager into Kubernetes Secrets (or straight into pod volumes), giving rotation, audit, and central revocation that raw Kubernetes Secrets lack. In interviews, name this as the answer to 'how do you handle secrets properly in production'."],"trap":"The trap question is 'your app didn't pick up the ConfigMap change — why?': the expected diagnosis is env-var consumption (frozen at container start) or a subPath mount (never updated), not 'Kubernetes is slow to sync'.","wire":"apiVersion: v1\\nkind: Pod\\nmetadata:\\n  name: app\\nspec:\\n  containers:\\n  - name: app\\n    image: myapp:1.4\\n    env:\\n    - name: DB_PASSWORD               # frozen at container start\\n      valueFrom:\\n        secretKeyRef: {name: db-cred, key: password}\\n    envFrom:\\n    - configMapRef: {name: app-flags}\\n    volumeMounts:\\n    - name: cfg\\n      mountPath: /etc/app             # live-updating files\\n      readOnly: true\\n  volumes:\\n  - name: cfg\\n    configMap:\\n      name: app-config                # keys become files under /etc/app"},{"key":"controlplane","cat":"host","icon":"home","t":"Control Plane & Node Components","s":"api-server, etcd quorum, scheduler, controllers, kubelet — and what breaks when each dies","quick":["Everything reads/writes state through the api-server; only it talks to etcd","etcd needs majority quorum — 3 nodes tolerate 1 loss, 5 tolerate 2","Control plane down ≠ workloads down: running pods keep serving"],"methods":["kubectl get componentstatuses  (deprecated but asked)","kubectl get --raw /healthz | /readyz | /livez","kubectl get events -A --sort-by=.lastTimestamp","etcdctl endpoint status --cluster -w table","systemctl status kubelet / journalctl -u kubelet","crictl ps  (node-level container runtime view)"],"intro":["A Kubernetes cluster is a control plane that decides, plus nodes that do. The control plane is the kube-apiserver (the single front door for every read and write), etcd (the only database, a Raft-consensus key-value store), the kube-scheduler (assigns pending pods to nodes), and the kube-controller-manager (dozens of reconciliation loops driving actual state toward desired state). On every node run the kubelet (starts and health-checks containers for pods bound to its node), a container runtime like containerd, and kube-proxy (programs Service routing rules).","The architecture is hub-and-spoke with the api-server as the hub: the scheduler, controllers, and kubelets never talk to each other or to etcd directly — they all watch and write through the api-server. This is why 'what happens if X dies' has such clean answers: each component's absence removes exactly one verb from the cluster.","Mental model: etcd is the ledger, the api-server is the only clerk allowed to touch the ledger, controllers are back-office staff constantly comparing the ledger to reality and filing corrections, the scheduler is the dispatcher assigning new work to branches, and kubelets are branch managers who only follow what's written in the ledger about their own branch."],"facts":["The kube-apiserver is the sole component with an etcd connection: it authenticates, authorizes (RBAC), runs admission controllers, validates, and persists every object, and everyone else consumes state via its watch API. When it's down, the data plane keeps running — kubelets keep restarting crashed containers locally and kube-proxy's existing rules keep routing Service traffic — but nothing can change: no kubectl, no new pods, no scaling, no rescheduling. The cluster is a plane on autopilot with the cockpit locked.","etcd is a Raft cluster that requires a strict majority (quorum) of members to commit writes: 3 members tolerate 1 failure, 5 tolerate 2, and an even count adds no fault tolerance (4 nodes still only tolerate 1 loss, since 2/4 is not a majority). Lose quorum and etcd refuses all writes and consistent reads — the api-server starts erroring, controllers can't record anything, and the whole cluster freezes in its last committed state until a majority returns; this is why control planes are 3 or 5 nodes, never 2 or 4.","kube-scheduler only does placement: it watches for pods with an empty nodeName, filters nodes (resources, taints, affinity), scores the rest, and writes a Binding. With the scheduler down, everything already placed runs untouched — but every new pod (from a rollout, a scale-up, an eviction replacement) piles up in Pending with no scheduling Events. That signature, 'new pods Pending, zero FailedScheduling events, old pods fine', points at the scheduler itself.","kube-controller-manager hosts the reconciliation loops — node, deployment, replicaset, endpoints, job, serviceaccount-token controllers and more — each doing watch-diff-act toward desired state. When it's down, Kubernetes loses its self-healing: delete a Deployment's pod and no replacement appears (the ReplicaSet controller isn't looking), a dead node's pods are never evicted (node controller absent), new ServiceAccounts don't get tokens, and endpoints stop tracking pod churn. The API accepts your wishes; nothing acts on them.","The kubelet is each node's agent: it watches the api-server for pods bound to its node, drives the container runtime through CRI to run them, executes liveness/readiness/startup probes, mounts volumes, and posts node heartbeats (Leases) and pod status. If a node's kubelet stops heartbeating, the node controller marks the node NotReady after ~40s and adds node.kubernetes.io/unreachable:NoExecute; after the default 300s toleration expires, controllers create replacement pods elsewhere — while the original containers may STILL be running on the cut-off node, which is why stateful systems fear split-brain during partitions.","kube-proxy programs each node's kernel (iptables or IPVS) so that traffic to a Service's ClusterIP is DNAT'd to a ready backend pod IP — no proxy process sits in the data path in these modes. If kube-proxy dies, existing rules keep working (traffic still flows to old backends), but the node's rules go stale as endpoints churn: new pods never get traffic, deleted pods keep receiving connections that now time out — an eerie 'some nodes route correctly, some don't' failure mode."],"more":["Bootstrapping chicken-and-egg: kubeadm runs the control plane AS static pods — the kubelet reads manifests from /etc/kubernetes/manifests on disk and starts api-server, etcd, scheduler, and controller-manager before any API exists, then registers mirror pods for visibility. This is why 'kubelet is the only component that must run as a system service' is a valid interview point, and why deleting a control-plane mirror pod via kubectl does nothing.","Scheduler and controller-manager run active-passive via leader election (a Lease object in kube-system): in an HA control plane only one instance of each is acting, the rest hot-standby. Two schedulers acting at once would double-bind pods, so if you're asked 'does running 3 controller-managers triple throughput' the answer is no — it only removes a single point of failure.","etcd operational care is an interview staple: it is latency-sensitive (fsync on every commit — slow disks destroy cluster performance), should stay under ~8GB, needs periodic compaction/defragmentation, and 'etcdctl snapshot save' is THE cluster backup — restoring etcd restores every object. Losing etcd data without a snapshot means rebuilding the cluster's entire declared state.","cloud-controller-manager splits cloud-vendor logic out of the core: node controller (verifying deleted cloud instances), route controller, and service controller (provisioning cloud load balancers for type: LoadBalancer). If it's broken, Services of type LoadBalancer hang with EXTERNAL-IP <pending> forever — a tidy scenario question tying components to symptoms.","The full pod-creation path is the canonical 'explain the architecture' answer: kubectl POSTs to api-server → authn/authz/admission → object persisted to etcd → scheduler (watching) picks a node and writes the binding → the node's kubelet (watching) sees the assignment → kubelet calls the runtime via CRI to pull images and start containers → kubelet reports status back → endpoints controller adds the ready pod to EndpointSlices → kube-proxy on every node updates kernel rules. Every arrow passes through the api-server.","CoreDNS is an addon Deployment, not a control-plane binary, yet its failure mimics total outage: pods resolve Services via DNS (my-svc.my-ns.svc.cluster.local), so CoreDNS down means new connections by name fail cluster-wide while connections by raw ClusterIP still work — a discriminating test ('curl the IP works, curl the name fails') interviewers reward."],"trap":"'If the control plane goes down, do running applications stop?' — the trap answer is yes; in reality running pods keep serving because kubelets and existing kube-proxy rules operate autonomously, and only changes (deploys, scaling, failover, rescheduling) stop.","wire":"$ kubectl get nodes\\nNAME     STATUS     ROLES           AGE   VERSION\\ncp-1     Ready      control-plane   90d   v1.31.2\\nnode-1   Ready      <none>          90d   v1.31.2\\nnode-2   NotReady   <none>          90d   v1.31.2   # kubelet stopped heartbeating\\n\\n$ kubectl describe node node-2 | grep -A2 Taints\\nTaints: node.kubernetes.io/unreachable:NoExecute\\n        node.kubernetes.io/unreachable:NoSchedule\\n\\n$ etcdctl endpoint status --cluster -w table\\n+------------------+--------+---------+-----------+\\n|     ENDPOINT     | LEADER | DB SIZE | RAFT TERM |\\n+------------------+--------+---------+-----------+\\n| 10.0.0.11:2379   | true   |  61 MB  |     42    |\\n| 10.0.0.12:2379   | false  |  61 MB  |     42    |\\n| 10.0.0.13:2379   | false  |  61 MB  |     42    |  # 3 members: quorum=2\\n+------------------+--------+---------+-----------+"},{"key":"rbac","cat":"server","icon":"shield","t":"RBAC & ServiceAccounts","s":"Roles, bindings, projected tokens, auth can-i, and decoding 403s","quick":["RBAC is allow-only and additive — there is no deny rule","RoleBinding + ClusterRole = that ClusterRole's powers in ONE namespace","Pods authenticate as system:serviceaccount:<ns>:<name> via projected tokens"],"methods":["kubectl auth can-i create deployments --as=jane -n dev","kubectl auth can-i list secrets --as=system:serviceaccount:dev:app-sa","kubectl create role / clusterrole / rolebinding / clusterrolebinding","kubectl describe rolebinding -n <ns> / clusterrolebinding","kubectl auth whoami","roleRef (immutable) / aggregationRule"],"intro":["RBAC answers exactly one question on every API request: is this identity allowed to perform this verb on this resource? Permissions are defined in Roles (namespaced) and ClusterRoles (cluster-wide), and handed to identities via RoleBindings and ClusterRoleBindings. There are no deny rules — everything is forbidden until some binding allows it, and multiple bindings simply union together.","Identities come in three kinds: Users and Groups (which Kubernetes does not store — they arrive from certificates or OIDC tokens and exist only as strings), and ServiceAccounts, which ARE API objects and are how pods authenticate. Every pod runs as some ServiceAccount ('default' unless specified) and receives a projected, auto-rotated token to call the API with.","Mental model: a Role is a laminated permission card ('may read pods, may create configmaps'), and a binding is taping that card to a person's badge. A ClusterRole is the same card printed at headquarters: taped on with a ClusterRoleBinding it works in every building; taped on with a namespaced RoleBinding it works only inside that one building — the card's grand title doesn't change where the tape is."],"facts":["The four-object matrix collapses to one rule: the BINDING's scope wins. A Role + RoleBinding grants inside one namespace; a ClusterRole + ClusterRoleBinding grants everywhere; and the interview favorite, a ClusterRole referenced by a namespaced RoleBinding, grants that ClusterRole's rules only within the binding's namespace. That third pattern is the standard way to define a permission set once (e.g. the built-in 'view' ClusterRole) and dole it out namespace by namespace without duplicating Roles.","roleRef is immutable after creation: you cannot repoint an existing binding at a different Role or ClusterRole — you must delete and recreate the binding. This is deliberate: since a binding grants all of its roleRef's permissions to its subjects, silently swapping the roleRef would let someone repurpose an existing grant; 'kubectl auth reconcile' handles the delete-and-recreate dance automatically when applying RBAC manifests.","A pod's API identity is system:serviceaccount:<namespace>:<name>, delivered as a projected token at /var/run/secrets/kubernetes.io/serviceaccount/token. Modern tokens come from the TokenRequest API, not stored Secrets: they are audience-bound, pod-bound (invalid once the pod dies), time-limited (~1h, kubelet auto-refreshes the file), unlike legacy service-account-token Secrets which never expired and sat readable in etcd — a security-evolution story interviewers like told. Apps must re-read the token file rather than caching it forever.","kubectl auth can-i is the RBAC debugger: 'kubectl auth can-i list secrets -n prod --as=system:serviceaccount:prod:app-sa' answers yes/no by running a real SelfSubjectAccessReview under impersonation, and 'kubectl auth can-i --list -n prod' dumps everything an identity may do there. Impersonation (--as, --as-group) itself requires the 'impersonate' verb, so admins can debug any identity's view without borrowing its credentials.","RBAC blocks privilege escalation structurally: you can only create or update a Role/ClusterRole containing permissions you already hold, and only create a binding to a role whose permissions you already hold — unless you've been granted the special verbs 'escalate' (may write roles beyond your own power) or 'bind' (may bind roles beyond your own power). Without this, anyone with rolebinding-create rights could self-grant cluster-admin in two commands.","Aggregated ClusterRoles assemble themselves: a ClusterRole with an aggregationRule has its rules list continuously rebuilt by a controller as the union of every ClusterRole matching the label selector. The built-in admin/edit/view roles work this way — ship a CRD with a ClusterRole labeled rbac.authorization.k8s.io/aggregate-to-view: \\"true\\" and every 'view' user can instantly read your new custom resource, with no edits to the default roles."],"more":["Decoding a 403: the error names identity, verb, resource, API group, and namespace — 'User system:serviceaccount:dev:app-sa cannot list resource \\\\\\"deployments\\\\\\" in API group \\\\\\"apps\\\\\\" in the namespace \\\\\\"prod\\\\\\"'. Check in order: is there a binding for that subject in THAT namespace (RoleBindings don't cross namespaces); does the rule's apiGroups include the right group ('' for core pods/services, 'apps' for deployments — the most common typo); does the verb list include what's needed (list is not get); do resourceNames restrict it away.","401 vs 403 is a screening question: 401 Unauthorized means authentication failed (bad/expired certificate or token — identity unknown), 403 Forbidden means authentication succeeded and RBAC denied the action. An expired kubeconfig cert gives 401s on everything; a missing binding gives 403s on specific verbs; conflating them sends you debugging the wrong layer.","Default ClusterRoles form a ladder to reuse, not reinvent: view (read-only, excludes secrets... mostly reads), edit (read/write most namespaced resources but cannot touch Roles/RoleBindings), admin (edit plus RBAC management within the namespace), cluster-admin (superuser, usually bound to the system:masters group). Interview red flags to volunteer: binding cluster-admin to workload ServiceAccounts, and remembering that 'edit' can read secrets in-namespace.","Granting pod-create is granting secret-read: a subject who can create pods in a namespace can mount any secret there into their pod, and one who can create pods with a chosen serviceAccountName (plus 'create serviceaccounts/token' or exec rights) can act as that SA. RBAC on secrets alone is therefore porous unless pod-creation rights are equally controlled — the kind of second-order reasoning that separates senior answers.","ServiceAccount hygiene: every namespace gets a 'default' SA with no permissions, and since automountServiceAccountToken defaults to true, every pod carries an API token it usually never needs. Hardening baseline: set automountServiceAccountToken: false on the SA or pod for workloads that don't call the API, and create one dedicated SA per workload that does, so RBAC grants map one-to-one to applications.","RBAC is one authorizer in a chain (Node, RBAC, webhook authorizers...): a request allowed by ANY authorizer proceeds, which is why kubelets are governed by the Node authorizer rather than RBAC bindings. Also remember RBAC gates the API only — it says nothing about what a process may do on the node; that's the domain of SecurityContext, Pod Security Admission, and Linux privileges."],"trap":"The trap is 'to give someone cluster-wide read access you need a ClusterRole' — half-true in reverse: a ClusterRole alone proves nothing, because bound via a RoleBinding it grants only that one namespace; the binding type, not the role type, decides the scope.","wire":"# Reusable ClusterRole, granted in ONE namespace via RoleBinding\\napiVersion: rbac.authorization.k8s.io/v1\\nkind: RoleBinding\\nmetadata:\\n  name: app-sa-view\\n  namespace: dev\\nsubjects:\\n- kind: ServiceAccount\\n  name: app-sa\\n  namespace: dev\\nroleRef:                          # immutable after creation\\n  kind: ClusterRole\\n  name: view\\n  apiGroup: rbac.authorization.k8s.io\\n\\n# $ kubectl auth can-i list pods -n dev --as=system:serviceaccount:dev:app-sa\\n# yes\\n# $ kubectl auth can-i list pods -n prod --as=system:serviceaccount:dev:app-sa\\n# no   <- RoleBinding scope stops at the namespace"},{"key":"operators","cat":"server","icon":"puzzle","t":"CRDs, Controllers & Operators","s":"Extending the API, the reconcile loop, status vs spec, finalizers","quick":["A CRD teaches the api-server a new resource type — no new server needed","Controllers reconcile: observe actual state, drive it toward spec","Operator = CRD(s) + controller encoding a human operator's runbook"],"methods":["kubectl get crds","kubectl api-resources | grep <group>","kubectl describe <kind> <name>   # status + events from the controller","kubectl get <kind> <name> -o yaml   # spec vs status, finalizers","kubectl edit <kind>/<name> then watch the controller react","metadata.finalizers / status subresource"],"intro":["A CustomResourceDefinition (CRD) registers a brand-new resource type with the api-server — say kind: PostgresCluster — after which the API instantly serves full CRUD for it: kubectl get postgresclusters works, objects validate against your OpenAPI schema, persist in etcd, and honor RBAC and audit, all without writing a line of server code. But a CRD alone is a database table with no application: creating a PostgresCluster object stores your wish and changes nothing in the world.","A controller supplies the behavior: a program (usually just a Deployment in the cluster) that watches those objects and continuously reconciles reality to match their spec — creating StatefulSets, Services, Secrets, whatever the custom resource implies. The pairing of CRDs plus a controller that encodes real operational knowledge (provisioning, failover, backups, upgrades) is the operator pattern: automation shaped like a human operator.","Mental model: Kubernetes is a thermostat factory. A CRD defines a new kind of thermostat dial (the spec you can set); the controller is the HVAC machinery that notices the dial and heats or cools until the room matches. Deployment and ReplicaSet controllers are just the built-in thermostats — operators let you install your own for anything."],"facts":["Reconciliation is level-triggered, not edge-triggered: a reconcile reads the object's CURRENT spec, compares it against the world, and converges — it does not process a diff or an event log. Mechanically this makes controllers self-healing: a missed watch event, a controller restart, or five rapid edits all collapse into 'next reconcile sees the latest state and fixes everything', which is why controllers can crash at any point and simply resume. Interviewers probing 'what if the controller misses an event?' want exactly this answer.","Controllers don't poll the API in a loop — they use informers: a client-side watch plus in-memory cache that receives change notifications from the api-server and enqueues object keys onto a workqueue that worker goroutines reconcile. The queue deduplicates (ten edits to one object become one pending reconcile) and retries failures with exponential backoff, which is how a single controller pod tracks thousands of objects without hammering the api-server.","The spec/status split is a write-ownership contract: users and tools write .spec (desired state), only the controller writes .status (observed state), and enabling the status subresource makes the API enforce it — updates to /status can't touch spec and vice versa, each with independent RBAC. So 'kubectl get mydb -o yaml' showing spec.replicas: 3 but status.readyReplicas: 1 tells you precisely what was asked versus what the controller has achieved, plus (by convention) status.conditions explaining why.","Finalizers make deletion cooperative: while metadata.finalizers is non-empty, a delete only sets deletionTimestamp and the object persists in a Terminating state; the controller sees the timestamp, performs external cleanup (deprovision the cloud database, release the DNS record), then removes its finalizer, and only when the list is empty does the API actually delete. This is also THE cause of 'my namespace/CR is stuck Terminating': some controller that should remove its finalizer is dead or erroring, and the object waits forever.","Deleting a CRD deletes every instance of that custom resource cluster-wide — uninstalling an operator's CRDs can wipe all the PostgresCluster objects (and, via the operator's own cleanup, potentially the databases) in one command, which is why Helm deliberately leaves CRDs behind on uninstall. Conversely, the controller being down never loses data: CRs live in etcd like any object; they just stop being acted upon until the controller returns.","A CRD can serve multiple versions (v1alpha1, v1beta1, v1) at once, with exactly one marked storage: true as the etcd format and a conversion webhook translating between served versions on the fly. Structural OpenAPI schemas give server-side validation and defaulting, and CEL validation rules (x-kubernetes-validations) can enforce cross-field invariants like 'maxReplicas >= minReplicas' at admission time — no webhook required."],"more":["Owner references are the glue for cascade cleanup: when an operator creates a StatefulSet for your PostgresCluster, it sets ownerReferences pointing at the CR, so garbage collection deletes children when the parent goes — finalizers are only needed for cleanup OUTSIDE the cluster (cloud resources, external DNS) that GC can't see. Distinguishing 'ownerRefs for in-cluster children, finalizers for external side effects' is a strong senior signal.","'Why an operator instead of Helm?' has a crisp answer: Helm templates and installs once (day-1); an operator keeps reconciling forever (day-2) — it heals drift, orchestrates version upgrades step by step, manages failover and backups continuously. If a human would need to babysit the system after install, that runbook is what the operator encodes; for stateless install-and-forget apps, a chart is enough and an operator is overengineering.","Reconcilers must be idempotent and conflict-tolerant: level-triggering guarantees the same state will be reconciled repeatedly, so every action must be safe to repeat (create-if-absent, patch-to-desired), and writes race other actors — optimistic concurrency via resourceVersion makes stale updates fail with a 409 Conflict, which the workqueue simply retries against fresher state. 'How do two controllers avoid fighting?' is answered by resourceVersion + retry, not locks.","CRDs versus aggregated API servers: CRDs cover almost everything (storage in the main etcd, schema validation, subresources, webhooks) with zero server code; aggregation registers an APIService that proxies a URL prefix to your own server, buying custom storage backends and arbitrary REST semantics at the cost of running and securing another api-server. The interview answer: 'CRDs unless you need custom storage or non-CRUD endpoints — aggregation is how metrics-server serves the metrics.k8s.io API'.","Ecosystem literacy checks: controller-runtime (used by Kubebuilder and Operator SDK) is the standard Go framework wrapping informers, caches, and workqueues so you mostly write the Reconcile function; kubectl get crds and kubectl api-resources reveal what's installed; flagship examples worth citing are Prometheus Operator, cert-manager (Certificate CRDs), and database operators like CloudNativePG — evidence you've met operators in production, not just docs.","Debugging a misbehaving operator follows one path: read the CR's status.conditions and 'kubectl describe' events (well-built controllers emit both), then the controller pod's logs (it's just a Deployment, typically in its own namespace), then verify the operator's RBAC — a controller that can't list its secondary resources fails with 403s visible in its logs, and 'kubectl auth can-i --as=system:serviceaccount:<ns>:<operator-sa>' confirms it."],"trap":"The trap is treating CRD and operator as synonyms — a CRD is only the schema registration that makes the API store a new object type; without a controller reconciling those objects, creating one does precisely nothing.","wire":"$ kubectl get postgresclusters\\nNAME      REPLICAS   READY   STATUS     AGE\\nmain-db   3          1       Scaling    12m\\n\\n$ kubectl get postgrescluster main-db -o yaml\\napiVersion: db.example.com/v1\\nkind: PostgresCluster\\nmetadata:\\n  name: main-db\\n  finalizers:\\n  - db.example.com/deprovision     # delete waits for controller cleanup\\nspec:                              # desired: written by user\\n  replicas: 3\\n  version: \\"16\\"\\nstatus:                            # observed: written only by controller\\n  readyReplicas: 1\\n  conditions:\\n  - type: Progressing\\n    status: \\"True\\"\\n    reason: CreatingReplica\\n    message: \\"pod main-db-2 waiting for PVC binding\\""},{"key":"services","cat":"client","icon":"plug","t":"Services & kube-proxy","s":"ClusterIP, NodePort, LoadBalancer — and the DNAT machinery underneath","quick":["A Service is a stable virtual IP + DNS name in front of an ever-changing set of pod IPs, selected by labels.","The ClusterIP is not a real interface anywhere — kube-proxy programs iptables/IPVS rules on every node that DNAT traffic to a ready pod IP.","NodePort (30000-32767 on every node) builds on ClusterIP; LoadBalancer builds on NodePort by asking the cloud for an external LB."],"methods":["kubectl get svc -o wide","kubectl get endpointslices -l kubernetes.io/service-name=<svc>","kubectl describe svc <name>","kubectl expose deploy web --port=80 --target-port=8080","iptables-save | grep <cluster-ip>","kubectl get svc <name> -o jsonpath='{.spec.clusterIP}'"],"intro":["Pods are cattle: they die, get rescheduled, and come back with brand-new IP addresses. If your frontend hard-coded a backend pod's IP, it would break on the first rollout. A Service solves this by giving you one stable identity — a virtual IP (ClusterIP) and a DNS name — that fronts whichever pods currently match its label selector. Think of it like a company's main phone number: the receptionists (pods) change shifts constantly, but callers always dial the same number and the switchboard connects them to whoever is on duty right now.","The 'switchboard' is kube-proxy, an agent on every node. It watches the API server for Services and EndpointSlices, then programs Linux kernel rules (iptables by default, or IPVS/nftables) so that any packet addressed to the ClusterIP gets its destination rewritten — DNAT'd — to one of the ready pod IPs before it ever leaves the node. No proxy process sits in the data path; the kernel does the rewrite. That single fact explains most weird Service behavior in interviews.","Service types stack like layers: ClusterIP (in-cluster only) is the base; NodePort opens the same Service on a static port on every node's IP; LoadBalancer asks a cloud controller to provision an external load balancer that forwards to those NodePorts; ExternalName is the odd one out — it is just a DNS CNAME to an outside name, with no proxying at all."],"facts":["ClusterIP is a virtual IP that exists only as iptables/IPVS rules programmed by kube-proxy on every node — no process listens on it anywhere. That's why ping 10.96.4.7 fails while curl 10.96.4.7:80 succeeds: ICMP has no rewrite rule, but a TCP connection gets DNAT'd in the kernel to one of the ready pod IPs before it leaves the node.","A Service doesn't route to pods directly — it routes to whatever its EndpointSlices list, and the endpoint controller only marks an address ready:true when the pod passes its readiness probe. So a Deployment with 3 Running pods but failing readiness probes gives you a Service with zero usable endpoints: kubectl describe svc shows 'Endpoints: <none>' and every request times out or is refused, even though kubectl get pods looks healthy.","port, targetPort, and nodePort are three different hops that candidates constantly conflate. port is what the Service listens on at its ClusterIP (e.g. 80), targetPort is the container port traffic is DNAT'd to (e.g. 8080, and it can be a named port like 'http' so different pods can use different numbers), and nodePort is the 30000-32767 port opened on every node's real IP for NodePort/LoadBalancer types.","In iptables mode, backend selection is random per connection, done once at connection setup, and then conntrack pins the rest of that TCP stream to the same pod so reply packets are un-DNAT'd back to the client correctly. IPVS mode instead uses an in-kernel hash table with real scheduling algorithms (rr, lc, sh...), which scales better than evaluating thousands of sequential iptables rules when you have 5,000+ Services.","sessionAffinity: ClientIP is the only built-in stickiness: kube-proxy uses conntrack to remember which backend a source IP was given, for timeoutSeconds (default 10800, i.e. 3 hours). It breaks behind NAT — if 500 office users share one egress IP, they all stick to a single pod, which is a classic 'one pod is hot, the rest are idle' incident.","A headless Service (clusterIP: None) skips the virtual IP entirely: no kube-proxy rules are programmed, and the cluster DNS returns the individual pod IPs as multiple A records instead of one VIP. StatefulSets rely on this so each replica gets a stable per-pod name like mysql-0.mysql.db.svc.cluster.local, letting clients pick a specific replica (e.g. always write to the primary) rather than being load-balanced blindly."],"more":["externalTrafficPolicy: Local makes nodes without a local backend drop NodePort/LB traffic instead of forwarding it, in exchange for preserving the real client source IP (Cluster mode SNATs, so pods see the node's IP). Cloud LBs pair it with health-check NodePorts so they only send traffic to nodes that actually host a backend pod.","internalTrafficPolicy: Local does the same for in-cluster traffic — useful for DaemonSet-backed services like a node-local logging agent, where you want each pod to talk to the agent on its own node and traffic is dropped if no local endpoint exists (no fallback to other nodes).","EndpointSlices (discovery.k8s.io/v1) replaced monolithic Endpoints objects because a Service with thousands of backends meant re-sending one huge object to every kube-proxy on every single pod change; slices cap at ~100 endpoints each (default) so only the changed slice is transmitted. The legacy Endpoints API is deprecated.","During graceful shutdown a pod's endpoint flips to serving/terminating conditions before it disappears: with externalTrafficPolicy: Local, kube-proxy can still route to terminating-but-serving endpoints if they're the only ones left, smoothing rolling updates behind cloud LBs.","A Service without a selector gets no automatic endpoints — you (or a controller) create the EndpointSlice by hand, labeled kubernetes.io/service-name: <svc>. This is the standard trick to give an in-cluster DNS name to an external database at a fixed IP while keeping the option to migrate it in-cluster later without changing clients.","kube-proxy's iptables mode has been the Linux default for years, but IPVS is deprecated as of v1.35 and nftables mode is the modern successor — worth mentioning in interviews to show you track where the proxy layer is heading."],"trap":"\\"My Service has pods Running but curl to the ClusterIP hangs.\\" The trap is checking pods instead of endpoints. Run kubectl get endpointslices -l kubernetes.io/service-name=<svc>. Empty or ready:false endpoints mean either the selector doesn't match the pod labels (typo: app: web vs app: webapp) or the readiness probe is failing. Also verify targetPort matches the port the container actually listens on — a Service happily DNATs to port 8080 on a pod listening on 3000 and you get connection refused.","wire":"apiVersion: v1\\nkind: Service\\nmetadata:\\n  name: web\\nspec:\\n  type: ClusterIP          # default; NodePort / LoadBalancer stack on top\\n  selector:\\n    app: web               # must match pod labels EXACTLY\\n  sessionAffinity: None    # or ClientIP (conntrack-based, 3h default)\\n  ports:\\n  - name: http\\n    port: 80               # ClusterIP:80  (what clients dial)\\n    targetPort: 8080       # containerPort (where DNAT lands)\\n    protocol: TCP\\n# kubectl get endpointslices -l kubernetes.io/service-name=web\\n# NAME        ADDRESSTYPE   PORTS   ENDPOINTS\\n# web-abc12   IPv4          8080    10.244.1.5,10.244.2.7"},{"key":"dns","cat":"client","icon":"satellite","t":"Cluster DNS (CoreDNS)","s":"Name forms, resolv.conf search magic, ndots:5, and debugging lookups","quick":["Every Service gets a DNS name: <svc>.<namespace>.svc.cluster.local, resolved by CoreDNS pods behind the kube-dns Service.","kubelet writes each pod's /etc/resolv.conf with the cluster nameserver, a 3-entry search list, and options ndots:5.","Headless Services resolve to the set of pod IPs; regular Services resolve to the single ClusterIP."],"methods":["kubectl run dbg --rm -it --image=busybox:1.28 -- nslookup web.prod","kubectl exec -it <pod> -- cat /etc/resolv.conf","kubectl get pods -n kube-system -l k8s-app=kube-dns","kubectl logs -n kube-system -l k8s-app=kube-dns","dig +search web.prod.svc.cluster.local","kubectl get svc kube-dns -n kube-system"],"intro":["Cluster DNS is the phone book that makes Services usable: instead of memorizing that the payments Service lives at 10.96.14.2 today, your code just dials 'payments' and DNS translates it. CoreDNS (a set of pods in kube-system, exposed through the kube-dns ClusterIP Service) watches the API server and synthesizes records for every Service on the fly — nothing is registered manually, the phone book rewrites itself as Services come and go.","The clever part is how short names work. When kubelet starts your pod, it writes /etc/resolv.conf pointing nameserver at the kube-dns ClusterIP and adds a search list: <your-namespace>.svc.cluster.local, then svc.cluster.local, then cluster.local. So a lookup for 'payments' from a pod in namespace shop is silently retried as payments.shop.svc.cluster.local and resolves — like a hotel phone where dialing a 3-digit extension implicitly means 'inside this hotel'. Cross-namespace, you dial payments.billing; fully qualified, payments.billing.svc.cluster.local.","This magic is powered by options ndots:5 — any name with fewer than 5 dots is tried against the search list before being sent upstream as-is. That is great for cluster names and quietly terrible for external ones, which is why it is one of the most-asked DNS gotchas."],"facts":["A normal Service name resolves to exactly one A record — its ClusterIP — no matter how many pods back it, because load balancing happens later in kube-proxy's kernel rules, not in DNS. A headless Service (clusterIP: None) flips this: DNS returns one A record per ready pod IP, so nslookup mysql.db.svc.cluster.local from a debug pod prints 10.244.1.5, 10.244.2.9, 10.244.3.3 and the client does its own selection.","ndots:5 means a lookup for api.stripe.com (2 dots < 5) is first expanded through the whole search list: api.stripe.com.shop.svc.cluster.local, then .svc.cluster.local, then .cluster.local — three guaranteed NXDOMAINs hammering CoreDNS before the real query goes upstream. High-QPS apps fix it by using a trailing dot (api.stripe.com.) or lowering ndots via dnsConfig, and 'why is my external API latency spiky' → ndots is a classic interview answer.","dnsPolicy: ClusterFirst is the default and does what you expect — cluster-suffix names go to CoreDNS, everything else is forwarded upstream. The trap is hostNetwork: true pods: for them ClusterFirst silently degrades to the node's resolv.conf, so Service names stop resolving; you must set dnsPolicy: ClusterFirstWithHostNet to keep cluster DNS. dnsPolicy: None hands you full manual control via the dnsConfig block (nameservers, searches, options).","StatefulSet pods get individually addressable DNS through their governing headless Service: pod hostname + subdomain yields mysql-0.mysql.db.svc.cluster.local, a stable name that survives rescheduling even though the pod IP changes. SRV records also exist for named ports (_http._tcp.web.shop.svc.cluster.local), which is how some service-discovery libraries find both IP and port.","DNS records only include ready pods by default — a headless Service for a pod stuck failing readiness returns no records, which can deadlock bootstrapping clusters (e.g. a database that needs to see its peers' names before it can become ready). publishNotReadyAddresses: true on the Service is the standard escape hatch and is exactly why StatefulSet headless services often set it.","Debugging flow worth reciting: exec into a debug pod (kubectl run dbg --rm -it --image=busybox:1.28 -- sh), cat /etc/resolv.conf to confirm the nameserver is the kube-dns ClusterIP, then nslookup kubernetes.default — if that fails, the problem is CoreDNS or the path to it (CoreDNS pods crashlooping, or a NetworkPolicy eating UDP/TCP 53), not your app. Note busybox:1.28 specifically — later busybox images have a broken nslookup."],"more":["CoreDNS behavior is configured by the Corefile in the coredns ConfigMap (kube-system): the kubernetes plugin serves cluster.local, the forward plugin sends everything else to upstream resolvers, and the cache plugin sets TTLs. Adding a stub domain (e.g. forward corp.internal to on-prem DNS) is a one-line Corefile edit.","NodeLocal DNSCache runs a caching agent as a DaemonSet on every node so pods query a local IP instead of hopping (and conntrack-racing) to CoreDNS across the network — it is the standard mitigation for the notorious 5-second DNS timeouts caused by UDP conntrack races.","ExternalName Services are pure DNS: CoreDNS returns a CNAME to the external name (db.example.com) with no proxying, no endpoints, no ClusterIP. Gotcha: TLS certificate validation still sees the original hostname the client dialed, so cert mismatches are common.","Pods themselves get A records only in specific forms: the IP-based 10-244-1-5.shop.pod.cluster.local form always works, but hostname-based records require spec.hostname + spec.subdomain matching a headless Service — plain pod names are NOT resolvable, a frequent false assumption.","The kube-dns Service name is historical — the Service is still called kube-dns even though the implementation has been CoreDNS since v1.13, and kubelet's --cluster-dns flag is what stamps that ClusterIP into every pod's resolv.conf.","search-list expansion applies per nameserver query and multiplies across IPv4/IPv6 (A+AAAA in parallel), so one getaddrinfo() for a short external name can emit 8+ UDP packets — the arithmetic behind 'DNS is 30% of our cluster traffic' war stories."],"trap":"\\"nslookup web works but nslookup web.prod fails from a pod in prod.\\" Trap: web.prod has one dot, so with ndots:5 it is search-expanded to web.prod.prod.svc.cluster.local (namespace appended twice) which is NXDOMAIN, and depending on the tool the raw name may never be tried against the right suffix. The reliable forms are the bare name inside the same namespace, or the properly qualified web.prod.svc.cluster.local — and when a NetworkPolicy is in play, remember DNS needs egress to kube-system on UDP and TCP 53 or every lookup times out.","wire":"# From a debug pod in namespace 'shop'\\n$ cat /etc/resolv.conf\\nnameserver 10.96.0.10\\nsearch shop.svc.cluster.local svc.cluster.local cluster.local\\noptions ndots:5\\n\\n$ nslookup web            # short name -> expands via search list\\nName:    web.shop.svc.cluster.local\\nAddress: 10.96.44.12      # ClusterIP (one record)\\n\\n$ nslookup mysql.db.svc.cluster.local   # headless service\\nName:    mysql.db.svc.cluster.local\\nAddress: 10.244.1.5       # pod IPs, one record each\\nAddress: 10.244.2.9"},{"key":"ingress","cat":"client","icon":"globe","t":"Ingress & L7 Routing","s":"Host/path rules, TLS termination, controllers, and 404/502 forensics","quick":["Ingress is an L7 (HTTP/HTTPS) routing rulebook — host and path matches mapped to backend Services.","The Ingress object does NOTHING by itself; an ingress controller (nginx, traefik, cloud) must watch it and program a real proxy.","One LoadBalancer + one controller can front dozens of Services — versus paying for one cloud LB per Service."],"methods":["kubectl get ingress -A","kubectl describe ingress <name>","kubectl get ingressclass","kubectl logs -n ingress-nginx deploy/ingress-nginx-controller","kubectl create secret tls web-tls --cert=tls.crt --key=tls.key","curl -H 'Host: shop.example.com' http://<lb-ip>/"],"intro":["Service type LoadBalancer gets you external traffic, but it is L4 and expensive: every Service gets its own cloud load balancer and its own IP, and none of them understand URLs. Ingress moves the problem to layer 7. It is a rulebook — 'requests for shop.example.com/cart go to Service cart, /api goes to Service api' — evaluated by a single shared entry point. Think of it as the receptionist in an office building: one front door (one LB, one IP), and the receptionist reads who you are asking for (the Host header) and which department (the path), then walks you to the right office (Service).","Crucially, the Ingress resource is inert YAML. You must run an ingress controller — ingress-nginx, Traefik, HAProxy, or a cloud controller like AWS ALB — which watches Ingress objects and translates them into live proxy configuration. Creating an Ingress in a cluster with no controller is the #1 'why doesn't my Ingress work' answer: nothing errors, nothing happens. The ingressClassName field says which controller should claim the resource when several are installed.","The interview-current footnote: the Ingress API is officially frozen — stable, but getting no new features — and the Kubernetes project points new designs at the Gateway API (GatewayClass/Gateway/HTTPRoute), which splits infrastructure ownership from routing rules and supports more protocols. Know Ingress cold, and mention Gateway API to show you're current."],"facts":["The request path has two proxy hops that interviewers love to trace: client → cloud LB → ingress controller pod (which is itself exposed by a Service of type LoadBalancer) → its nginx/envoy config matches host+path → forwards to the backend pods. Mature controllers like ingress-nginx read EndpointSlices and proxy straight to pod IPs, skipping the backend Service's ClusterIP entirely — so a broken backend Service selector still breaks you, because the controller finds no endpoints to render into its upstream config.","pathType matters and defaults trip people: Exact matches only the literal path (/cart, not /cart/), Prefix matches on whole path segments (/api matches /api and /api/v1 but NOT /apiary), and ImplementationSpecific delegates to the controller — historically how nginx enabled regex paths. When multiple rules could match, longest/most-specific path wins, with Exact beating Prefix.","TLS termination is declared per-Ingress via a tls block: hosts list + secretName pointing at a kubernetes.io/tls Secret holding tls.crt and tls.key in the SAME namespace as the Ingress. The controller terminates HTTPS at the edge and forwards plain HTTP to pods by default; if the cert's SANs don't cover the requested host, the controller silently serves its self-signed 'Kubernetes Ingress Controller Fake Certificate' — a dead giveaway in browser cert errors.","A 404 from the controller means no rule matched: wrong Host header (curl by IP without -H 'Host: shop.example.com' matches no host rule and falls to the default backend), a pathType mismatch, or the Ingress wasn't claimed at all because ingressClassName is missing and no IngressClass is annotated ingressclass.kubernetes.io/is-default-class: \\"true\\".","A 502/503 means a rule matched but the upstream failed: backend Service name or port in the Ingress doesn't exist (kubectl describe ingress shows the error), the Service has no ready endpoints (readiness probes failing), or pods reset connections. describe ingress + get endpointslices for the backend Service is the 30-second triage that distinguishes routing problems (404) from backend problems (5xx).","Host rules support a single left-most wildcard: *.example.com matches foo.example.com but neither example.com itself nor a.b.example.com — the wildcard covers exactly one DNS label. Rules with no host at all match every hostname, which is why a hostless catch-all rule can shadow your named vhosts in su
