attern is removing self-provisioner from system:authenticated:oauth so only a pipeline/admin creates projects from a vetted template.`,t:`openshift`},{q:`An image that runs perfectly on Docker/kind CrashLoops on OpenShift with permission-denied (EACCES) errors writing to /var/lib/app, a directory the image chowned to UID 1000 at build time. What's the root cause?`,o:[`The image's base OS is incompatible with RHCOS`,`restricted-v2 assigns the pod an arbitrary UID from the project's uid-range annotation, and that UID doesn't own directories chowned to UID 1000 in the image`,`The PVC was mounted read-only by default`,`OpenShift blocks all writes under /var for security`],a:1,x:`restricted-v2 runs pods as a random UID from the namespace's uid-range annotation; directories baked to a fixed UID (like 1000) are unwritable to that arbitrary UID.`,t:`scc`},{q:`What's the recommended Dockerfile fix so an image works correctly under any arbitrary UID OpenShift assigns?`,o:[`Set USER 0 in the Dockerfile so the container always runs as root`,`chgrp -R 0 and chmod -R g=u on the app directories, so group 0 (which every assigned UID belongs to) can read/write them`,`Add the image's UID to the restricted-v2 SCC's users list`,`Mount an emptyDir over every directory the app writes to`],a:1,x:`OpenShift always adds the arbitrary UID to group 0; chgrp -R 0 + chmod -R g=u makes app directories writable regardless of which UID is assigned.`,t:`scc`},{q:"`oc describe rs` shows: 'unable to validate against any security context constraint... runAsUser: Invalid value: 0'. What does this admission error mean?",o:[`The cluster is out of available UIDs in the project's range`,`The service account referenced by the pod doesn't exist`,`The node's kubelet certificate expired`,`The pod (or its image) requests UID 0 (root), which restricted-v2 forbids — the image needs an arbitrary-UID-compatible fix, not a root grant`],a:3,x:`restricted-v2 rejects runAsUser=0. The senior fix is correcting the image's ownership assumptions, not granting a permissive SCC.`,t:`scc`},{q:`Which SCC is intended only for infrastructure daemonsets like CNI plugins, storage drivers, and node exporters that genuinely need to manage the host?`,o:[`privileged`,`anyuid`,`nonroot-v2`,`restricted-v2`],a:0,x:`privileged is the 'nuclear' SCC — privileged mode, host namespaces/paths, all capabilities, any UID — reserved for genuine infrastructure daemonsets.`,t:`scc`},{q:`A security audit flags that the 'default' service account in a project was granted the anyuid SCC. Why is this a serious finding?`,o:[`anyuid disables network policies for the namespace`,`anyuid has priority 10, which outranks restricted-v2, so every pod using that service account in the project silently becomes eligible for root-capable admission`,`anyuid grants cluster-admin RBAC automatically`,`anyuid is only a naming label with no functional effect`],a:1,x:`anyuid's priority 10 outranks restricted-v2, so granting it broadly (e.g. to a project's default SA) silently captures every pod in that project.`,t:`scc`},{q:`When multiple SCCs could admit the same pod, in what order does OpenShift's admission plugin pick one?`,o:[`Alphabetically by name only`,`Whichever SCC was created most recently`,`Highest priority first, then most restrictive, then alphabetically by name`,`Random selection among eligible SCCs for load balancing`],a:2,x:`SCC selection sorts eligible candidates by priority (highest wins), then most restrictive, then name — the exact tie-breaking order documented for SCC admission.`,t:`scc`},{q:"You need to run a third-party vendor image that hardcodes `USER 1001` with matching file ownership baked in, and you cannot rebuild it. What's the narrowest SCC to grant its service account?",o:[`anyuid`,`privileged`,`restricted-v2 — no grant is needed`,`nonroot-v2, since it allows any explicit non-zero UID without the namespace uid-range restriction`],a:3,x:`nonroot-v2 is the documented middle ground for vendor images with a hardcoded non-zero UID — narrower than anyuid, and restricted-v2 would still force a mismatched arbitrary UID.`,t:`scc`},{q:`A pod is admitted by restricted-v2 but events also show a Pod Security warning: 'would violate PodSecurity restricted:latest'. What does this indicate?`,o:[`Both SCCs and Kubernetes Pod Security Admission run on OpenShift; PSA labels are synced from available SCCs and can emit warnings even when the SCC is what actually enforces/admits the pod`,`The pod was actually rejected and never scheduled`,`PSA has fully replaced SCCs on this cluster`,`The warning means the SCC configuration is corrupted and must be recreated`],a:0,x:`SCCs and PSA coexist on OpenShift; PSA warn/audit labels are synced from the SCCs available to a namespace's service accounts, so a warning can appear even though the SCC is the actual enforcement mechanism.`,t:`scc`},{q:`A pod using a PVC under restricted-v2 still fails to write to the mounted volume even after fixing directory group ownership inside the image. What's the likely missing piece?`,o:[`The PVC's storage class doesn't support ReadWriteMany`,`pod.spec.securityContext.fsGroup isn't set (or falls outside the namespace's openshift.io/sa.scc.supplemental-groups range), so the volume was never chowned to a group the arbitrary UID belongs to`,`The SCC needs to be changed to privileged`,`fsGroup only applies to hostPath volumes, not PVCs`],a:1,x:`For PVCs, fsGroup drives the kubelet to chown/chmod the mounted volume; under restricted-v2 it must also fall within the namespace's supplemental-groups range.`,t:`scc`},{q:`You create a Route for www.example.com but browsers show a certificate warning for the cluster's default *.apps wildcard domain instead of your company's cert. What's the most likely cause?`,o:[`The Route's Service has no ready endpoints`,`You used passthrough termination, which always ignores custom domains`,`You created the Route without specifying edge termination cert/key (or DNS points at the wrong router shard), so the router served its default wildcard cert`,`OpenShift caches certificates for 24 hours before applying them`],a:2,x:`Seeing the *.apps wildcard cert for a custom domain maps to an edge route created without cert/key (or DNS pointing at the wrong shard) — exactly the documented cert-failure-to-mode mapping.`,t:`routes`},{q:`A Route returns 'Application is not available' — a page served by the router itself — even though the app's Deployment looks fine. Where should you look first?`,o:[`The BuildConfig logs for the last build`,`The ClusterVersion Operator's upgrade status`,`The project's ResourceQuota for CPU`,`The Service's selector, targetPort vs containerPort, and pod readiness — the router has the route admitted but no ready endpoints to send traffic to`],a:3,x:`'Application is not available' is served BY the router when it has the route but no ready endpoints; check Service selector, ports, and readiness first, not the app.`,t:`routes`},{q:`Your app needs mutual TLS (mTLS) directly between the client and the pod, with the pod itself terminating TLS. Which Route TLS mode fits?`,o:[`Passthrough`,`Edge`,`Re-encrypt`,`None — Routes can't carry TLS all the way to the pod`],a:0,x:`Passthrough never decrypts at the router; TLS (including mTLS) flows through via SNI, which is required when the app itself must terminate TLS.`,t:`routes`},{q:`Under re-encrypt termination, how does the router avoid needing an explicit destinationCACertificate on the Route while still trusting the backend's serving cert?`,o:[`The router trusts any self-signed cert on the internal SDN by default`,`By annotating the Service with service.beta.openshift.io/serving-cert-secret-name, so the service-ca operator mints/rotates a serving cert the router trusts by default`,`destinationCACertificate is never required for re-encrypt routes`,`By setting insecureEdgeTerminationPolicy: Allow`],a:1,x:`The service-ca operator's serving-cert-secret-name annotation mints a cert signed by the cluster's service CA, which the router trusts by default — the standard 'encrypted end-to-end, zero cert toil' combo.`,t:`routes`},{q:"A re-encrypt Route returns 503 even though the pods are healthy and `curl localhost` inside the pod works fine. What's the most likely cause?",o:[`The pod's liveness probe is misconfigured`,`The BuildConfig failed on its last push`,`The router (acting as a TLS client to the pod) can't validate the backend's serving cert — expired cert, SAN mismatch after a service rename, or wrong destinationCACertificate`,`The project ran out of image pull secrets`],a:2,x:`On re-encrypt, the router is the TLS client to the pod; a cert validation failure there produces exactly this symptom — 503 at the route while the app itself is fine.`,t:`routes`},{q:`Team A creates a Route for shared.example.com in a scratch namespace. Weeks later Team B tries to create a production Route with the same hostname in their own namespace and it's rejected. Why?`,o:[`Hostnames must be unique per cluster only for edge termination`,`DNS records, not OpenShift, own hostname uniqueness`,`Only cluster-admins can create Routes with custom hostnames`,`Route admission enforces hostname uniqueness — the oldest route claims the host, and a later route with the same host is rejected as HostAlreadyClaimed unless routeAdmission allows InterNamespaceAllowed`],a:3,x:`Route admission enforces hostname uniqueness cluster-wide; the oldest route wins and later duplicates are rejected unless cross-namespace sharing is explicitly allowed.`,t:`routes`},{q:`How does OpenShift implement the standard Kubernetes Ingress API under the hood?`,o:[`The router/Ingress Operator translates admitted Ingress objects into Route objects behind the scenes, so both Ingress and Route resources work`,`Ingress objects are rejected outright; only Route objects are supported`,`OpenShift runs a separate nginx-ingress controller alongside the HAProxy router for Ingress objects`,`Ingress objects are converted into NetworkPolicies, not Routes`],a:0,x:`Ingress objects work on OpenShift because the router translates admitted Ingress into Route objects behind the scenes, visible via ownerReferences.`,t:`routes`},{q:`Long-polling/websocket-like requests through a Route start failing with 504s after about 30 seconds, even though the backend is still working. What's the fix?`,o:[`Switch the Route from edge to passthrough termination`,`Set the haproxy.router.openshift.io/timeout annotation on the Route to extend HAProxy's default server timeout`,`Increase the pod's memory limit`,`Add more replicas to the Deployment`],a:1,x:`HAProxy's default server timeout (30s) is the classic cause of premature 504s on long polls; fix per-route with the haproxy.router.openshift.io/timeout annotation.`,t:`routes`},{q:`Per-tenant subdomain routes (spec.wildcardPolicy: Subdomain) are:`,o:[`Enabled by default on every IngressController`,`Only available with passthrough termination`,`Disabled by default; the IngressController must explicitly set routeAdmission.wildcardPolicy to WildcardsAllowed`,`A feature of DeploymentConfigs, not Routes`],a:2,x:`Wildcard routes are disabled by default and require the IngressController's routeAdmission.wildcardPolicy to be set to WildcardsAllowed.`,t:`routes`},{q:`A developer says: 'we pushed v2 to the registry but prod is still running v1.' What's the correct troubleshooting order to find the broken link?`,o:[`Immediately restart the Deployment's pods`,`Assume the BuildConfig is broken and re-run 'oc new-app'`,`Check the SCC assigned to the deployment's service account`,`Check whether the registry digest was actually re-imported into the ImageStreamTag, whether a trigger is wired from that tag to the Deployment, and whether the rollout actually fired — the chain is registry digest -> istag import -> trigger -> rollout`],a:3,x:`Each hop is separately wired; the documented debug approach is walking the chain registry digest -> istag import -> trigger -> rollout to find exactly which joint broke.`,t:`ocbuilds`},{q:`How does an S2I (source-to-image) build produce an image without a Dockerfile?`,o:[`A builder image's 'assemble' script injects and compiles/installs the source code into a copy of the builder image, then the 'run' script becomes the entrypoint`,`OpenShift auto-generates a Dockerfile from the source and builds it with buildah`,`It uses a hidden default Dockerfile shipped with every builder image`,`It copies the source directly into a fixed base image with no build step at all`],a:0,x:`S2I injects source into a builder image and runs its assemble script to produce the final image, with the run script as entrypoint — no Dockerfile involved.`,t:`ocbuilds`},{q:`You're migrating an old app from a DeploymentConfig to a Deployment. Which behavior difference is most likely to bite you?`,o:[`Deployments don't support rolling updates at all`,`DeploymentConfigs use ReplicationControllers and can have image triggers with automatic:false (silently not deploying on tag moves); Deployments need the image.openshift.io/triggers annotation to get equivalent ImageStreamTag integration`,`DeploymentConfigs can't be scaled with 'oc scale'`,`Only Deployments support S2I builds`],a:1,x:`DCs use ReplicationControllers and can silently skip deploys with automatic:false; Deployments need the image.openshift.io/triggers annotation to replicate ImageStreamTag-driven rollouts.`,t:`ocbuilds`},{q:`A Deployment in project app-prod shows ImagePullBackOff pulling an internal ImageStream image that lives in project shared-images. What's the canonical fix?`,o:[`Copy the image into the internal registry's root namespace`,`Grant the service account the anyuid SCC`,`Grant the app-prod service account the system:image-puller role in the shared-images project`,`Set the ImageStream's referencePolicy to source`],a:2,x:`Cross-project pulls of internal images need explicit RBAC: granting system:image-puller in the source project to the consuming SA is the documented fix for cross-namespace ImagePullBackOff.`,t:`ocbuilds`},{q:"What does `oc tag quay.io/org/app:v2 web:prod --scheduled` do?",o:[`Immediately and permanently copies the image into the internal registry, one time only`,`Schedules a BuildConfig to run nightly`,`Creates a CronJob that redeploys the app every 15 minutes`,`Makes the cluster periodically (roughly every ~15 minutes) poll the external registry and re-import the tag into the ImageStream when its digest changes`],a:3,x:`--scheduled makes the cluster poll the external registry on an interval (about 15 minutes) and re-import when the digest changes, as opposed to a one-time 'oc import-image'.`,t:`ocbuilds`},{q:`Your cluster keeps hitting Docker Hub rate limits because every pod pulls an external image directly. What ImageStream setting addresses this?`,o:[`Set referencePolicy to 'local' so pulls are rewritten through the internal registry, which caches the image and buffers against external rate-limiting/outages`,`Set referencePolicy to 'source' so pods always pull from the origin registry`,`Disable the ImageStream and use raw image strings instead`,`Increase the project's ResourceQuota for pods`],a:0,x:`referencePolicy: local routes pulls through the internal registry's cache — the documented standard answer to Docker Hub rate-limit incidents.`,t:`ocbuilds`},{q:`What's OpenShift's native answer to a multi-stage Docker build when the S2I builder alone would ship a fat toolchain?`,o:[`A single S2I build using a 'slim' variant of every builder image`,`A chained build: a first S2I build compiles with the full toolchain, then a second Docker-strategy build copies just the artifact into a slim runtime image via source images`,`Passing --squash to 'oc start-build'`,`Using a DeploymentConfig lifecycle hook to strip the toolchain post-deploy`],a:1,x:`Chained builds — an S2I compile step feeding a Docker-strategy image via source images — are the documented native equivalent of multi-stage Docker builds.`,t:`ocbuilds`},{q:`Several otherwise-green builds start failing right at the final push step, and you suspect the internal registry's storage is full from accumulated layers. What's the day-2 fix?`,o:[`Increase every BuildConfig's completionDeadlineSeconds`,`Switch all builds from S2I to Docker strategy`,`Run 'oc adm prune images' (and 'oc adm prune builds', or an ImagePruner CR for scheduled pruning) to reclaim registry storage`,`Delete and recreate all ImageStreams`],a:2,x:`Pruning is the documented day-2 duty for this exact symptom: registry-full presents as failed pushes at the end of otherwise-green builds; 'oc adm prune images'/builds or a scheduled ImagePruner CR fixes it.`,t:`ocbuilds`}],sre:[{q:`Your service has a 99.9% availability SLO over a rolling 30-day window. How many minutes of full downtime does the error budget allow per window?`,o:[`4.32 minutes`,`43.2 minutes`,`21.6 minutes`,`14.4 minutes`],a:1,x:`30 days = 43,200 minutes; the budget is (1 - 0.999) x 43,200 = 43.2 minutes. Each extra nine divides the budget by ten: 99.99% would allow only 4.32 minutes.`,h:`Budget = (1 - SLO) x window length.`,t:`slo`},{q:`Which of these is a well-formed SLI in the canonical SRE shape?`,o:[`Average CPU utilization across the fleet stays below 80%`,`The p99 latency graph looks flat during business hours`,`Requests returning non-5xx in under 300 ms, divided by total requests, measured at the load balancer`,`Number of deploys per week that required a rollback`],a:2,x:`The canonical SLI is good events / total events with a precise definition of both, measured at a stated point. CPU is a cause metric users never see, and the others lack the good/total ratio structure.`,t:`slo`},{q:`Your team's SLO is 99.9%, but for six straight months you've delivered 99.99%. According to the SRE book, what risk are you running?`,o:[`Users and dependent teams build on the implicit 99.99%, so a normal 99.9% month now breaks them`,`None — over-delivering on an SLO is always pure upside`,`The monitoring system will recalibrate the SLO upward automatically`,`The error budget will roll over and encourage reckless deploys next quarter`],a:0,x:`This is the Chubby lesson: dependents assume the delivered level, not the promised one. Google deliberately took Chubby down to burn budget and flush out hidden dependencies. Budgets don't roll over and SLOs don't auto-adjust.`,t:`slo`},{q:`An error budget policy typically specifies what consequence when the 30-day budget is fully exhausted?`,o:[`The SLO is lowered until the budget recovers`,`On-call staffing is doubled for the next month`,`All alerts are temporarily rerouted to tickets`,`Feature releases freeze and engineering effort shifts to reliability work`],a:3,x:`The policy is a pre-agreed contract: budget remaining means dev ships at will; budget exhausted means releases pause and reliability work takes priority until the rolling window recovers. It converts the dev-vs-ops argument into arithmetic.`,t:`slo`},{q:`Your backend metrics show 100% success, but users report the site is down. Which SLI measurement-point mistake most plausibly explains this?`,o:[`The SLO window is calendar-month instead of rolling`,`You measure only at the application servers, missing failures at the load balancer, DNS, or client side`,`You included health-check traffic in the total-events denominator`,`You set the latency threshold at p95 instead of p99`],a:1,x:`Server-side metrics can't see requests that never arrive (LB overload, DNS, TLS) or client-side failures like a broken JS bundle. The SRE book recommends measuring close to the user, supplementing server metrics with client-side or black-box probes.`,t:`slo`},{q:`How many minutes of monthly downtime does a 99.95% SLO allow over 30 days?`,o:[`21.6 minutes`,`43.2 minutes`,`10.8 minutes`,`4.32 minutes`],a:0,x:`0.05% of 43,200 minutes = 21.6 minutes — exactly half the 99.9% budget. Interviewers expect the ladder: 99.9% = 43.2 min, 99.95% = 21.6 min, 99.99% = 4.32 min.`,t:`slo`},{q:`You're setting the first SLO for a new API. Per the SRE book, the target should primarily be based on what?`,o:[`Whatever availability the service achieved over its last quarter`,`The tightest number engineering believes is technically achievable`,`What users actually need from the service`,`The highest SLA any competitor publishes`],a:2,x:`Start from user needs, not current performance — basing the target on today's dashboard enshrines accidents as promises. Current performance informs feasibility, but the objective is derived from what users require.`,t:`slo`},{q:`Error budget math: on a 99.9% SLO over 30 days (720 hours), a burn rate of 6 sustained for its full 6-hour alert window consumes how much budget?`,o:[`2%`,`5%`,`10%`,`36%`],a:1,x:`Budget consumed = burn rate x window / period = 6 x 6h / 720h = 5%. The same math gives 14.4 x 1/720 = 2% for the fast tier and 1 x 72/720 = 10% for the 3-day ticket tier.`,h:`consumed = burnRate x windowHours / periodHours.`,t:`alerting`},{q:`In multiwindow multi-burn-rate alerting, why pair the 1-hour long window with a 5-minute short window that must ALSO exceed the threshold?`,o:[`The short window raises recall by catching slower burns`,`It lets the alert fire before any budget is consumed`,`Prometheus cannot evaluate 1-hour range vectors reliably`,`It improves reset time — the alert clears quickly after recovery instead of firing while stale errors age out of the long window`],a:3,x:`After a 15-minute outage ends, the bad data sits in the 1-hour window for ~45 more minutes. Requiring the short window to also exceed the threshold confirms you're still actively burning budget, so the alert resets within minutes. The guideline is short = 1/12 of long.`,t:`alerting`},{q:`Your on-call gets paged at 3am: 'node CPU > 90% for 10 minutes.' Error rate and latency SLIs are normal. What does SRE monitoring doctrine say about this page?`,o:[`It's a cause-based alert with no user-visible symptom — it should be a ticket or dashboard, not a page`,`It's valid — saturation is a golden signal, so any CPU breach must page`,`The threshold should simply be raised to 95%`,`It should page only during business hours`],a:0,x:`Pages should reflect symptoms — user-visible impact — while causes like CPU feed diagnosis. Saturation is worth monitoring, but a cause alert with healthy SLIs is exactly the non-actionable 3am page that breeds alert fatigue.`,t:`alerting`},{q:`What does a burn rate of exactly 1 mean?`,o:[`The service is failing 1% of requests`,`The error budget was exhausted in the last hour`,`You're consuming budget at precisely the rate that exhausts it exactly at the end of the SLO window`,`No errors are occurring at all`],a:2,x:`Burn rate is relative to the SLO period: 1x on a 30-day window means the budget lasts exactly 30 days. On a 99.9% SLO that's a steady 0.1% error rate; 2x exhausts in 15 days; a total outage is ~1000x, gone in about 43 minutes.`,t:`alerting`},{q:`A dependency is silently failing 0.12% of your requests — just above your 99.9% SLO's 0.1% budget rate. Per the SRE Workbook tiers, how should this surface?`,o:[`A page from the 14.4x/1-hour tier`,`A ticket from the 1x burn-rate / 3-day window tier`,`It cannot be detected by burn-rate alerting at all`,`An immediate SEV1 incident declaration`],a:1,x:`A ~1.2x burn is far below the paging tiers (14.4x and 6x) but the slow-burn tier — burn rate 1 over a 3-day window, 10% of budget — catches exactly this leak and files a ticket. It's urgent for the month's budget, not for 3am.`,t:`alerting`},{q:`The SRE Workbook's rule of thumb for sizing the short window relative to the long window is:`,o:[`Short window = 1/12 of the long window`,`Short window = half of the long window`,`Short window = fixed 1 minute regardless of long window`,`Short window = the long window minus the sync period`],a:0,x:`The Workbook recommends making the short window 1/12 the duration of the long one — hence the canonical pairs 1h/5m, 6h/30m, and 3d/6h.`,t:`alerting`},{q:`Which set is the SRE book's four golden signals?`,o:[`Rate, Errors, Duration, Saturation`,`Utilization, Saturation, Errors, Availability`,`Latency, Throughput, Capacity, Cost`,`Latency, Traffic, Errors, Saturation`],a:3,x:`Latency (split by success vs failure — fast 500s skew averages), traffic, errors, and saturation. RED (Rate/Errors/Duration) is the request-centric variant for services; USE (Utilization/Saturation/Errors) is the resource-centric one.`,t:`alerting`},{q:`A total outage begins on your 99.9%/30-day service — 100% of requests failing. Roughly how long until the entire monthly error budget is gone?`,o:[`30 hours`,`7.2 hours`,`About 43 minutes`,`3 days`],a:2,x:`100% errors on a 0.1% budget is a 1000x burn rate: 43,200 minutes / 1000 = 43.2 minutes to total exhaustion. This is why fast-burn tiers page within minutes.`,t:`alerting`},{q:`You're on-call and a SEV1 begins: checkout errors spiked 10 minutes after a deploy. Per Google's incident doctrine, your FIRST priority is:`,o:[`Attach a profiler and find the root cause in the new code`,`Mitigate — roll back the deploy to stop user impact; root cause waits for the postmortem`,`Write the postmortem timeline while events are fresh`,`Email stakeholders a detailed technical analysis`],a:1,x:`The priority order is stop the bleeding, restore service, then preserve evidence. Generic mitigations — rollback, feature-flag off, failover, load shedding — work before you understand the bug. Understanding is the postmortem's job.`,t:`incidents`},{q:`During a managed incident, what does the Incident Commander actually do?`,o:[`Holds the big picture: assigns roles, tracks state, sets priorities — and deliberately does NOT debug`,`Personally drives the debugging session since they're most senior`,`Writes and sends all external customer communications`,`Approves each individual command run in production`],a:0,x:`The IC's job is coordination, borrowed from the emergency-services Incident Command System. Hands-on work belongs to the Ops Lead's team; communications belong to the Comms Lead. An IC who starts debugging abandons the big picture.`,t:`incidents`},{q:`Per the SRE book, which group should be the ONLY one modifying the production system during an incident?`,o:[`Anyone with production access, to maximize parallelism`,`The Incident Commander personally`,`The operations team working under the Ops Lead`,`The service's original developers`],a:2,x:`The SRE book states the operations team should be the only group modifying the system during an incident. Freelance fixes from the sidelines cause conflicting changes — how one outage becomes two.`,t:`incidents`},{q:`You've been debugging a production issue alone for over an hour with no resolution, and it may be customer-visible. What does Google's guidance say?`,o:[`Keep going — declaring an incident for something you might solve soon looks bad`,`Escalate only if a manager approves`,`Wait until a second customer complaint arrives`,`Declare an incident now — 'unsolved after an hour' and 'customer-visible' are both explicit declaration criteria`],a:3,x:`Google's triggers: a second team is needed, the outage is customer-visible, or the issue is unsolved after an hour of focused analysis. Declaring early is cheap; grinding solo at 3am on a real outage is not.`,t:`incidents`},{q:`It's hour six of an incident and you're handing off command before rest. What does a correct handoff look like?`,o:[`Post 'logging off, someone take over' in the channel and disconnect`,`Explicitly state 'You're now the incident commander' and wait for firm acknowledgment before leaving`,`Update the state doc's owner field and assume it's noticed`,`CC the incoming IC on the last stakeholder email`],a:1,x:`The SRE book's example is nearly verbatim: the outgoing IC says 'You're now the incident commander, okay?' and waits for explicit confirmation. Ambiguous handoffs — where everyone assumes someone else has command — are how long incidents fail.`,t:`incidents`},{q:`What is the Communications Lead's core function during an incident?`,o:[`Issue periodic updates to stakeholders on a fixed cadence so responders aren't interrupted for status`,`Negotiate SLA credits with affected customers in real time`,`Transcribe every command run into the postmortem`,`Approve the Ops Lead's mitigation choices`],a:0,x:`The Comms Lead is the public face, posting updates at a regular cadence (even 'no change, next update at :30'). This stops executives and support from pinging the people doing the work — protecting responder focus is the whole point.`,t:`incidents`},{q:`Errors began 20 minutes ago, right after a config deploy; the change diff is large and unclear. Which mitigation is usually fastest and safest?`,o:[`Read the entire diff until you find the bug, then hotfix forward`,`Add more replicas to absorb the errors`,`Roll back the deploy immediately and analyze the diff afterward`,`Restart all pods to clear possible bad state`],a:2,x:`Strong correlation with a recent change makes rollback the generic, fast, low-risk mitigation — no understanding of the bug required. Fix-forward under pressure and speculative restarts both extend user impact while you guess.`,t:`incidents`},{q:`What does 'blameless' actually mean in a blameless postmortem?`,o:[`No individual actions are ever mentioned in the document`,`Assume everyone acted with good intent on the information they had, and analyze why the system made the failure possible`,`No one can face consequences for anything, including sabotage`,`The postmortem must avoid naming a root cause`],a:1,x:`Blameless means the analysis targets the system, not the person: names and actions appear in the timeline, but the question is 'why did the pipeline allow this?' not 'why did this engineer err?'. Genuine recklessness is a management matter handled outside the document.`,t:`postmortem`},{q:`After a harsh, name-and-shame incident review, what does SRE doctrine predict will happen in your organization's future incidents?`,o:[`Engineers become more careful, so incidents get shorter`,`Nothing changes — review tone doesn't affect operations`,`More postmortems get written, improving learning`,`People hide problems, delay escalation, and under-report near-misses — the incident data supply collapses`],a:3,x:`The SRE book: where finger-pointing prevails, 'people will not bring issues to light for fear of punishment.' The goal shifts from system improvement to self-protection — you pay full outage cost and receive none of the learning. This is the aviation/healthcare lesson blamelessness imports.`,t:`postmortem`},{q:`Which event should trigger a postmortem even if user impact was tiny?`,o:[`Data loss of any kind, or an incident discovered by a human rather than by monitoring`,`Any deploy that took longer than planned`,`Every on-call shift, as routine practice`,`A dashboard being slow to load for one engineer`],a:0,x:`Standard triggers include ANY data loss, user-visible downtime beyond a threshold, on-call intervention, long resolution times, and monitoring failure — a human finding the incident before an alert did is itself a defect worth analyzing.`,t:`postmortem`},{q:`A postmortem's action items are most likely to actually prevent recurrence if each one has:`,o:[`A commitment from the team to 'be more careful next time'`,`A long list of every hypothetical failure mode`,`A named individual owner, a priority, and a tracked ticket — biased toward prevention and detection fixes`,`Sign-off from the engineer who caused the incident`],a:2,x:`A team name as owner is nobody; 'be more careful' patches the human instead of the system and is worthless. Senior-engineer review of drafts exists partly to verify AIs are concrete, owned, and would genuinely prevent or detect recurrence.`,t:`postmortem`},{q:`Your VP wants 'MTTR reduced 20% this quarter' as the team's headline reliability KPI. What's the strongest caveat you should raise?`,o:[`MTTR can only be improved by hiring more on-callers`,`MTTR is defined identically everywhere, so the target is unambiguous`,`MTTR should be replaced with a count of postmortems written`,`With few, heterogeneous incidents the mean is statistically fragile — one long incident swamps it — and a targeted metric invites gaming like early closure or severity downgrades`],a:3,x:`One 6-hour incident among nine 5-minute rollbacks doubles MTTR while signaling nothing. Distributions and per-class analysis beat single means, 'R' itself is ambiguous (repair/recover/resolve), and metrics-as-targets get gamed. Postmortem counts are worse — they punish honest declarers.`,t:`postmortem`},{q:`What is Google's 'Wheel of Misfortune' exercise?`,o:[`Role-playing past postmortems as live disaster scenarios so engineers practice incident response`,`Randomly assigning blame for an incident to a team member`,`A lottery deciding who takes the next on-call shift`,`Chaos-engineering tooling that kills random production pods`],a:0,x:`Wheel of Misfortune replays real past incidents as theater — an engineer responds live while a peer plays the system — converting the postmortem archive into practiced muscle memory. It sits alongside DiRT exercises and 'Postmortem of the Month' in reinforcing the culture.`,t:`postmortem`},{q:`During review, a senior engineer asks your postmortem draft: 'where did we get lucky?' Why is that section valuable?`,o:[`It fills mandatory template space required for sign-off`,`It credits individual heroics so responders feel appreciated`,`It provides legal cover by documenting due diligence`,`It names latent failures that didn't fire this time — the stale-but-usable backup, the engineer who happened to be awake — so they're fixed before luck runs out`],a:3,x:`'Where we got lucky' surfaces near-misses inside the incident: conditions that would have made it far worse. Documenting them turns luck into action items, which is precisely the learning blameless culture is designed to extract.`,t:`postmortem`},{q:`In Kubernetes HPA, 'CPU utilization: 80%' means the pod is using 80% of what?`,o:[`The node's allocatable CPU`,`The pod's CPU limit`,`The pod's CPU resource request`,`The cluster's total CPU capacity`],a:2,x:`HPA utilization = actual usage / resource REQUEST — limits play no part. A pod requesting 500m and using 400m is at 80% even with a 2-core limit. Corollary: pods without CPU requests break CPU-based HPA entirely.`,t:`autoscaling`},{q:`Your Deployment runs 4 replicas averaging 90% CPU-of-requests; the HPA target is 60%. How many replicas does the HPA compute?`,o:[`5`,`6`,`8`,`12`],a:1,x:`desiredReplicas = ceil(currentReplicas x currentMetric / targetMetric) = ceil(4 x 90/60) = ceil(6.0) = 6. The controller evaluates roughly every 15s with a 10% tolerance band around ratio 1.0.`,h:`ceil(current x actual/target).`,t:`autoscaling`},{q:`A teammate proposes running HPA and VPA together, both driven by CPU, 'so pods are always right-sized AND right-counted.' Why is this a known anti-pattern?`,o:[`VPA rewrites CPU requests, which instantly changes the utilization percentage HPA computes — two controllers actuating on one signal oscillate`,`VPA and HPA cannot be installed in the same cluster`,`HPA always takes precedence, so VPA becomes a silent no-op`,`It works fine and is the recommended default`],a:0,x:`Because HPA utilization = usage/request, a VPA request change moves every pod's percentage with zero change in real load: VPA raises requests, utilization falls, HPA scales in, per-pod load rises, VPA raises requests again. Safe splits: HPA on CPU + VPA on memory, or HPA on a custom metric (RPS/queue depth).`,t:`autoscaling`},{q:`Traffic to your API spikes every few minutes with quiet gaps between. Which HPA mechanism prevents replicas being deleted during a brief lull right before the next spike?`,o:[`The 10% tolerance band on the metric ratio`,`The 5-minute CPU initialization period`,`The Metrics Server's 15-second scrape interval`,`The scale-down stabilization window (default 300s), which keeps the highest recommendation from the last 5 minutes`],a:3,x:`Scale-down uses a 300-second stabilization window by default: the HPA acts on the maximum recommendation seen in that span, so short dips don't remove capacity you're about to need. Scale-up has no default stabilization; both are tunable via the v2 behavior field.`,t:`autoscaling`},{q:`Your HPA scales pods up during a spike but they sit Pending for 4 minutes before serving. The cluster runs Cluster Autoscaler on fixed node groups. What's the widely-cited advantage of Karpenter here?`,o:[`Karpenter removes the need for pod resource requests`,`It provisions right-sized instances directly from the pending pods' aggregate resource shapes, skipping node groups for faster, better bin-packed capacity`,`Karpenter scales the pods themselves, replacing the HPA`,`It caches pre-pulled images so pods start faster`],a:1,x:`Cluster Autoscaler grows pre-defined node groups (e.g., ASGs); Karpenter watches pending pods and launches instance types matched to their actual aggregate needs, typically cutting provisioning latency and cost. Either way HPA -> Pending -> node scale-up is the slow chain, which is why teams add headroom or balloon pods.`,t:`autoscaling`},{q:`Your queue workers are I/O-bound: during a backlog, Kafka lag explodes while worker CPU stays low, so the CPU-based HPA never scales. What's the standard fix?`,o:[`Lower the CPU target to 5% so any activity triggers scaling`,`Switch the HPA to memory utilization instead`,`Use KEDA (or an external/custom metric HPA) to scale on queue depth or consumer lag — event-driven scaling that can even go to zero`,`Remove CPU requests so utilization reads as infinite`],a:2,x:`Queue depth is the true demand signal for workers; CPU lies when consumers block on I/O. KEDA provides 60+ scalers (SQS, Kafka lag, Prometheus queries, cron) and supports scale-to-zero, which vanilla HPA cannot (minReplicas >= 1). Memory is a trap since many runtimes never release it.`,t:`autoscaling`}]},Zn=e=>Kn.find(t=>t.id===e)?.qs??[],Qn={core:[...Zn(`seed-core`),...Xn.core],netstore:Xn.netstore,troubleshoot:Xn.troubleshoot,openshift:[...Zn(`seed-plat`),...Xn.openshift],sre:[...Zn(`seed-sre`),...Xn.sre]};function $n(e){let t=[...e];for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t}var er=(e,t)=>$n(e).slice(0,Math.min(t,e.length));function tr(){return $n([...er(Qn.core,3),...er(Qn.netstore,2),...er(Qn.troubleshoot,3),...er(Qn.openshift,2),...er(Qn.sre,2)])}var nr=Object.values(Qn).reduce((e,t)=>e+t.length,0),rr=[{id:`core`,n:1,t:`Kubernetes Core`,badge:`📦 Pod Wrangler`,pool:`core`,draw:8,w:25},{id:`netstore`,n:2,t:`Networking & Storage`,badge:`🕸️ Wire Walker`,pool:`netstore`,draw:8,w:20},{id:`troubleshoot`,n:3,t:`Troubleshooting Scenarios`,badge:`🚑 Incident Surgeon`,pool:`troubleshoot`,draw:10,w:25},{id:`openshift`,n:4,t:`OpenShift`,badge:`🎩 Route Master`,pool:`openshift`,draw:8,w:15},{id:`builder`,n:5,t:`Runbook Builder`,badge:`📋 Runbook Ronin`,builder:!0},{id:`sre`,n:6,t:`SRE & Operations`,badge:`🔥 Budget Keeper`,pool:`sre`,draw:8,w:15},{id:`boss`,n:7,t:`Mock Round`,badge:`🏆 Offer Magnet`,boss:!0,draw:12}],ir=`mcpquest.guide`,ar={provider:`claude-app`,baseUrl:`http://localhost:1234/v1`,model:``,apiKey:``};function or(){try{return{...ar,...JSON.parse(localStorage.getItem(ir)||`{}`)}}catch{return{...ar}}}function sr(e){return e.provider===`claude-app`||e.provider===`chatgpt-app`?!0:e.provider===`local`?!!e.baseUrl:!!e.apiKey}var cr=e=>e.provider===`claude-app`||e.provider===`chatgpt-app`;async function*lr(e){let t=e.body.getReader(),n=new TextDecoder,r=``;for(;;){let{done:e,value:i}=await t.read();if(e)break;r+=n.decode(i,{stream:!0});let a=r.split(`
